  function dbl(){
    const h=hands[ai];if(h.c.length!==2||bank<h.bet)return;

  }
  function split(){
    const h=hands[ai];
    if(hands.length!==1||h.c.length!==2||tv(h.c[0])!==tv(h.c[1])||bank<h.bet)return;
    bank-=h.bet;save();
    const h2={c:[h.c.pop()],bet:h.bet,done:false,split:true,res:null};

    dz.append(dl);

    /* tengah: lingkaran taruhan / banner hasil */

/* ---------- TEXAS HOLD'EM (kamu + 3 bot) ---------- */
function equity(hole,board,opps,sims){
  const known=new Set(hole.concat(board).map(c=>c.r*4+c.s));
  const rest=newDeck().filter(c=>!known.has(c.r*4+c.s));
  const need=5-board.length+opps*2;
  let win=0;
  for(let s=0;s<sims;s++){
    const a=rest.slice();
    for(let i=0;i<need;i++){const j=i+rnd(a.length-i);[a[i],a[j]]=[a[j],a[i]]}
    const full=board.concat(a.slice(0,5-board.length));
    const mine=best7(hole.concat(full)).n;
    let top=-1,ties=0;
    for(let o=0;o<opps;o++){
      const k=5-board.length+o*2;
      const n=best7([a[k],a[k+1]].concat(full)).n;
      if(n>top){top=n;ties=1}else if(n===top)ties++;
    }
    if(mine>top)win+=1;else if(mine===top)win+=1/(ties+1);
  }
  return win/sims;
}
/* ---------- TEXAS HOLD'EM ONLINE (4 kursi: room atau main sendiri lawan bot) ----------
   Host menjalankan seluruh permainan. Kartu lawan tidak pernah dikirim sampai showdown. */
/* label kombo untuk teks "Kombo terbaik" */
function comboLabel(v){
  return ['Kartu tertinggi','Pasangan','Dua pasang','Tiga sejenis','Straight','Flush','Full house','Empat sejenis',v[1]===14?'Royal flush':'Straight flush'][v[0]]||'';
}
/* kombo terbaik dari 2 sampai 7 kartu */
function bestCombo(cs){
  if(cs.length===7)return best7(cs).v;
  if(cs.length===6){
    let b=null,bn=-1;
    for(let i=0;i<6;i++){const v=evalHand(cs.filter((_,j)=>j!==i));const n=num(v);if(n>bn){bn=n;b=v}}
    return b;
  }
  return evalHand(cs);
}
function Holdem(box,arg){
  const T=timers();
  const root=el('div','hld pro');box.appendChild(root);
  const SB=10,BB=20;
  const hub=RoomHub(root,'holdem',arg,begin,'No-limit, blind 10/20, side pot dan all-in. Empat kursi: buat room atau main sendiri.');
  let net=null,host=true,seats=[],me=0,P=[],V=null,hn=0,mid=0,deck=[],board=[],btnI=-1,sbI=-1,bbI=-1,cur=-1,cb=0,minR=BB;
  let phase='idle',logs=[],result=null,waitFor=-1,gen=0,myHole=null,myHn=-1,rt=0,lastMid=-1,recMid=-1;
  let lastAct=null,actN=0,bfrom=0,dropN=0,boardKey='';
  const selfU=()=>net?net.uid:'me';
  const later=(fn,ms)=>{const g=gen;T.after(()=>{if(g===gen)fn()},ms)};
  const logit=t=>{logs.push(t);if(logs.length>40)logs.shift()};
  const potOf=()=>P.reduce((s,p)=>s+p.total,0);
  const aliveCnt=()=>P.filter(p=>!p.out).length;
  const isStreetH=()=>['preflop','flop','turn','river'].includes(phase);
  const isStreetV=()=>!!V&&['preflop','flop','turn','river'].includes(V.phase);
  function nextAlive(i){for(let k=1;k<=4;k++){const j=((i+k)%4+4)%4;if(!P[j].out)return j}return -1}
  function firstLive(i){for(let k=1;k<=4;k++){const j=((i+k)%4+4)%4;if(!P[j].folded&&!P[j].out)return j}return -1}
  function pay(p,a){a=Math.min(a,p.stack);p.stack-=a;p.bet+=a;p.total+=a;if(p.stack===0)p.allIn=true}
  const needs=p=>!p.folded&&!p.allIn&&(!p.acted||p.bet<cb);
  function findActor(from){
    const can=P.filter(p=>!p.folded&&!p.allIn);
    if(can.length<=1&&can.every(p=>p.bet>=cb))return -1;
    for(let k=0;k<4;k++){const i=(from+k)%4;if(needs(P[i]))return i}
    return -1;
  }
  function pubOf(){
    const rev=phase==='showdown'&&!!result&&result.reveal;
    return{hn,mid,phase,board:board.slice(),cur,cb,minR,btnI,sbI,bbI,waitFor,pot:potOf(),logs:logs.slice(-6),result,act:lastAct,bfrom,
      P:P.map(p=>({n:p.n,bot:p.bot,uid:p.uid,i:p.i,stack:p.stack,bet:p.bet,total:p.total,folded:p.folded,allIn:p.allIn,out:p.out,
        hole:(rev&&!p.folded&&!p.out)?p.hole:null,vn:(rev&&p.vec)?handName(p.vec):''}))};
  }
  function commit(){
    V=JSON.parse(JSON.stringify(pubOf()));
    if(net)net.pub(V);
    afterSync();render();
  }
  function afterSync(){
    if(!V)return;
    if(V.mid!==lastMid){lastMid=V.mid;Stats.arm('holdem')}
    if(V.phase==='end'&&recMid!==V.mid){recMid=V.mid;Stats.rec('holdem',V.result.winners.includes(me)?'w':'l')}
  }
  function startHand(){
    gen++;
    P.forEach(p=>{if(p.stack<=0)p.out=true});
    if(aliveCnt()<2){
      const w=P.find(p=>!p.out);phase='end';waitFor=-1;
      result={lines:[(w?w.n:'-')+' menang permainan.'],reveal:false,winners:w?[w.i]:[]};
      commit();return;
    }
    hn++;deck=shuffle(newDeck());board=[];result=null;waitFor=-1;bfrom=0;lastAct=null;
    P.forEach(p=>{p.hole=p.out?[]:[deck.pop(),deck.pop()];p.bet=0;p.total=0;p.folded=p.out;p.allIn=false;p.acted=false;p.vec=null;p.vn=''});
    btnI=nextAlive(btnI);
    const heads=aliveCnt()===2;
    if(heads){sbI=btnI;bbI=nextAlive(btnI)}else{sbI=nextAlive(btnI);bbI=nextAlive(sbI)}
    const first=heads?sbI:nextAlive(bbI);
    pay(P[sbI],SB);pay(P[bbI],BB);
    cb=Math.max(P[sbI].bet,P[bbI].bet);minR=BB;phase='preflop';cur=first;
    logs=['Hand #'+hn+'. Blind '+SB+'/'+BB+'.'];
    myHole=P[me].hole;myHn=hn;
    if(net)P.forEach(p=>{if(!p.bot&&!p.out&&p.uid!==selfU())net.priv(p.uid,{hn,hole:p.hole})});
    commit();later(advance,700);
  }
  function advance(){
    if(!isStreetH())return;
    const live=P.filter(p=>!p.folded);
    if(live.length===1){award(live[0]);return}
    const n=findActor(cur);
    if(n<0){endStreet();return}
    cur=n;
    if(P[n].bot){waitFor=-1;commit();later(()=>botAct(n),650+rnd(600))}
    else{waitFor=n;commit()}
  }
  function endStreet(){
    P.forEach(p=>{p.bet=0;p.acted=false});cb=0;minR=BB;
    if(phase==='river'){showdown();return}
    bfrom=board.length;
    if(phase==='preflop'){phase='flop';board.push(deck.pop(),deck.pop(),deck.pop())}
    else if(phase==='flop'){phase='turn';board.push(deck.pop())}
    else if(phase==='turn'){phase='river';board.push(deck.pop())}
    cur=firstLive(btnI);waitFor=-1;
    const can=P.filter(p=>!p.folded&&!p.allIn).length;
    commit();later(advance,can<=1?1100:450);
  }
  function act(i,kind,amt){
    lastAct={i,n:++actN};
    const p=P[i];waitFor=-1;
    if(kind==='fold'){p.folded=true;logit(p.n+' fold')}
    else if(kind==='call'){
      const a=Math.min(cb-p.bet,p.stack);pay(p,a);p.acted=true;
      logit(a===0?p.n+' check':p.n+' call '+a+(p.allIn?' (all-in)':''));
    }else{
      const to=Math.min(amt,p.bet+p.stack),size=to-cb,was=cb===0;
      pay(p,to-p.bet);
      if(size>=minR)minR=size;
      cb=Math.max(cb,to);p.acted=true;
      P.forEach(q=>{if(q!==p)q.acted=false});
      logit(p.n+(was?' bet ':' raise ke ')+to+(p.allIn?' (all-in)':''));
    }
    cur=(i+1)%4;
    commit();later(advance,300);
  }
  function onAction(i,kind,amt){
    if(!isStreetH()||waitFor!==i)return;
    const p=P[i];
    if(kind==='fold')act(i,'fold');
    else if(kind==='raise'){
      const maxTo=p.bet+p.stack;
      if(maxTo<=cb){act(i,'call');return}
      let to=Math.floor(+amt)||0;
      to=Math.max(Math.min(to,maxTo),Math.min(cb+minR,maxTo));
      act(i,'raise',to);
    }else act(i,'call');
  }
  function botAct(i){
    if(!isStreetH()||cur!==i||P[i].folded||P[i].allIn||P[i].out)return;
    const p=P[i],toCall=Math.min(cb-p.bet,p.stack),pot=potOf();
    const opp=P.filter(q=>!q.folded&&q!==p).length;
    const e=equity(p.hole,board,opp,130)+(Math.random()-.5)*.06;
    const base=1/(opp+1),odds=toCall/(pot+toCall||1),maxTo=p.bet+p.stack;
    const canRaise=maxTo>cb;
    const doRaise=()=>{
      let to;
      if(e>.8&&Math.random()<.4)to=maxTo;
      else{const size=Math.round(pot*(.5+Math.random()*.6)/10)*10;to=Math.round(Math.max(cb+minR,cb+size)/10)*10}
      to=Math.min(to,maxTo);
      if(to<=cb)act(i,'call');else act(i,'raise',to);
    };
    if(toCall===0){
      if(canRaise&&(e>base*1.9||(e>base*1.35&&Math.random()<.4*p.agg)||Math.random()<.05*p.agg))doRaise();
      else act(i,'call');
    }else{
      if(e<odds*.92&&Math.random()>.06)act(i,'fold');
      else if(canRaise&&e>base*2&&Math.random()<.55*p.agg)doRaise();
      else act(i,'call');
    }
  }
  function award(w){
    const amt=potOf();w.stack+=amt;
    logit(w.n+' menang '+amt+' (yang lain fold)');
    phase='showdown';waitFor=-1;
    result={lines:[w.n+' menang '+amt+' karena semua lawan fold.'],reveal:false,winners:[w.i]};
    commit();later(startHand,3500);
  }
  function showdown(){
    phase='showdown';waitFor=-1;
    const live=P.filter(p=>!p.folded);
    live.forEach(p=>{const b=best7(p.hole.concat(board));p.vec=b.v;p.sc=b.n});
    const levels=[...new Set(live.map(p=>p.total))].sort((a,b)=>a-b);
    let prev=0,paid=0;const lines=[],wins=new Set();
    levels.forEach(L=>{
      let amount=0;P.forEach(p=>{amount+=Math.max(0,Math.min(p.total,L)-prev)});
      const cand=live.filter(p=>p.total>=L);
      prev=L;if(amount<=0)return;
      const top=Math.max(...cand.map(p=>p.sc)),ws=cand.filter(p=>p.sc===top);
      const share=Math.floor(amount/ws.length),rem=amount-share*ws.length;
      ws.forEach((p,k)=>{p.stack+=share+(k===0?rem:0);wins.add(p.i)});
      paid+=amount;
      lines.push(ws.map(p=>p.n).join(' & ')+' menang '+amount+' dengan '+handName(ws[0].vec));
    });
    const left=potOf()-paid;
    if(left>0&&wins.size){const w=P[[...wins][0]];w.stack+=left}
    lines.forEach(logit);
    result={lines,reveal:true,winners:[...wins]};

  function guestFlow(pre){

  function join(c,reset){
    leave(false);topic='maroe-chess-'+c;role='guest';
    let tries=0,started=false;
    const fail=t=>{leave(false);netNote(t);reset()};
    const joinT=T.every(()=>{
      if(started||mode==='net'){clearInterval(joinT);return}
      if(++tries>5){clearInterval(joinT);fail('Room tidak ditemukan atau temanmu belum membuatnya. Periksa kodenya.');return}
      post({t:'join'},1);
    },3500);
    onNet=m=>{
      if(m.t==='_open'){if(mode==='net')return;netNote('Mencari room…');post({t:'join'},1);return}
      if(m.t==='_err'){netNote('Sulit menghubungi server. Mencoba lagi…'+Relay.hint());return}
      if(m.t==='start'&&m.g===uid){if(mode==='net')return;started=true;peer=m.u;begin('net','b');return}
      if(m.t==='full'&&m.g===uid){started=true;clearInterval(joinT);fail('Room ini sudah penuh.');return}
      if(m.u===peer)gameMsg(m);
    };
    openES();
  }
  function startNet(){
    lastPeer=Date.now();stale=false;
    if(pingT)clearInterval(pingT);
    pingT=setInterval(()=>{
      if(dead||mode!=='net'){return}
      if(Date.now()-lastSent>=60000)post({t:'ping'},0);
      if(!over){const s=Date.now()-lastPeer>150000;if(s!==stale){stale=s;render()}}
    },30000);
  }
  let lastPeer=0;
  function gameMsg(m){
    lastPeer=Date.now();if(stale){stale=false;if(st)render()}
    if(mode!=='net')return;
    if(m.t==='move'){
      if(over||st.t===me||m.n!==hist.length)return;
      const mv=CHE.legal(st).find(x=>x.f===m.f&&x.t===m.to&&(x.p||null)===(m.p||null));
      if(mv)doMove(mv,true);
    }else if(m.t==='bye'){
      if(!over){over={over:1,res:'lost'};render()}
    }else if(m.t==='resign'){
      if(!over){finish({over:1,res:'resign',winner:me});render()}
    }else if(m.t==='rematch'){
      rem|=2;if(rem===3)begin('net',me==='w'?'b':'w');else render();
    }else if(m.t==='undoreq'){
      if(!over&&m.n===hist.length&&m.k>0&&m.k<=hist.length){inU={n:m.n,k:m.k};render()}else send({t:'undono'});
    }else if(m.t==='undoyes'){
      if(pu&&pu.n===m.n&&m.n===hist.length&&m.k<=hist.length&&!over){doUndo(m.k);note='Undo disetujui.'}
      pu=null;render();T.after(()=>{note='';if(root.contains(elBoard))render()},3000);
    }else if(m.t==='undono'){
      if(pu){pu=null;note='Undo ditolak teman.';render();T.after(()=>{note='';if(root.contains(elBoard))render()},3500)}
    }else if(m.t==='drawoffer'){
      if(!over){inD=true;render()}
    }else if(m.t==='drawyes'){
      if(pd&&!over){pd=false;finish({over:1,res:'draw'});render()}
    }else if(m.t==='drawno'){
      if(pd){pd=false;note='Remis ditolak teman.';render();T.after(()=>{note='';if(root.contains(elBoard))render()},3500)}
    }else if(m.t==='chat'){
      cmsg='Teman: '+(CH_QC[m.i|0]||'');render();T.after(()=>{cmsg='';if(root.contains(elBoard))render()},5000);
    }
  }

  /* ---------- permainan ---------- */
  function begin(m,color){
    mode=m;me=color;st=CHE.init();hist=[];keys={};keys[CHE.key(st)]=1;sts=[];pu=null;inU=null;pd=false;inD=false;cmsg='';note='';
    sel=null;lm=[];last=null;over=null;busy=false;pend=null;rem=0;stale=false;
    if(m==='bot'&&!botName)botName=botNames(1)[0];

  function build(){
    root.innerHTML='';
    elTop=el('div','chlab');elBot=el('div','chlab');
    elBoard=el('div','chb');elSt=el('div','chst');elMv=el('div','chmv');elAct=el('div','chact');
    root.append(elTop,elBoard,elBot,elSt,elMv,elAct,skinPanel());
    applyLook();render();
  }
  function botMove(){
    busy=true;render();
    T.after(()=>{
      if(dead||over)return;
      const m=CHE.pick(st,botLv);busy=false;doMove(m,true);
    },450);
  }
  function undoTarget(){
    const n=hist.length;if(!n||over||busy)return 0;
    if(mode==='local')return 1;
    return st.t!==me?1:(n>=2?2:0);
  }
  function doUndo(k){
    while(k-->0&&sts.length){const e=sts.pop();keys[e.k]=Math.max(0,(keys[e.k]||1)-1);st=e.st;last=e.last;hist.pop()}
    sel=null;lm=[];pend=null;
  }
  function applyLook(){
    const B=CH_BOARDS[look.b]||CH_BOARDS[0],P=CH_PIECES[look.p]||CH_PIECES[0],s=root.style;
    const set=(k,v)=>{if(v)s.setProperty(k,v);else s.removeProperty(k)};
    set('--ch-lt',B.lt);set('--ch-dk',B.dk);set('--ch-edge',B.edge);set('--ch-lab',B.lab);set('--ch-dot',B.dot);
    CH_MI=look.m|0;set('--ch-pw',P.w);set('--ch-pb',P.b);set('--ch-pws',P.ws);set('--ch-pbs',P.bs);
  }
  function skinPanel(){
    const d=el('details','chskin');d.append(el('summary','','Skin papan & bidak (hanya terlihat olehmu)'));
    const grp=(label,list,key,sw)=>{
      d.append(el('div','chskl',label));
      const r=el('div','chsko');
      list.forEach((x,i)=>{
        const b=el('button','chskb'+(look[key]===i?' on':''),sw(x)+'<span>'+x.n+'</span>');b.type='button';
        b.onclick=()=>{look[key]=i;store.set('ch-look',look);applyLook();if(key==='m')render();[...r.children].forEach((c,j)=>c.classList.toggle('on',j===i))};
        r.append(b);
      });
      d.append(r);
    };

    grp('Model bidak',CH_MODELS,'m',(x)=>{const i=CH_MODELS.indexOf(x);return '<i class="chsw mdl">'+(chSvg('N',i)||'<b style="font-size:17px;line-height:20px">'+chG('N')+'</b>')+'</i>'});
    grp('Warna bidak',CH_PIECES,'p',x=>'<i class="chsw" style="background:linear-gradient(135deg,'+x.w+' 50%,'+x.b+' 50%)"></i>');

  }
  function resultText(o){
    if(o.res==='draw')return 'Remis: kedua pemain sepakat.';
    const wn=o.winner?(mode==='local'?(o.winner==='w'?'Putih':'Hitam'):nm(o.winner)):'';
    if(o.res==='mate')return 'Skakmat. '+wn+' menang.';
    if(o.res==='resign')return 'Menyerah. '+wn+' menang.';
    if(o.res==='stalemate')return 'Remis: tidak ada langkah sah dan tidak sedang skak (stalemate).';
    if(o.res==='material')return 'Remis: bidak tersisa tidak cukup untuk skakmat.';
    if(o.res==='50')return 'Remis: 50 langkah tanpa tangkapan atau langkah pion.';
    if(o.res==='rep')return 'Remis: posisi yang sama muncul tiga kali.';
    if(o.res==='lost')return 'Temanmu keluar dari room.';
    return '';
  }
  function finish(o){
    over=o;
    const iWon=o.winner&&(mode==='local'||o.winner===me);
    Music.sfx(iWon?'win':'miss');if(mode!=='local'){Stats.arm('chess');Stats.rec('chess',iWon?'w':(o.winner?'l':'d'))}
  }
  function doMove(m,remote){
    const n=hist.length;
    hist.push(CHE.san(st,m));
    const prev={st,last};sts.push(prev);
    st=CHE.apply(st,m);last=[m.f,m.t];sel=null;lm=[];pend=null;pu=null;inU=null;pd=false;inD=false;
    const k=CHE.key(st);keys[k]=(keys[k]||0)+1;prev.k=k;
    Music.sfx('tick');
    if(mode==='net'&&!remote)send({t:'move',n,f:m.f,to:m.t,p:m.p||null});
    const s=CHE.status(st,keys);
    if(s.over)finish(s);
    render();
    if(mode==='bot'&&!over&&st.t!==me)botMove();
  }
  function tap(i){
    if(over||busy||pend)return;
    if(mode!=='local'&&st.t!==me)return;
    if(sel!==null){
      const ms=lm.filter(m=>m.t===i);
      if(ms.length){if(ms[0].p){pend=ms;render()}else doMove(ms[0]);return}
    }
    const p=st.b[i];
    if(p&&CHE.isW(p)===(st.t==='w')){sel=i;lm=CHE.legal(st).filter(m=>m.f===i)}else{sel=null;lm=[]}
    render();
  }
  function label(div,c){
    const turn=!over&&st.t===c;
    div.className='chlab'+(turn?' act':'');
    div.innerHTML='<i class="dot"></i><span>'+nm(c)+'</span><span class="chm">'+(mode==='local'?'':'('+col(c)+')')+'</span>';
  }
  function render(){
    if(!elBoard)return;
    if(pu&&pu.n!==hist.length)pu=null;if(inU&&inU.n!==hist.length)inU=null;
    const flip=(me==='b'&&mode!=='local')!==fv;
    elBoard.innerHTML='';
    const chk=!over&&CHE.inCheck(st)?CHE.kingSq(st,st.t):-1;
    const dests=new Set(lm.map(m=>m.t));
    for(let n=0;n<64;n++){
      const i=flip?63-n:n,r=i>>3,c=i&7,p=st.b[i];
      let cls='chsq '+((r+c)%2?'dk':'lt');
      if(i===sel)cls+=' sel';
      if(dests.has(i))cls+=(p||lm.find(m=>m.t===i&&m.ep))?' cap':' mv';
      if(last&&(i===last[0]||i===last[1]))cls+=' last';
      if(i===chk)cls+=' chk';
      const b=el('button',cls);b.type='button';
      b.setAttribute('aria-label',CHE.sqn(i)+(p?' '+p:''));
      if(p)b.append(el('span','pc '+(CHE.isW(p)?'w':'b'),chP(p)));
      if(n%8===0)b.append(el('i','rk',String(8-r)));
      if(n>=56)b.append(el('i','fl','abcdefgh'[c]));
      b.onclick=()=>tap(i);
      elBoard.append(b);
    }
    let top=mode==='local'?'b':me==='w'?'b':'w',bot=mode==='local'?'w':me;if(fv){const z=top;top=bot;bot=z}
    label(elTop,top);label(elBot,bot);
    let s;
    if(over)s=resultText(over);
    else if(busy)s='Bot berpikir…';
    else{
      s='Giliran '+col(st.t)+(mode!=='local'&&st.t===me?' (kamu)':'');
      if(CHE.inCheck(st))s+=' · Skak!';
      if(stale)s+=' · Teman belum merespons';
    }
    if(cmsg)s+=' · '+cmsg;if(note)s+=' · '+note;
    elSt.textContent=s;
    let mv='';
    for(let k=0;k<hist.length;k++){if(k%2===0)mv+=(k/2+1)+'. ';mv+=hist[k]+' '}
    elMv.textContent=mv;elMv.scrollTop=elMv.scrollHeight;
    actions();
  }
  let armedQ=0,armedR=0;
  function actions(){
    elAct.innerHTML='';
    if(pend){
      elAct.append(el('div','chpq','Promosi jadi:'));
      for(const q of 'QRBN'){
        const b=btn('','chpb',()=>doMove(pend.find(m=>m.p===q)));
        b.append(el('span','pc '+(st.t==='w'?'w':'b'),chP(q)));elAct.append(b);
      }
      return;
    }
    if(over){
      if(mode==='net'){
        if(over.res!=='lost'){
          const b=btn(rem&1?'Menunggu teman…':(rem&2?'Teman ingin main lagi. Ayo!':'Main lagi (tukar warna)'),'primary',()=>{rem|=1;send({t:'rematch'});if(rem===3)begin('net',me==='w'?'b':'w');else render()});
          b.disabled=!!(rem&1);elAct.append(b);
        }
      }else elAct.append(btn('Main lagi','primary',()=>begin(mode,mode==='bot'?(me==='w'?'b':'w'):'w')));
    }else if(mode!=='local'){
      const b=btn(armedR?'Yakin menyerah? Ketuk lagi':'Menyerah','',()=>{
        if(!armedR){armedR=1;render();T.after(()=>{armedR=0;if(!over)render()},3000);return}
        armedR=0;
        if(mode==='net')send({t:'resign'});
        finish({over:1,res:'resign',winner:me==='w'?'b':'w'});render();
      });
      elAct.append(b);
    }
    if(!over){
      if(inU){
        elAct.append(el('div','chpq','Teman minta undo '+inU.k+' langkah.'),
          btn('Setuju','primary',()=>{const u=inU;send({t:'undoyes',n:u.n,k:u.k});doUndo(u.k);inU=null;render()}),
          btn('Tolak','',()=>{send({t:'undono'});inU=null;render()}));
      }else if(pu)elAct.append(el('div','chpq','Menunggu persetujuan undo…'));
      else{
        const ut=undoTarget();
        const ub=btn('Undo','',()=>{
          if(mode==='net'){pu={n:hist.length,k:ut};send({t:'undoreq',n:hist.length,k:ut});render()}
          else{doUndo(ut);render()}
        });
        ub.disabled=!ut||!!pend;elAct.append(ub);
      }
      if(mode==='net'){
        if(inD)elAct.append(el('div','chpq','Teman menawarkan remis.'),
          btn('Terima','primary',()=>{send({t:'drawyes'});inD=false;finish({over:1,res:'draw'});render()}),
          btn('Tolak','',()=>{send({t:'drawno'});inD=false;render()}));
        else if(pd)elAct.append(el('div','chpq','Menunggu jawaban remis…'));
        else elAct.append(btn('Tawar remis','',()=>{pd=true;send({t:'drawoffer'});render()}));
      }
    }
    elAct.append(btn('Putar papan','',()=>{fv=!fv;render()}));
    if(mode==='net'&&!(over&&over.res==='lost')){
      CH_QC.forEach((t,i)=>{const b=btn(t,'ghost',()=>{send({t:'chat',i});cmsg='Kamu: '+t;render();T.after(()=>{cmsg='';if(root.contains(elBoard))render()},3000)});elAct.append(b)});
    }
    const q=btn(armedQ?'Yakin keluar? Ketuk lagi':'Menu','ghost',()=>{
      if(!armedQ){armedQ=1;render();T.after(()=>{armedQ=0;if(root.contains(q))render()},3000);return}
      armedQ=0;leave(true);menu();
    });
    elAct.append(q);
  }
  const bye=()=>{if(mode==='net'&&topic)post({t:'bye'},0,true)};
  window.addEventListener('pagehide',bye);
  if(typeof joinCode==='string'&&joinCode.length===8)guestFlow(joinCode);else menu();
  return{destroy(){bye();dead=true;window.removeEventListener('pagehide',bye);T.clear();closeES();if(pingT)clearInterval(pingT)}};
}

/* ---------- HIGHER / LOWER (51 tebakan) ---------- */
function HighLow(box){
  const T=timers();
  const root=el('div','hl');box.appendChild(root);
  const today=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
  let day=store.get('hl-day',null);
  if(!day||day.d!==today())day={d:today(),best:0,tries:0};
  const saveDay=()=>store.set('hl-day',day);
  let deck=[],cur=null,seen=[],through=0,over=null,counted=false,fresh=false,showSeen=!!store.get('hl-show',false);
  let bo=false,bd=null;
  const bestAll=()=>{const g=Stats.get().g.highlow;return(g&&g.mx&&g.mx.best)||0};
  const subKey=()=>{const d=Stats.get();return bestAll()+'|'+(d.name||'')+'|'+(d.av|0)};
  async function pushBest(){const b=bestAll();if(b>0&&Cloud.user()&&store.get('hl-sub','')!==subKey()){const k=subKey();await Cloud.submit('highlow',b);store.set('hl-sub',k)}}
  async function loadBoard(){
    bd='load';render();
    try{
      const u=await Cloud.who();
      if(!u)bd='login';
      else{await pushBest();bd=await Cloud.board('highlow',20)}
    }catch(e){bd='err'}
    if(root.isConnected)render();
  }
  function boardEl(){
    const b=el('div','hlboard');
    if(bd==='load')b.append(el('div','hlmsg','Memuat…'));
    else if(bd==='login'){
      b.append(el('div','hlmsg','Masuk dengan Google untuk ikut papan peringkat.'));
      b.append(btn('Masuk dengan Google','primary',async()=>{await Cloud.signIn();if(Cloud.user())loadBoard()}));
    }
    else if(bd==='err')b.append(el('div','hlmsg','Papan peringkat belum bisa dimuat.'));
    else if(!bd||!bd.length)b.append(el('div','hlmsg','Belum ada skor.'));
    else{
      const me=Cloud.user()&&Cloud.user().uid;
      bd.forEach((r,i)=>{
        const row=el('div','hlrow'+(r.uid===me?' me':''));
        row.append(el('span','hlrank',String(i+1)),avatar(r.av|0,28));
        const nm=el('span','hlname');nm.textContent=r.name||'Pemain';
        row.append(nm,el('span','hlscore',String(r.best|0)));
        b.append(row);
      });
      b.append(el('div','hlmsg','Hanya nama, avatar, dan skor terbaik yang tampil.'));
    }
    return b;
  }
  function start(){
    Stats.arm('highlow');
    deck=shuffle(newDeck());cur=deck.pop();seen=[cur];through=0;over=null;counted=false;fresh=true;
    render();
  }
  function guess(up){
    if(over||!deck.length)return;
    if(day.d!==today())day={d:today(),best:0,tries:0};
    if(!counted){counted=true;day.tries++}
    const nx=deck.pop();seen.push(nx);
    const ok=nx.r===cur.r?true:(up?nx.r>cur.r:nx.r<cur.r);
    cur=nx;fresh=true;
    if(ok){
      through++;if(through>day.best)day.best=through;
      if(!deck.length){over='win';Stats.rec('highlow','w',{max:{best:through}})}
    }else{
      over='lose';Stats.rec('highlow',null,{max:{best:through}});
    }
    saveDay();render();
    pushBest().catch(()=>{});
  }
  function render(){
    root.innerHTML='';
    const f=el('div','felt');
    const pile=el('div','pile');
    const dk=el('div','dk');
    dk.append(deck.length?backEl():el('div','none'),el('div','left',deck.length+' di dek'));
    pile.append(cardEl(cur,fresh?'hlnew':''),dk);
    f.append(pile);
    f.append(el('div','ask',over==='win'?'Tamat! 51 tebakan benar semua.':over==='lose'?'Meleset. Kartunya '+rl(cur.r)+'.':'Lebih tinggi atau lebih rendah?'));
    if(over){
      const a=el('div','actions');a.append(btn('Main lagi','primary',start));f.append(a);
    }else{
      const g=el('div','hlb');
      g.append(btn('<span aria-hidden="true">▲</span> <span>Lebih tinggi</span>','primary',()=>guess(true)),btn('<span aria-hidden="true">▼</span> <span>Lebih rendah</span>','primary',()=>guess(false)));
      f.append(g);
    }
    const pr=el('div','hlprog');
    const trk=el('div','hltrack'),fl=el('i',over==='lose'?'x':'');fl.style.width=Math.round(through/51*100)+'%';trk.append(fl);
    pr.append(trk,el('b','',through+' / 51'));
    f.append(pr);
    const st=el('div','sts');
    st.append(el('div','','<span>Beruntun</span><b>'+through+'</b>'),el('div','','<span>Rekor hari ini</span><b>'+day.best+'</b>'),el('div','','<span>Ronde hari ini</span><b>'+day.tries+'</b>'));
    f.append(st);
    const tg=el('label','tg');
    const cb=document.createElement('input');cb.type='checkbox';cb.checked=showSeen;
    cb.onchange=()=>{showSeen=cb.checked;store.set('hl-show',showSeen);fresh=false;render()};
    tg.append(cb,el('span','','Riwayat kartu'));
    f.append(tg);
    if(showSeen){

function TebakTahunScene(cv){

  const lerp=(a,b,f)=>{const p=s=>[1,3,5].map(i=>parseInt(s.slice(i,i+2),16));const A=p(a),B=p(b);return 'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*f)).join(',')+')'};

  }
  const L=()=>Object.assign({ch:0,hat:0,trail:0,buddy:0},store.get('dd-look',{}));
  function emit(x,y,cols,n,vx,vy,life,sz){for(let i=0;i<n;i++)parts.push({x,y,vx:(rr()-.5)*vx,vy:(rr()-.5)*vy-.2,l:life*(.6+rr()*.6),m:life,c:cols[(rr()*cols.length)|0],s:sz||1})}
  function sky(){
    for(let y=0;y<70;y+=2)rc(lerp(thm.sky[0],thm.sky[1],y/70),0,y,W,2);
    if(era.name==='Digital'||era.name==='Modern')stars.forEach(s=>{if(((t/10+s.p)|0)%4)rc('#fff',s.x,s.y,1,1)});
    const sy=12+Math.sin(t/60)*1.5;rc(thm.sun,118,sy,10,10);rc(thm.sun,116,sy+2,14,6);
    c.globalAlpha=.25;rc(thm.sun,112,sy-4,22,18);c.globalAlpha=1;
    clouds.forEach(o=>{o.x-=o.s+speed*.6;if(o.x<-30)o.x=W+10;c.globalAlpha=.45;rc('#fff',o.x,o.y,o.w,4);rc('#fff',o.x+4,o.y-3,o.w*.5,3);c.globalAlpha=1});
  }

    else if(n==='Medieval'){rc('#2a3550',hx,42,30,28);for(let i=0;i<4;i++)rc('#2a3550',hx+i*8,38,4,5);rc('#2a3550',hx+12,30,6,12);rc('#ffd23f',hx+13,52,3,5);rc('#e0483e',hx+15,24+Math.sin(t/8),5,3);rc('#2a3550',hx+14,24,1,8)}
    else if(n==='Age of Sail'){const b=Math.sin(t/20)*1.5;rc('#4a3220',hx,62+b,34,5);rc('#e8dcc0',hx+8,40+b,12,18);rc('#e8dcc0',hx+22,44+b,9,14);rc('#2a1a10',hx+17,38+b,1,26);for(let x=0;x<W;x+=2)rc('#ffffff55',x,69+Math.sin((x+t)/4),1,1)}

    else if(n==='Modern'){[0,8,16,24,32].forEach((o,i)=>{const h=18+((i*13)%5)*7;rc('#241c3a',hx+o,70-h,7,h);for(let j=0;j<h;j+=5)if(((t/30+i+j)|0)%3)rc('#ffd05a',hx+o+2,70-h+j+2,2,2)})}
    else{[0,10,20,30].forEach((o,i)=>{const h=24+((i*17)%4)*8,cc=i%2?'#4ff3ff':'#ff5f9a';rc('#1a1240',hx+o,70-h,8,h);rc(cc,hx+o,70-h,8,1);for(let j=4;j<h;j+=6)rc(cc,hx+o+2,70-h+j,4,1)});for(let i=0;i<8;i++){c.globalAlpha=.5;rc('#4ff3ff',(i*23+t*3)%W,((i*41+t*2)%60),1,4);c.globalAlpha=1}}
  }
  function ground(){

    for(let x=-16;x<W+16;x+=16)rc('#00000026',x-off,78,8,2);

    rc('#00000055',x,74,24,2);

      else{const bc=['','#ffb347','#6ee07a','#ff8ad8'][l.buddy];rc('#0a1020',bx-1,63+bb,9,7);rc(bc,bx,64+bb,7,5);rc('#fff',bx+4,65+bb,2,2)}}
    const tr=TY_TRC[l.trail%10];if(mood==='run'&&t%2===0)emit(x-2,68,tr,2,1.4,1,26,l.trail===5||l.trail===0?2:1);

  }
  function fx(){
    parts=parts.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.01;p.l--;c.globalAlpha=Math.max(0,p.l/p.m);rc(p.c,p.x,p.y,p.s,p.s);c.globalAlpha=1;return p.l>0});
    if(mood==='run')for(let i=0;i<10;i++){c.globalAlpha=.5;rc('#fff',(i*37+t*16)%W,8+(i*29)%60,10+(i%3)*8,1);c.globalAlpha=1}

  }

}

      const v=inp.value.trim(),n=/^\d{1,4}$/.test(v)?+v:null,valid=n!=null&&n>=1&&n<=NOW;
      if(!valid&&!timeout){inp.classList.remove('shake');void inp.offsetWidth;inp.classList.add('shake');hint.innerHTML='<span class="bad">Enter a year 1–'+NOW+'</span>';return}
      locked=true;stopTick();
      const pts=valid?tyScore(n,ev[0]):0;
      rows.push({a:ev[0],g:valid?n:null,p:pts});tot+=pts;
      if(pts>=60){combo++;bestCombo=Math.max(bestCombo,combo)}else combo=0;
      travel(ev,valid?n:null,pts,timeout&&!valid,S);
    }
  }
  /* mesin waktu: angka tahun berputar dari zaman sekarang ke jawaban, zaman berganti dengan kilatan */
  function travel(ev,g,pts,late,S){
    root.querySelector('.dvp').innerHTML='<div class="dvq">Traveling…</div>';
    S.sc.run();sfx('tier0');S.hR.textContent=tot+' PTS';
    const y0=curYear,y1=ev[0],dur=900+Math.min(1600,Math.abs(y1-y0)*.9),t0=Date.now();
    const iv=T.every(()=>{
      const f=Math.min(1,(Date.now()-t0)/dur),e=1-Math.pow(1-f,3),yr=Math.round(y0+(y1-y0)*e);
      S.hZ.textContent=String(yr);
      if(S.sc.setYear(yr,true))S.banner('Entering '+tyEra(yr).name);
      if(f>=1){clearInterval(iv);arrive()}
    },60);
    function arrive(){
      curYear=y1;S.sc.setYear(y1,true);S.hZ.textContent=String(y1);
      const ti=tyTi(pts);
      pts>=60?S.sc.win():pts>=30?S.sc.idle():S.sc.lose();
      S.sc.burst(ti<2?TY_TRC[6]:ti<4?TY_TRC[4]:TY_TRC[9],ti<2?40:ti<4?18:8);if(ti>=3)S.sc.shake(8);
      S.pop('+'+pts+' '+TY_TIERS[ti][1],TY_TIERS[ti][2]);sfx(ti===4?'miss':'tier'+(4-ti));
      T.after(()=>reveal(ev,g,pts,late,S),1100);
    }
  }
  function reveal(ev,g,pts,late,S){
    const panel=root.querySelector('.dvp');panel.innerHTML='';
    panel.append(dots(),evEl(ev,'tyqs'));
    if(late)panel.append(el('div','hint','<span class="bad">Time’s up</span>'));
    const big=el('div','tybig',String(ev[0]));big.style.color=col(pts);panel.append(big);
    const d=g==null?null:g-ev[0],msg=d==null?'':d===0?'Spot on!':Math.abs(d)+' years too '+(d<0?'early':'late');
    if(msg)panel.append(el('div','tymsg',msg));
    panel.append(el('div','rows','<div><span>Your guess</span><b>'+(g==null?'–':g)+'</b></div><div><span>Gap</span><b>'+(d==null?'–':Math.abs(d))+'</b></div><div><span>Points</span><b style="color:'+col(pts)+'">+'+pts+'</b></div>'));
    const last=qi>=ROUNDS-1;
    panel.append(btnD(last?'Finish':'Next ▶','',()=>{if(last)finish();else{qi++;ask()}}));
  }
  function finish(){
    const res={pts:tot,rows:rows.slice(),combo:bestCombo};
    if(daily){store.set('ty-'+dkey,res);Stats.rec('tahun',null,{add:{pts:tot},max:{best:tot}})}
    done(res);
  }
  function done(res){
    stopTick();stopScene();root.innerHTML='';curYear=NOW;
    const rank=(TY_RANKS.find(r=>res.pts>=r[0])||TY_RANKS[4])[1];
    const S=mkSea('RESULT',rank,res.pts+'/'+ROUNDS*100);
    res.pts>=220?S.sc.win():S.sc.idle();
    if(res.pts>=380){S.sc.burst(TY_TRC[6],60);sfx('tier4')}
    S.banner(rank);
    const panel=el('div','dvp');root.append(S.sea,panel);
    panel.append(el('div','dvq',rank+' · '+res.pts+' / '+ROUNDS*100));
    if(res.combo>=2)panel.append(el('div','tymsg','Best combo x'+res.combo));
    const list=el('div','rows');
    res.rows.forEach(r=>list.append(el('div','','<span><i class="tysq" style="background:'+col(r.p)+'"></i> '+r.a+' <em>'+(r.g==null?'–':r.g)+'</em></span><b style="color:'+col(r.p)+'">'+r.p+'</b>')));
    panel.append(list);
    const a=el('div','row-actions');
    if(daily){
      const sq=res.rows.map(r=>({100:'🟨',85:'🟦',60:'🟩',30:'🟧'}[r.p]||'⬛')).join('');
      const cp=btnD('Copy result','ghost',()=>{
        const txt='Eraly (Tebak Tahun) '+dkey+'\n'+rank+' '+res.pts+'/'+ROUNDS*100+'\n'+sq;
        try{navigator.clipboard.writeText(txt).then(()=>{cp.textContent='Copied'},()=>{})}catch(e){}
      });a.append(cp);
    }
    a.append(btnD('Random practice','',()=>begin(false)),btnD('Customize','ghost',()=>customize(panel,()=>done(res))));
    panel.append(a);
  }
  intro();
  return{destroy(){stopTick();stopScene();T.clear()}};
}

/* ---------- KARTU 41 (lawan 3 bot, 4 tumpukan buang) ----------
   Aturan: 4 kartu per orang. A=11, J/Q/K=10, angka sesuai angkanya.
   Giliran: ambil 1 kartu dari tumpukan sendiri (buangan pemain kiri) atau dari tengah, lalu buang 1 kartu ke tumpukan pemain kanan.
   Skor: hanya simbol sama yang dijumlah; kalau simbol campur, jumlah simbol terbesar dikurangi jumlah simbol lain. Menang: punya 4 kartu dengan skor tepat 41, lalu tekan Tutup 41. Kalau kartu tengah habis (setelah pemain yang mengambil kartu terakhir membuang), skor tertinggi menang; seri dipecah suit dominan (spade>heart>diamond>club), lalu urutan kursi. */
function Kartu41(box,arg){
  const T=timers();
  const root=el('div','k41 pro');box.appendChild(root);
  const hub=RoomHub(root,'kartu41',arg,begin,'Kumpulkan 4 kartu bernilai tepat 41. Empat kursi: buat room atau main sendiri.');
  const val=r=>r===14?11:r>=11?10:r;
  /* skor: hanya simbol sama yang dijumlah; simbol campur = simbol terbesar dikurangi sisanya (A♣ Q♣ K♥ J♥ = 21-20 = 1) */
  const sumOf=cs=>{const g=[0,0,0,0];cs.forEach(c=>g[c.s]+=val(c.r));const t=g[0]+g[1]+g[2]+g[3];return 2*Math.max(...g)-t};
  /* dari 4 atau 5 kartu, pilih 4 yang totalnya paling dekat 41; drop = indeks kartu yang dibuang */
  const pick41=cs=>{let b=null;for(let d=0;d<cs.length;d++){const s=sumOf(cs.filter((_,j)=>j!==d)),dist=Math.abs(41-s);if(!b||dist<b.dist||(dist===b.dist&&s>b.s))b={drop:d,s,dist}}return b};
  /* seri: suit dominan (jumlah terbesar) menentukan; indeks suit kecil = tinggi (♠<♥<♦<♣); sama lagi = urutan kursi */
  const domSuit=h=>{const g=[0,0,0,0];h.forEach(c=>g[c.s]+=val(c.r));return g.indexOf(Math.max(...g))};
  const scoreOf=h=>h.length>4?pick41(h).s:sumOf(h);
  const selfU=()=>net?net.uid:'me';
  let net=null,host=true,seats=[],me=0;
  /* state host (aturan, acak, bot) */
  let hands=[],pile=[],deck=[],turn=0,stage='take',passes=0,over=false,winner=-1,log=[],gen=0,rid=0,ver=0,hv=[0,0,0,0],dirty=[false,false,false,false];
  /* state tampilan (host dan tamu): V = state publik, myHand = kartuku (privat) */
  let V=null,myHand=null,sel=null,lockUntil=0,CM={},curRid=-1,recRid=-1,bt=[[],[],[],[]],prevP=0,prevTurn=-1,prevStage='',needOn=false;
  let rvSeen=new WeakSet();
  const later=(fn,ms)=>{const g=gen;T.after(()=>{if(g===gen)fn()},ms)};
  const say=t=>{log.push(t);if(log.length>6)log.shift()};
  const isBot=i=>!!(seats[i]&&seats[i].bot);
  const cv=c=>{const k=c.s*15+c.r;return CM[k]||(CM[k]={r:c.r,s:c.s})};
  const plain=c=>({r:c.r,s:c.s});
  const handOk=()=>!!(V&&myHand&&myHand.ver===V.hv[me]&&myHand.cards.length===V.cnt[me]);

  /* ---------- host: aturan ---------- */
  function pubOf(){
    return{rid,ver,turn,stage,over,winner,cnt:hands.map(h=>h.length),dk:deck.length,pn:pile.map(p=>p.length),
      pt:pile.map(p=>p.length?plain(p[p.length-1]):null),hv:hv.slice(),log:log.slice(-3),
      rv:over?hands.map(h=>h.map(plain)):null};
  }
  function sendPriv(i){net.priv(seats[i].u,{ver:hv[i],hand:hands[i].map(plain)})}
  function commit(){
    ver++;
    for(let i=0;i<4;i++)if(dirty[i]){hv[i]=ver;dirty[i]=false}
    V=JSON.parse(JSON.stringify(pubOf()));
    if(host)myHand={ver:V.hv[me],cards:hands[me].map(plain)};
    if(net){
      net.pub(V);
      seats.forEach((s,i)=>{if(i!==me&&!s.bot&&hv[i]===ver)sendPriv(i)});
    }
    afterSync();render();
  }
  function afterSync(){
    if(!V)return;
    if(V.rid!==curRid){curRid=V.rid;CM={};bt=[[],[],[],[]];rvSeen=new WeakSet();sel=null;prevP=0;Stats.arm('kartu41')}
    if(V.turn!==prevTurn||V.stage!==prevStage){prevTurn=V.turn;prevStage=V.stage;sel=null;lockUntil=0}
    if(V.over&&recRid!==V.rid){recRid=V.rid;Stats.rec('kartu41',V.winner===me?'w':'l')}
  }
  function start(){
    gen++;rid++;
    const d=shuffle(newDeck());
    hands=[[],[],[],[]];pile=[[],[],[],[]];
    for(let k=0;k<4;k++)for(let i=0;i<4;i++)hands[i].push(d.pop());
    deck=d;turn=0;stage='take';passes=0;over=false;winner=-1;
    dirty=[true,true,true,true];
    log=['Kartu dibagikan. '+seats[0].name+' jalan duluan.'];
    commit();
    if(isBot(turn))later(botTurn,800);
  }
  /* setelah giliran pindah: bot jalan sendiri; kalau pemain tidak bisa ambil kartu, giliran dilewati */
  function advance(){
    stage='take';
    commit();
    if(isBot(turn))later(botTurn,800);
    else if(!canTake(turn)){const t=turn;later(()=>{if(!over&&turn===t&&stage==='take'&&!canTake(t))noMove(t)},900)}
  }
  function next(){turn=(turn+1)%4;advance()}
  function canTake(i){return pile[i].length>0||deck.length>0}
  function doTake(i,src){
    if(src==='pile'){if(!pile[i].length)return false;hands[i].push(pile[i].pop());say(seats[i].name+' ambil dari tumpukan.')}
    else if(src==='deck'){if(!deck.length)return false;hands[i].push(deck.pop());say(seats[i].name+' ambil dari tengah.')}
    else return false;
    dirty[i]=true;passes=0;stage='discard';return true;
  }
  function doDiscard(i,idx){
    const c=hands[i].splice(idx,1)[0];pile[(i+1)%4].push(c);dirty[i]=true;
    say(seats[i].name+' buang ke '+seats[(i+1)%4].name+'.');
    if(!deck.length){endDeck();return}
    next();
  }
  /* kartu tengah habis: ronde selesai, skor tertinggi menang (semua pemain sudah pegang 4 kartu) */
  function endDeck(){
    over=true;gen++;let best=0,bs=-99,bd=9;
    hands.forEach((h,i)=>{const s=sumOf(h),d=domSuit(h);if(s>bs||(s===bs&&d<bd)){bs=s;bd=d;best=i}});
    winner=best;
    say('Kartu tengah habis. '+seats[best].name+' dapat skor tertinggi ('+bs+').');
    commit();
  }
  function win(i){
    over=true;winner=i;gen++;
    say(seats[i].name+' menutup dengan 41!');commit();
  }
  function closeRound(){
    over=true;gen++;let best=0,bd=99;
    hands.forEach((h,i)=>{const d=Math.abs(41-sumOf(h));if(d<bd){bd=d;best=i}});
    winner=best;
    say('Tidak ada kartu lagi. '+seats[best].name+' paling dekat ke 41.');commit();
  }
  function noMove(i){
    passes++;say(seats[i].name+' tidak bisa ambil kartu. Lewat.');
    if(passes>=4){closeRound();return}
    turn=(turn+1)%4;advance();
  }
  function botTurn(){
    if(over)return;
    const i=turn;
    if(!isBot(i)||stage!=='take')return;
    if(!canTake(i)){noMove(i);return}
    const cur=Math.abs(41-sumOf(hands[i]));
    const top=pile[i][pile[i].length-1];
    const usePile=!!top&&pick41(hands[i].concat([top])).dist<cur;
    doTake(i,(usePile||!deck.length)?'pile':'deck');
    commit();
    botFinish(i);
  }
  function botFinish(i){
    const p=pick41(hands[i]);
    if(p.dist===0){later(()=>win(i),700);return}
    later(()=>{if(!over&&turn===i)doDiscard(i,pick41(hands[i]).drop)},900);
  }
  /* aksi pemain manusia (host sendiri atau tamu lewat jaringan) */
  function applyAct(i,m){
    if(over||turn!==i||isBot(i))return;
    if(m.k==='take'&&stage==='take'){if(doTake(i,m.src))commit()}
    else if(m.k==='disc'&&stage==='discard'){const x=m.idx|0;if(x>=0&&x<hands[i].length)doDiscard(i,x)}
    else if(m.k==='close'&&stage==='discard'){if(pick41(hands[i]).dist===0)win(i)}
  }
  function onIn(uid,m){
    if(!m||m.rid!==rid)return;
    const i=seats.findIndex(s=>s.u===uid);
    if(i<0||isBot(i)||i===me)return;
    if(m.k==='need'){sendPriv(i);return}
    applyAct(i,m);
  }
  function onDrop(uid){
    const i=seats.findIndex(s=>s.u===uid);
    if(i<0||isBot(i)||i===me)return;
    seats[i].bot=true;say(seats[i].name+' keluar. Bot mengambil alih.');
    if(!over&&turn===i){
      gen++;commit();
      if(stage==='take')later(botTurn,600);else botFinish(i);
    }else commit();
  }
  /* ---------- tamu: terima state publik dan kartu privat ---------- */
  function onPriv(m){
    if(!m||typeof m.ver!=='number'||!Array.isArray(m.hand))return;
    if(myHand&&m.ver<myHand.ver)return;
    myHand={ver:m.ver,cards:m.hand.filter(c=>c&&c.r>=2&&c.r<=14&&c.s>=0&&c.s<=3).map(c=>({r:c.r|0,s:c.s|0}))};
    render();
  }
  /* kalau kartuku belum sampai, minta kirim ulang ke host */
  function chkHand(){
    if(host||!net||needOn||!V||V.over||handOk())return;
    needOn=true;
    T.after(()=>{needOn=false;if(V&&!V.over&&!handOk()){net.send({k:'need',rid:V.rid});chkHand()}},2500);
  }
  /* ---------- aksiku ---------- */
  function act(o){
    if(!V||V.over||V.turn!==me||Date.now()<lockUntil)return;
    if(host){applyAct(me,o);return}
    lockUntil=Date.now()+1500;T.after(()=>{if(V)render()},1550);
    net.send(Object.assign({rid:V.rid},o));
  }
  const humanTake=src=>act({k:'take',src});
  const humanDiscard=()=>{if(sel!=null&&handOk())act({k:'disc',idx:sel})};
  const humanDeclare=()=>{if(handOk()&&pick41(myHand.cards).dist===0)act({k:'close'})};
  /* ---------- tampilan ---------- */
  function render(){
    root.innerHTML='';
    if(!V){root.append(el('p','pempty','Menunggu meja dibuka…'));return}
    const nm=i=>i===me?'Kamu':seats[i].name;
    const f=el('div','felt');
    const mineTurn=!V.over&&V.turn===me;
    const locked=Date.now()<lockUntil;
    const ok=handOk();
    const canT=mineTurn&&V.stage==='take'&&!locked;
    const others=[1,2,3].map(k=>(me+k)%4);
    const tok=(i,n)=>{const tk=bt[i];while(tk.length>n)tk.pop();while(tk.length<n)tk.push({});return tk};
    if(!V.over){
      /* tiga lawan */
      const sr=el('div','k4seats');
      others.forEach(i=>{
        const s=el('div','psl k4seat'+(V.turn===i?' turn':''));
        const id=el('div','k4id');id.append(avatar(i,28),el('b','',seats[i].name));
        const row=el('div','cards');tok(i,V.cnt[i]).forEach(t=>row.append(pback(t)));
        s.append(id,row,el('span','k4tag','tumpukan '+V.pn[i]));
        if(V.turn===i)s.append(el('span','k4think','<i>.</i><i>.</i><i>.</i>'));
        sr.append(s);
      });
      f.append(sr);
      /* meja tengah: tumpukan tengah + tumpukanmu (bisa diketuk) */
      const bd=el('div','k4board');
      const dk=el('button','k4s'+(canT&&V.dk?' hot':''));dk.type='button';dk.disabled=!(canT&&V.dk);
      dk.setAttribute('aria-label','Ambil dari tengah');dk.onclick=()=>humanTake('deck');
      const dc=el('div','k4c');
      if(V.dk){
        const stk=el('div','k4stk'),n=Math.min(3,Math.ceil(V.dk/10));
        for(let l=n-1;l>=0;l--){const b=pback(null);b.style.cssText='position:absolute;left:'+(-l*2)+'px;top:'+(-l*2)+'px';stk.append(b)}
        dc.append(stk,el('span','k4n',String(V.dk)));
      }else dc.append(el('div','k4none'));
      dk.append(dc,el('span','k4l','di tengah'));
      const top=V.pt[me]?cv(V.pt[me]):null;
      const pb=el('button','k4s'+(canT&&V.pn[me]?' hot':''));pb.type='button';pb.disabled=!(canT&&V.pn[me]);
      pb.setAttribute('aria-label','Ambil dari tumpukan');pb.onclick=()=>humanTake('pile');
      const pc=el('div','k4c');
      if(top)pc.append(pcard(top),el('span','k4n',String(V.pn[me])));else pc.append(el('div','k4none'));
      pb.append(pc,el('span','k4l','Tumpukanmu'));
      bd.append(dk,pb);f.append(bd);
    }else{
      /* ronde selesai: buka kartu semua lawan */
      const rv=el('div','k4rv');
      others.forEach(i=>{
        const row=el('div','psl k4rr'+(V.winner===i?' won':''));
        const hd=el('div','k4rh'),id=el('div','k4id');id.append(avatar(i,26),el('b','',seats[i].name));
        const hc=V.rv[i].map(cv),sc=scoreOf(hc);
        hd.append(id,el('span','sp2'+(sc===41?' gold':''),String(sc)));
        const cs=el('div','cards'),drop=hc.length>4?pick41(hc).drop:-1;
        hc.forEach((c,k)=>{if(!rvSeen.has(c)){rvSeen.add(c);_hid.add(c)}cs.append(pcard(c,k===drop?'dim':''))});
        row.append(hd,cs);rv.append(row);
      });
      f.append(rv);
    }
    /* kamu */
    const mc=V.over?V.rv[me].map(cv):(ok?myHand.cards.map(cv):null);
    const best=mc&&mc.length>4?pick41(mc):null;
    const sc=mc?(best?best.s:sumOf(mc)):null;
    const me_=el('div','psl k4me'+(mineTurn?' turn':'')+(V.over&&V.winner===me?' won':''));
    const mh=el('div','k4mh'),mid=el('div','k4id');mid.append(avatar(myAv(),28),el('b','',nm(me)));
    mh.append(mid,el('span','sp2'+(sc===41?' gold':''),'Skor: '+(sc==null?'…':sc)));
    const p=sc==null?0:Math.max(0,Math.min(100,sc/41*100));
    const bar=el('div','k4bar'+(sc===41?' full':'')),fill=el('i');fill.style.width=prevP+'%';bar.append(fill);
    requestAnimationFrame(()=>requestAnimationFrame(()=>{fill.style.width=p+'%'}));prevP=p;
    const hd=el('div','hand k4hand'+(V.over&&V.winner===me?' won':''));
    if(mc){
      mc.forEach((c,i)=>{
        const live=mineTurn&&V.stage==='discard'&&ok&&!locked;
        const e=pcard(c,live?'clk'+(sel===i?' sel':''):(V.over&&best&&i===best.drop?'dim':''));
        if(live){
          const pick=()=>{sel=sel===i?null:i;render()};
          e.onclick=pick;e.tabIndex=0;e.setAttribute('role','button');
          e.onkeydown=ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();pick()}};
        }
        hd.append(e);
      });
    }else tok(me,V.cnt[me]).forEach(t=>hd.append(pback(t)));
    me_.append(mh,bar,hd);
    f.append(me_);
    if(mineTurn){
      const ab=el('div','actions');
      if(V.stage==='take'){
        const bt1=btn('Ambil dari tumpukan','primary',()=>humanTake('pile'));bt1.disabled=!(canT&&V.pn[me]);
        const bd2=btn('Ambil dari tengah','',()=>humanTake('deck'));bd2.disabled=!(canT&&V.dk);
        ab.append(bt1,bd2);
      }else{
        const can=ok&&!locked&&pick41(myHand.cards).dist===0;
        const dcb=btn('Tutup 41',can?'primary':'',humanDeclare);dcb.disabled=!can;
        const bb=btn('Buang',can?'':'primary',humanDiscard);bb.disabled=!(sel!=null&&ok&&!locked);
        ab.append(dcb,bb);
      }
      f.append(ab);
    }
    const lb=el('div','logbox');lb.setAttribute('aria-live','polite');V.log.slice(-3).forEach(t=>lb.append(el('div','',t)));
    f.append(lb);
    root.append(f);
    if(V.over){
      const n=el('div','note','<div><b>'+(V.winner===me?'Kamu menang!':nm(V.winner)+' menang')+'</b></div>');
      if(host)n.append(btn('Main lagi','primary',start));else n.append(el('span','','Menunggu room master…'));
      root.append(n);
    }
    chkHand();
  }
  function begin(n){
    net=n;
    if(n){seats=n.seats.map(x=>({u:x.u,name:x.name,bot:!!x.bot}));host=n.role==='host'}
    else{seats=[{u:'me',name:'Kamu',bot:false}].concat(botNames(3).map((nm,i)=>({u:'b'+i,name:nm,bot:true})));host=true}
    me=Math.max(0,seats.findIndex(s=>s.u===selfU()));
    if(n)n.h={
      onState:m=>{V=m;afterSync();render()},
      onPriv,onIn,onDrop,

const Stats=(()=>{
  const K='maroe-stats';let d={};
  try{d=JSON.parse(localStorage.getItem(K))||{}}catch(e){}
  d.g=d.g||{};d.name=d.name||'';d.av=d.av|0;d.since=d.since||Date.now();
  let hook=null;
  const save=q=>{try{localStorage.setItem(K,JSON.stringify(d))}catch(e){}if(!q&&hook)hook()};
  const done={};
  return{get:()=>d,save,setHook:f=>{hook=f},arm:id=>{done[id]=0},
    reset:()=>{d.g={};d.since=Date.now();save()},
    rec(id,res,x){

      const g=d.g[id]=d.g[id]||{p:0,w:0,l:0,d:0};g.a=g.a||{};g.mn=g.mn||{};g.mx=g.mx||{};

      for(const k in x.min||{})g.mn[k]=g.mn[k]==null?x.min[k]:Math.min(g.mn[k],x.min[k]);
      for(const k in x.max||{})g.mx[k]=g.mx[k]==null?x.max[k]:Math.max(g.mx[k],x.max[k]);
      save();
    }};
})();

/* ---- Apple pass runtime: spring, scroll header, press feedback, profile sheet ---- */
const reduceM=matchMedia('(prefers-reduced-motion: reduce)');
function makeSpring(init,apply){
  let x=init,v=0,target=init,raf=0,run=false,last=0,resp=.4,damp=1,onDone=null;
  function step(t){
    const dt=Math.min(.032,(t-last)/1000);last=t;
    const k=Math.pow(2*Math.PI/resp,2),c=4*Math.PI*damp/resp,n=Math.max(1,Math.ceil(dt/.004)),h=dt/n;
    for(let i=0;i<n;i++){v+=(-k*(x-target)-c*v)*h;x+=v*h}
    apply(x);
    if(Math.abs(x-target)<.05&&Math.abs(v)<.5){x=target;v=0;apply(x);run=false;const d=onDone;onDone=null;d&&d();return}
    raf=requestAnimationFrame(step);
  }
  return{
    to(t,o={}){target=t;resp=o.response??.4;damp=o.damping??1;if(o.velocity!=null)v=o.velocity;onDone=o.done||null;
      if(reduceM.matches){cancelAnimationFrame(raf);run=false;x=t;v=0;apply(x);const d=onDone;onDone=null;d&&d();return}
      if(!run){run=true;last=performance.now();raf=requestAnimationFrame(step)}},
    set(val){cancelAnimationFrame(raf);run=false;onDone=null;x=val;v=0;apply(x)},
    stop(){cancelAnimationFrame(raf);run=false;onDone=null},
    get x(){return x},get v(){return v}};
}
const project=(v,d=.998)=>(v/1000)*d/(1-d);
const rubber=(o,dim,c=.55)=>(o*dim*c)/(dim+c*Math.abs(o));
{ // header: --sp from scrollY (0 at top, 1 after the big title is gone)
  let q=0;const root=document.documentElement;
  const upd=()=>{q=0;const big=document.querySelector('.lbig'),h=big?big.offsetHeight*.7:40;root.style.setProperty('--sp',Math.max(0,Math.min(1,(scrollY-6)/h)).toFixed(3))};
  addEventListener('scroll',()=>{q||(q=requestAnimationFrame(upd))},{passive:true});
  addEventListener('hashchange',upd);
  // press feedback on pointer-down, not on release
  const PR='.lt,.lprof,.lhero,.lbt,.lchip';let pe=null;
  const off=()=>{pe&&pe.classList.remove('pressed');pe=null};
  addEventListener('pointerdown',e=>{off();const t=e.target.closest&&e.target.closest(PR);if(t){pe=t;t.classList.add('pressed')}},{passive:true});
  ['pointerup','pointercancel','dragstart'].forEach(n=>addEventListener(n,off,{passive:true}));
  addEventListener('scroll',off,{passive:true});
}
const Sheet=(()=>{
  const wrap=document.querySelector('.wrap');
  const scrim=el('div','scrim'),sh=el('div','sheet'),top=el('div','sh-top'),body=el('div','sh-body');
  sh.setAttribute('role','dialog');sh.setAttribute('aria-modal','true');sh.setAttribute('aria-label','Profil');
  const done=el('button','','Selesai');done.type='button';
  top.append(el('i'),el('b','','Profil'),done);sh.append(top,body);document.body.append(scrim,sh);
  const H=()=>sh.offsetHeight||600;
  const ys=makeSpring(H(),y=>{
    const p=Math.max(0,Math.min(1,1-y/H()));
    sh.style.transform='translateY('+y+'px)';scrim.style.opacity=p;
    wrap.style.transform=p>.001?'scale('+(1-.05*p)+') translateY('+p*10+'px)':'';
  });
  const api={on:false,body};
  let from=null;
  const aim=(t,v)=>ys.to(t,{response:.34,damping:v&&Math.abs(v)>300?.8:1,velocity:v||0});
  api.open=()=>{
    if(api.on)return;api.on=true;from=document.activeElement;
    body.innerHTML='';profilePage(body);body.scrollTop=0;
    sh.classList.add('on');scrim.classList.add('on');wrap.inert=true;
    ys.set(H());aim(0);done.focus({preventScroll:true});
  };
  api.close=v=>{
    if(!api.on)return;api.on=false;scrim.classList.remove('on');wrap.inert=false;
    ys.to(H(),{response:.34,damping:1,velocity:v||0,done:()=>{sh.classList.remove('on');wrap.style.transform=''}});
    from&&from.focus&&from.focus({preventScroll:true});
  };
  done.onclick=()=>api.close();scrim.onclick=()=>api.close();
  addEventListener('keydown',e=>{if(e.key==='Escape'&&api.on)api.close()});
  // drag from the handle bar: 1:1 follow, rubber-band above open, flick decides
  let d=null;
  top.addEventListener('pointerdown',e=>{if(e.target===done)return;ys.stop();top.setPointerCapture(e.pointerId);d={y0:e.clientY,s0:ys.x,s:[{t:e.timeStamp,y:e.clientY}]}});
  top.addEventListener('pointermove',e=>{if(!d)return;
    const o=e.clientY-d.y0+d.s0;ys.set(o<0?-rubber(-o,H()):o);
    d.s.push({t:e.timeStamp,y:e.clientY});while(d.s.length>2&&e.timeStamp-d.s[0].t>100)d.s.shift()});
  const rel=e=>{if(!d)return;const a=d.s[0],b=d.s[d.s.length-1],v=b.t>a.t?(b.y-a.y)/(b.t-a.t)*1000:0;d=null;
    if(ys.x+project(v)>H()*.5)api.close(v);else aim(0,v)};
  top.addEventListener('pointerup',rel);top.addEventListener('pointercancel',rel);
  return api;
})();
