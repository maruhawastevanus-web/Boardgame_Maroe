<!doctype html>
<!-- CATATAN UNTUK AGENT LAIN: kalau menambah game dengan lawan bot, ambil nama bot dari botNames(n) (lihat "ATURAN NAMA BOT" di dalam script). Jangan buat nama bot sendiri. -->
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Board Game Maroe</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* Layout: lobby of eight table tiles; each game opens as a felt (or paper, for Sudoku) surface under a slim toolbar. */
:root{
  --bg:#e7eeea; --fg:#13201b; --muted:#566962; --line:#c5d2cb; --panel:#f5f9f7;
  --accent:#b07a1c; --accent-fg:#1a1304; --ink-user:#2557a7;
  --peer:#dfe9e4; --same:#efdba6; --selbg:#e3c274;
  --felt:#15523f; --felt-d:#0d3a2c; --felt-fg:#e9f3ee; --felt-mut:#a9c7ba;
  --card:#fbfaf5; --card-ink:#1c2326; --card-red:#c23a2f; --card-back:#2a438a; --card-back2:#203672;
  --good:#23885a; --bad:#cf3f3f;
  --display:"Bricolage Grotesque",system-ui,sans-serif; --body:"DM Sans",system-ui,sans-serif; --mono:"DM Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1411; --fg:#e4eee9; --muted:#8ea39a; --line:#22352e; --panel:#121f1a;
    --accent:#e0ad4c; --accent-fg:#1a1304; --ink-user:#82b1ff;
    --peer:#1a2c25; --same:#4a3d17; --selbg:#6b5318;
    --felt:#124435; --felt-d:#0a2e23;
    --good:#4cc58a; --bad:#ff7070;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1411; --fg:#e4eee9; --muted:#8ea39a; --line:#22352e; --panel:#121f1a;
  --accent:#e0ad4c; --accent-fg:#1a1304; --ink-user:#82b1ff;
  --peer:#1a2c25; --same:#4a3d17; --selbg:#6b5318;
  --felt:#124435; --felt-d:#0a2e23;
  --good:#4cc58a; --bad:#ff7070;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-block:18px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font-family:inherit}
.wrap{max-width:920px;margin:0 auto}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:-18px -16px 18px;padding:12px 16px;position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 72%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.brand{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em;color:var(--fg);text-decoration:none}
.sub{color:var(--muted);font-size:13px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,7vw,52px);line-height:1.02;letter-spacing:-.03em;margin:8px 0 10px;text-wrap:balance;max-width:14ch}
.lead{color:var(--muted);max-width:52ch;margin:0 0 22px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.tile{position:relative;display:flex;flex-direction:column;gap:6px;min-height:150px;padding:16px;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--fg);text-decoration:none;overflow:hidden;transition:border-color .15s,transform .35s cubic-bezier(.34,1.4,.64,1)}
@media(hover:hover){.tile:hover{border-color:var(--accent);transform:translateY(-2px)}}
.tile:active{transform:scale(.97);transition-duration:.08s}
.tile:focus-visible,.btn:focus-visible,.cell:focus-visible,.ch:focus-visible,.dom.pl:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tile .glyph{position:absolute;right:12px;bottom:-6px;font-family:var(--display);font-weight:800;font-size:76px;line-height:1;letter-spacing:-.04em;color:var(--line);pointer-events:none}
.tile .tag{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tile .tag.bot{color:var(--accent)}
.pav{display:inline-flex;align-items:center;justify-content:center;border-radius:99px;border:1.5px solid;font-family:var(--display);font-weight:800;flex:none}
.lprof{display:flex;align-items:center;gap:12px;padding:10px 14px;margin-bottom:12px;border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--fg);text-decoration:none}
.lprof:hover{border-color:var(--accent)}.lpt{display:flex;flex-direction:column;flex:1}.lpt b{font-family:var(--display);font-weight:800;font-size:16px}.lpt span{font-size:12px;color:var(--muted)}.lpa{color:var(--accent);font-size:18px}
.pback{display:inline-flex;align-items:center;min-height:44px;color:var(--muted);text-decoration:none;font-size:14px}
.phead{display:flex;align-items:center;gap:14px;margin:6px 0 12px}
.phead input{flex:1;min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font:700 18px var(--display)}
.ppick{display:flex;flex-wrap:wrap;gap:8px}.ppick button{background:none;border:2px solid transparent;border-radius:99px;padding:0;cursor:pointer}.ppick button.on{border-color:var(--accent)}
.psum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.pbox{padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--panel);display:flex;flex-direction:column;gap:2px}.pbox b{font:800 24px var(--display);color:var(--accent)}.pbox span{font-size:11px;color:var(--muted)}
.pcard{padding:12px 14px;margin-bottom:10px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.pname{font:800 16px var(--display);margin-bottom:6px}.pbits{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}.pbits b{color:var(--fg);font-size:16px}
.pbar{height:6px;border-radius:99px;background:var(--line);margin-top:10px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--accent)}
.pnote{font-size:12px;color:var(--muted);margin-top:6px}.pempty{padding:20px;border:1px dashed var(--line);border-radius:14px;color:var(--muted);font-size:14px}
.pacct{display:flex;flex-direction:column;gap:10px;align-items:flex-start;margin-top:16px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}.pat{display:flex;flex-direction:column;gap:4px}.pat b{font:800 15px var(--display)}.pat span{font-size:12px;color:var(--muted);line-height:1.4}
.pfoot{font-size:12px;color:var(--muted);margin:18px 0 10px}
.lbl{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:22px 2px 8px}
.lbs{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:640px){.lbs{grid-template-columns:repeat(4,1fr)}}
.lbt{display:flex;flex-direction:column;justify-content:space-between;gap:14px;min-height:92px;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;color:var(--fg);text-decoration:none;transition:transform .15s,border-color .15s}
.lbt:hover{border-color:var(--accent);transform:translateY(-2px)}
.lbt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lbg{font-family:var(--display);font-weight:800;font-size:30px;line-height:1;letter-spacing:-.04em;color:var(--muted)}
.lbt.bot .lbg{color:var(--accent)}
.lbt b{font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:-.01em}
.lbt.last{flex-direction:row;align-items:center;min-height:0;gap:12px;border-color:var(--accent)}
.lbt.last i{margin-left:auto;font-style:normal;font-family:var(--mono);font-size:12px;color:var(--accent)}
.lhero{display:flex;align-items:center;gap:14px;padding:16px;margin-bottom:14px;border:1px solid var(--accent);border-radius:16px;background:linear-gradient(135deg,#124435,#0a2e23);color:#e4eee9;text-decoration:none}
.lha{display:flex;color:var(--accent)}.lha svg{fill:var(--accent)}
.lht{flex:1;display:flex;flex-direction:column}.lht i{font-style:normal;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.lht b{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.02em}.lht span{font-size:12px;color:#b9cdc3}
.lhp{width:44px;height:44px;border-radius:99px;background:var(--accent);color:var(--accent-fg);display:flex;align-items:center;justify-content:center}
.lchips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.lchip{flex:none;min-height:44px;padding:0 16px;border-radius:99px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font-size:13px;font-weight:500;cursor:pointer}
.lchip.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.lsec{display:flex;align-items:baseline;justify-content:space-between;margin:26px 2px 10px}
.lsec b{font-family:var(--mono);font-weight:500;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}.lsec span{font-size:12px;color:var(--muted)}
.lgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:640px){.lgrid{grid-template-columns:repeat(4,1fr)}}
.lt{display:block;background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;color:var(--fg);text-decoration:none;transition:transform .35s cubic-bezier(.34,1.4,.64,1),border-color .15s}
@media(hover:hover){.lt:hover{border-color:var(--accent);transform:translateY(-2px)}}
.lt:active{transform:scale(.97);transition-duration:.08s}.lt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lart{height:84px;display:flex;align-items:center;justify-content:center;position:relative}
.lbn{font-family:var(--display);font-weight:800;font-size:40px;color:var(--accent);letter-spacing:-.04em}
.lbd{position:absolute;top:8px;right:8px;font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:99px;background:rgba(11,20,17,.7);color:var(--accent);border:1px solid rgba(224,173,76,.4)}
.lnf{padding:10px 12px 12px}.lnf b{display:block;font-family:var(--display);font-weight:800;font-size:16px;letter-spacing:-.01em}.lnf span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.lt.wide{grid-column:1/-1;display:flex;align-items:stretch;background:linear-gradient(135deg,#0d2a3a,#0a1a26);border-color:#1d4a63}
.lt.wide .lart{width:92px;height:auto;flex:none}.lt.wide .lnf{padding:14px 16px;flex:1}.lt.wide .lnf b{font-size:22px;color:#eaf4fa}.lt.wide .lnf span{font-size:12.5px;line-height:1.4;margin-top:4px;color:#a9c7d6}
.tile h2{font-family:var(--display);font-weight:700;font-size:24px;margin:0;letter-spacing:-.02em}
.tile p{margin:0;color:var(--muted);max-width:26ch;position:relative}
.back{display:inline-flex;gap:6px;align-items:center;min-height:44px;color:var(--muted);text-decoration:none;font-weight:500;font-size:14px}
.back:hover{color:var(--fg)}
.ghead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.ghead h2{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:-.02em;margin:0}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.bar .sp{flex:1}
.stat{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.btn{font-weight:600;font-size:14px;border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:8px 14px;border-radius:8px;cursor:pointer;min-height:44px;transition:transform .3s cubic-bezier(.34,1.4,.64,1),border-color .15s;touch-action:manipulation}
@media(hover:hover){.btn:hover:not(:disabled){border-color:var(--accent)}}
.btn:active:not(:disabled),.lchip:active{transform:scale(.96);transition-duration:.06s}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.btn.danger{color:var(--bad)}
.btn.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.felt{--pad:clamp(10px,2.4vw,20px);background:radial-gradient(120% 90% at 50% 10%,var(--felt) 0%,var(--felt-d) 100%);color:var(--felt-fg);border-radius:14px;padding:var(--pad);border:1px solid rgba(0,0,0,.3);position:relative}
.felt .stat,.felt .muted{color:var(--felt-mut)}
.felt .btn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2);color:var(--felt-fg)}
.felt .btn.primary{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.felt .btn:hover:not(:disabled){border-color:var(--accent)}
.note{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-top:12px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.note b{font-family:var(--display);font-size:18px}
.felt .note{background:rgba(0,0,0,.28);border-color:rgba(255,255,255,.14);color:var(--felt-fg)}
.help{color:var(--muted);font-size:13px;margin:12px 0 0;max-width:70ch}
.help summary{cursor:pointer;color:var(--fg);font-weight:600}
.help p{margin:6px 0}

/* cards */
.card{--w:var(--cw,56px);width:var(--w);height:calc(var(--w)*1.4);background:var(--card);color:var(--card-ink);border-radius:calc(var(--w)*.1);box-shadow:0 1px 2px rgba(0,0,0,.4);position:relative;flex:none;user-select:none;-webkit-user-select:none}
.card.red{color:var(--card-red)}
.card .ci{position:absolute;top:calc(var(--w)*.06);left:calc(var(--w)*.09);display:flex;flex-direction:column;align-items:center;line-height:1;font-size:calc(var(--w)*.3)}
.card .ci b{font-family:var(--display);font-weight:700;letter-spacing:-.04em}
.card .ci i{font-style:normal;font-size:.82em}
.card .cm{position:absolute;right:calc(var(--w)*.1);bottom:calc(var(--w)*.05);font-size:calc(var(--w)*.5);line-height:1}
.card.back{background:repeating-linear-gradient(45deg,var(--card-back) 0 4px,var(--card-back2) 4px 8px);border:calc(var(--w)*.07) solid var(--card)}
.card.sel{outline:3px solid var(--accent);outline-offset:1px;z-index:5}
.card.dim{opacity:.4}
.card.clk{cursor:pointer}

/* solitaire */
.sol{--gap:clamp(4px,1.2vw,10px);--cw:clamp(38px,calc((min(100vw - 40px,920px) - 2*var(--pad,18px) - 6*var(--gap))/7),92px)}
.sol .felt{--pad:clamp(8px,2vw,18px)}
.sol .row{display:grid;grid-template-columns:repeat(7,var(--cw));gap:var(--gap);justify-content:center}
.sol .row+.row{margin-top:calc(var(--cw)*.3)}
.slot{width:var(--cw);height:calc(var(--cw)*1.4);border-radius:calc(var(--cw)*.1);outline:2px dashed rgba(255,255,255,.22);outline-offset:-2px;position:relative;display:grid;place-items:center;color:rgba(255,255,255,.28);font-size:calc(var(--cw)*.5);cursor:pointer}
.slot .card{position:absolute;left:0;top:0}
.col{position:relative;width:var(--cw)}
.col .card{position:absolute;left:0}
.col.empty{outline:2px dashed rgba(255,255,255,.22);outline-offset:-2px;border-radius:calc(var(--cw)*.1)}

/* sudoku */
.sdk{display:flex;flex-direction:column;align-items:center;gap:14px}
.sdk .bar{width:min(100%,480px)}
.grid9{display:grid;grid-template-columns:repeat(9,1fr);width:min(100%,480px);aspect-ratio:1;border:2px solid var(--fg);background:var(--panel)}
.cell{position:relative;border:1px solid var(--line);display:grid;place-items:center;font-family:var(--display);font-size:clamp(18px,5.4vw,28px);cursor:pointer;background:transparent;color:var(--ink-user);padding:0;font-weight:500;min-width:0}
.cell:nth-child(3n){border-right:2px solid var(--fg)}
.cell:nth-child(n+19):nth-child(-n+27),.cell:nth-child(n+46):nth-child(-n+54){border-bottom:2px solid var(--fg)}
.cell:nth-child(9n){border-right-width:1px}
.cell.given{color:var(--fg);font-weight:800}
.cell.peer{background:var(--peer)}
.cell.same{background:var(--same)}
.cell.sel{background:var(--selbg);z-index:1;outline:2px solid var(--accent);outline-offset:-2px}
.cell.err{color:var(--bad)}
.notes{display:grid;grid-template-columns:repeat(3,1fr);width:100%;height:100%;font-family:var(--mono);font-size:clamp(7px,2vw,11px);color:var(--muted);line-height:1;font-weight:400}
.notes span{display:grid;place-items:center}
.pad{display:grid;grid-template-columns:repeat(9,1fr);gap:5px;width:min(100%,480px)}
.pad .btn{padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:0;line-height:1.1;font-family:var(--display);font-size:20px;min-height:48px}
.pad .btn small{font-family:var(--mono);font-size:10px;color:var(--muted);font-weight:400}
.sdk .bar.tools .btn{flex:1;padding-inline:8px}
.busy{display:grid;place-items:center;width:min(100%,480px);aspect-ratio:1;color:var(--muted)}

/* domino */
.dmn{--gap:6px}
.seats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.seat{background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:8px 10px;min-width:0}
.seat.turn{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.seat .nm{font-weight:700;display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap}
.seat .nm span{font-family:var(--mono);font-weight:400;font-size:12px;color:var(--felt-mut)}
.seat .bk{display:flex;gap:2px;flex-wrap:wrap;margin-top:6px}
.seat .bk i{width:9px;height:18px;border-radius:2px;background:var(--card);opacity:.9}
.chain{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;align-content:flex-start;min-height:90px;padding:10px 6px;background:rgba(0,0,0,.18);border-radius:10px;--ds:clamp(20px,5.2vw,32px)}
.chain .empty{color:var(--felt-mut);align-self:center}
.dom{--ds:clamp(24px,6.4vw,38px);display:inline-flex;background:var(--card);border-radius:calc(var(--ds)*.22);box-shadow:0 1px 2px rgba(0,0,0,.45);flex:none;border:0;padding:0;position:relative}
.dom.h{flex-direction:row}.dom.v{flex-direction:column}
.dom .half{width:var(--ds);height:var(--ds);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:calc(var(--ds)*.13)}
.dom.h .half+.half{border-left:2px solid rgba(0,0,0,.3)}
.dom.v .half+.half{border-top:2px solid rgba(0,0,0,.3)}
.dom .half i{width:78%;height:78%;border-radius:50%;background:var(--card-ink);place-self:center}
.dom .half u{display:block}
.dom.endL,.dom.endR{outline:2px solid var(--accent);outline-offset:1px}
.dom.pl{cursor:pointer;outline:2px solid var(--accent);outline-offset:2px;transform:translateY(-6px)}
.dom.pl.pick{background:#fff3c9}
.dom.dull{opacity:.55}
.hand{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px;padding-top:6px;min-height:70px}
.hand .dom{--ds:clamp(26px,7.4vw,42px)}
.endinfo{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;color:var(--felt-mut);margin:8px 2px 0}
.say{min-height:24px;text-align:center;margin-top:10px;color:var(--felt-fg);font-weight:500}
.sides{display:flex;gap:8px;justify-content:center;margin-top:10px}

/* capsa */
.cps{--gap:6px;--cw:clamp(40px,calc((min(100vw - 40px,920px) - 2*var(--pad,20px) - 6*var(--gap))/6),68px)}
.rowline{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.rowline .lab{width:78px;flex:none;font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--felt-mut)}
.rowline .lab b{display:block;font-family:var(--display);font-size:14px;letter-spacing:0;text-transform:none;color:var(--felt-fg);min-height:18px}
.slots{display:flex;gap:var(--gap)}
.slot2{width:var(--cw);height:calc(var(--cw)*1.4);border-radius:calc(var(--cw)*.1);outline:2px dashed rgba(255,255,255,.28);outline-offset:-2px;cursor:pointer;position:relative}
.slot2 .card{position:absolute;inset:0}

/* ---- Apple pass: lobi + shell bersama (override; hapus blok ini untuk revert) ---- */
:root{--spring:cubic-bezier(.34,1.4,.64,1);--shadow:0 1px 2px rgba(19,32,27,.06),0 6px 18px rgba(19,32,27,.08)}
:root[data-theme="dark"]{--shadow:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--shadow:none}}
.tile{border-radius:16px}.note,.help{border-radius:14px}.felt{border-radius:20px;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 10px 30px rgba(0,0,0,.18)}
.lbt,.pbox,.pcard{border-radius:14px}
.lt,.lprof,.lbt,.tile{box-shadow:var(--shadow)}
.lt.wide{box-shadow:none}
.lprof,.lhero,.lbt,.back,.pback{transition:transform .35s var(--spring),border-color .15s;touch-action:manipulation}
.lprof:active,.lhero:active,.lbt:active{transform:scale(.97);transition-duration:.08s}
.back:active,.pback:active{opacity:.55;transition:none}
@media(hover:hover){.lbt:hover{transform:translateY(-2px)}}
.lchips{padding:2px 16px 6px;margin-inline:-16px;scroll-snap-type:x proximity;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent)}
.lchips::-webkit-scrollbar{display:none}
.lchip{scroll-snap-align:start;transition:background .2s,color .2s,transform .3s var(--spring)}
.lchip:not(.on){background:transparent}
.lsec{margin-top:28px}
.lsec b{letter-spacing:.14em}
.ghead{flex-direction:column;align-items:flex-start;gap:0;margin-bottom:12px}
.ghead .back{order:-1;margin-left:-4px;padding-right:12px}
.ghead h2{font-size:clamp(28px,6vw,36px);letter-spacing:-.028em;line-height:1.1}
.help summary{min-height:44px;display:flex;align-items:center}
/* scroll-edge header: hairline + brand fade in with --sp (0..1, set from scrollY) */
.top{border-bottom-color:color-mix(in srgb,var(--line) calc(var(--sp,0)*100%),transparent)}
body.lob .brand{opacity:var(--sp,0)}
.lbig{font-family:var(--display);font-weight:800;font-size:clamp(34px,8vw,44px);letter-spacing:-.034em;line-height:1.05;margin:0 0 14px}
/* sliding filter pill (springs in JS) */
.lchips{position:relative}
.lpill{position:absolute;left:0;top:2px;height:44px;width:0;border-radius:99px;background:var(--accent);pointer-events:none;will-change:transform,width}
.lchips .lchip{position:relative}
.lchips .lchip.on{background:transparent;border-color:transparent;color:var(--accent-fg)}
.pressed{transform:scale(.97)!important;transition-duration:.09s!important}
/* profile bottom sheet */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.4);opacity:0;pointer-events:none}
.scrim.on{pointer-events:auto}
.sheet{position:fixed;z-index:51;left:50%;bottom:0;width:min(100%,560px);height:min(86dvh,700px);margin-left:calc(min(100%,560px)/-2);display:flex;flex-direction:column;border-radius:26px 26px 0 0;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:saturate(180%) blur(32px);backdrop-filter:saturate(180%) blur(32px);box-shadow:0 -8px 40px rgba(0,0,0,.28);transform:translateY(100%);visibility:hidden}
.sheet.on{visibility:visible}
.sh-top{position:relative;flex:none;display:flex;align-items:center;justify-content:space-between;padding:8px 16px 4px;touch-action:none;cursor:grab}
.sh-top i{position:absolute;left:50%;top:8px;width:38px;height:5px;margin-left:-19px;border-radius:3px;background:var(--muted);opacity:.5}

.sh-top button{margin-top:10px;min-height:44px;padding:0 12px;border:0;background:none;color:var(--accent);font-size:16px;font-weight:600;cursor:pointer}
.phead input{min-width:0}
.sh-body{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:0 16px max(24px,env(safe-area-inset-bottom))}
@media (prefers-reduced-transparency:reduce){.sheet{background:var(--bg);-webkit-backdrop-filter:none;backdrop-filter:none}}
@media (prefers-reduced-motion:reduce){.lprof:active,.lhero:active,.lbt:active{transform:none}}

const HAND_NAMES=['High Card','Pair','Two Pair','Three of a Kind','Straight','Flush','Full House','Four of a Kind','Straight Flush'];
function evalHand(cs){
  const n=cs.length,cnt=new Array(15).fill(0),rs=[];
  for(let i=0;i<n;i++){cnt[cs[i].r]++;rs.push(cs[i].r)}
  rs.sort((a,b)=>b-a);
  const groups=[];
  for(let r=14;r>=2;r--)if(cnt[r])groups.push([r,cnt[r]]);
  groups.sort((a,b)=>b[1]-a[1]);
  let flush=n===5;
  if(flush)for(let i=1;i<5;i++)if(cs[i].s!==cs[0].s){flush=false;break}
  let sh=0;
  if(n===5&&groups.length===5){
    if(rs[0]-rs[4]===4)sh=rs[0];
    else if(rs[0]===14&&rs[1]===5&&rs[4]===2)sh=5;
  }
  const kick=groups.map(g=>g[0]);
  if(sh&&flush)return[8,sh];
  if(groups[0][1]===4)return[7,...kick];
  if(groups[0][1]===3&&groups[1]&&groups[1][1]===2)return[6,...kick];
  if(flush)return[5,...rs];
  if(sh)return[4,sh];
  if(groups[0][1]===3)return[3,...kick];
  if(groups[0][1]===2&&groups[1]&&groups[1][1]===2)return[2,...kick];
  if(groups[0][1]===2)return[1,...kick];
  return[0,...rs];
}

function Solitaire(box){
  const T=timers();
  const root=el('div','sol');box.appendChild(root);
  let st,hist,sel,won,moves,secs,auto,draw=store.get('sol-draw',1)===3?3:1,timeEl;
  const sv=c=>c.r===14?1:c.r;

  function deal(){Stats.arm('solitaire');
    const d=shuffle(newDeck()).map(c=>({r:c.r,s:c.s,up:false}));
    st={stock:[],waste:[],found:[[],[],[],[]],tab:[[],[],[],[],[],[],[]]};
    for(let i=0;i<7;i++)for(let j=0;j<=i;j++){const c=d.pop();c.up=j===i;st.tab[i].push(c)}
    st.stock=d;hist=[];sel=null;won=false;moves=0;secs=0;auto=false;render();
  }
  const push=()=>{hist.push(JSON.stringify(st));if(hist.length>300)hist.shift()};
  function undo(){if(!hist.length||auto)return;st=JSON.parse(hist.pop());sel=null;won=false;render()}
  function canTab(c,col){
    const p=st.tab[col];
    if(!p.length)return sv(c)===13;
    const t=p[p.length-1];
    return t.up&&RED[t.s]!==RED[c.s]&&sv(t)===sv(c)+1;
  }
  const canFound=c=>st.found[c.s].length+1===sv(c);
  function selCards(){
    if(!sel)return[];
    if(sel.k==='waste'){const w=st.waste;return w.length?[w[w.length-1]]:[]}
    if(sel.k==='tab')return st.tab[sel.c].slice(sel.i);
    if(sel.k==='found'){const f=st.found[sel.s];return f.length?[f[f.length-1]]:[]}
    return[];
  }
  function take(){
    const cs=selCards();
    if(sel.k==='waste')st.waste.pop();
    else if(sel.k==='tab')st.tab[sel.c].length=sel.i;
    else st.found[sel.s].pop();
    return cs;
  }
  function checkWin(){if(st.found.every(f=>f.length===13))won=true}
  function afterMove(src){
    if(src!=null){const p=st.tab[src];if(p.length&&!p[p.length-1].up)p[p.length-1].up=true}
    moves++;sel=null;checkWin();render();
  }
  function toTab(col){
    const cs=selCards();
    if(!cs.length||(sel.k==='tab'&&sel.c===col)||!canTab(cs[0],col))return false;
    push();const src=sel.k==='tab'?sel.c:null;const m=take();st.tab[col].push(...m);afterMove(src);return true;
  }
  function toFound(s){
    const cs=selCards();
    if(cs.length!==1||cs[0].s!==s||!canFound(cs[0]))return false;
    push();const src=sel.k==='tab'?sel.c:null;const c=take()[0];st.found[s].push(c);afterMove(src);return true;
  }
  function autoMove(){
    const cs=selCards();
    if(!cs.length){sel=null;render();return}
    if(cs.length===1&&toFound(cs[0].s))return;
    for(const wantEmpty of[false,true]){
      for(let c=0;c<7;c++){
        if((st.tab[c].length===0)!==wantEmpty)continue;
        if(wantEmpty&&sel.k==='tab'&&sel.i===0)continue;
        if(toTab(c))return;
      }
    }
    sel=null;render();
  }
  function drawStock(){
    push();sel=null;
    if(st.stock.length){
      for(let i=0;i<draw&&st.stock.length;i++){const c=st.stock.pop();c.up=true;st.waste.push(c)}
    }else{
      while(st.waste.length){const c=st.waste.pop();c.up=false;st.stock.push(c)}
    }
    moves++;render();
  }
  function onClick(e){
    if(won||auto)return;
    const t=e.target.closest('[data-k]');
    if(!t){if(sel){sel=null;render()}return}
    const k=t.dataset.k;
    if(k==='stock'){drawStock();return}
    if(k==='waste'){
      if(!st.waste.length)return;
      if(sel&&sel.k==='waste'){autoMove();return}
      sel={k:'waste'};render();return;
    }
    if(k==='found'){
      const s=+t.dataset.s;
      if(sel){if(!toFound(s)){sel=null;render()}return}
      if(st.found[s].length){sel={k:'found',s};render()}
      return;
    }
    if(k==='col'){const c=+t.dataset.c;if(sel&&!toTab(c)){sel=null;render()}return}
    if(k==='tc'){
      const c=+t.dataset.c,i=+t.dataset.i,card=st.tab[c][i];

  root.addEventListener('click',onClick);

  function canAuto(){return !won&&!auto&&!st.stock.length&&!st.waste.length&&st.tab.every(p=>p.every(c=>c.up))&&st.found.some(f=>f.length<13)}

      if(p.length&&canFound(p[p.length-1])){

  function isSel(k,c,i){

    const d1=btn('Buka 1',draw===1?'on':'',()=>{draw=1;store.set('sol-draw',1);deal()});
    const d3=btn('Buka 3',draw===3?'on':'',()=>{draw=3;store.set('sol-draw',3);deal()});
    const un=btn('Undo','',undo);un.disabled=!hist.length||auto;
    const au=btn('Selesaikan otomatis','primary',()=>{auto=true;autoStep()});au.hidden=!canAuto();
    timeEl=el('span','stat');
    bar.append(d1,d3,un,au,el('span','sp'),timeEl,btn('Kocok ulang','',deal));
    updTime();
    root.append(bar);

    const f=el('div','felt');
    const top=el('div','row');
    const sSlot=el('div','slot');sSlot.dataset.k='stock';
    if(st.stock.length)sSlot.append(backEl('clk'));else sSlot.textContent='↻';
    const wSlot=el('div','slot');wSlot.style.outline='none';

    }
    top.append(sSlot,wSlot,el('div'));
    for(let s=0;s<4;s++){
      const fs=el('div','slot');fs.dataset.k='found';fs.dataset.s=s;
      fs.textContent=SUITS[s];

    const tab=el('div','row');
    st.tab.forEach((p,ci)=>{
      const col=el('div','col'+(p.length?'':' empty'));col.dataset.k='col';col.dataset.c=ci;
      let y=0;
      p.forEach((c,i)=>{
        const e=c.up?cardEl(c,'clk'+(isSel('tab',ci,i)?' sel':'')):backEl('clk');

      n.append(btn('Main lagi','primary',deal));root.append(n);
    }
  }
  function updTime(){if(timeEl)timeEl.textContent=fmtTime(secs)+' · '+moves+' langkah'}

  deal();

}

function solveGrid(g0,limit,randomize){
  const g=g0.slice(),rows=new Array(9).fill(0),cols=new Array(9).fill(0),boxes=new Array(9).fill(0);
  for(let i=0;i<81;i++)if(g[i]){const b=1<<g[i],r=(i/9)|0,c=i%9;rows[r]|=b;cols[c]|=b;boxes[((r/3)|0)*3+((c/3)|0)]|=b}
  let count=0,first=null;
  const pc=x=>{let n=0;while(x){x&=x-1;n++}return n};
  function rec(){
    let best=-1,bm=0,bn=10;
    for(let i=0;i<81;i++){
      if(g[i])continue;
      const r=(i/9)|0,c=i%9,b=((r/3)|0)*3+((c/3)|0);
      const m=~(rows[r]|cols[c]|boxes[b])&0x3FE,n=pc(m);
      if(n<bn){bn=n;best=i;bm=m;if(n<=1)break}
    }
    if(best<0){count++;if(!first)first=g.slice();return count>=limit}
    if(bn===0)return false;
    const vals=[];for(let v=1;v<=9;v++)if(bm&(1<<v))vals.push(v);
    if(randomize)shuffle(vals);
    const r=(best/9)|0,c=best%9,b=((r/3)|0)*3+((c/3)|0);
    for(const v of vals){
      const bit=1<<v;g[best]=v;rows[r]|=bit;cols[c]|=bit;boxes[b]|=bit;
      if(rec())return true;
      g[best]=0;rows[r]&=~bit;cols[c]&=~bit;boxes[b]&=~bit;
    }
    return false;
  }
  rec();
  return{count,sol:first};
}
function genSudoku(givens){
  const sol=solveGrid(new Array(81).fill(0),1,true).sol;
  const puz=sol.slice(),idx=shuffle([...Array(81).keys()]);
  let filled=81;
  for(const i of idx){
    if(filled<=givens)break;
    const v=puz[i];puz[i]=0;
    if(solveGrid(puz,2,false).count!==1)puz[i]=v;else filled--;
  }
  return{puz,sol};
}
function Sudoku(box){
  const T=timers();
  const root=el('div','sdk');box.appendChild(root);
  const GIV={Mudah:40,Sedang:34,Sulit:29,Ahli:25};
  let diff=store.get('sdk-diff','Sedang');if(!GIV[diff])diff='Sedang';
  let puz,sol,cur,notes,selI=-1,noteMode=false,hist=[],mist=0,secs=0,won=false,busy=false,hints=0,timeEl;
  const peers=i=>{const r=(i/9)|0,c=i%9,b=((r/3)|0)*3+((c/3)|0);return j=>{const r2=(j/9)|0,c2=j%9;return j!==i&&(r2===r||c2===c||((r2/3)|0)*3+((c2/3)|0)===b)}};
  function newGame(){Stats.arm('sudoku');
    busy=true;render();
    T.after(()=>{
      const g=genSudoku(GIV[diff]);
      puz=g.puz;sol=g.sol;cur=puz.slice();notes=new Array(81).fill(0);
      selI=-1;hist=[];mist=0;secs=0;won=false;hints=0;busy=false;render();
    },40);
  }
  const snap=()=>{hist.push([cur.slice(),notes.slice(),mist]);if(hist.length>200)hist.shift()};
  function undo(){if(!hist.length||won)return;[cur,notes,mist]=hist.pop();render()}
  function checkWin(){if(cur.every((v,i)=>v===sol[i])){won=true}}
  function place(v){
    if(busy||won||selI<0||puz[selI])return;
    snap();
    if(noteMode){
      if(cur[selI]){hist.pop();return}
      notes[selI]^=1<<v;
    }else if(cur[selI]===v){cur[selI]=0}
    else{
      cur[selI]=v;notes[selI]=0;
      if(v!==sol[selI])mist++;
      const pe=peers(selI);
      for(let j=0;j<81;j++)if(pe(j))notes[j]&=~(1<<v);
    }
    checkWin();render();
  }
  function erase(){
    if(busy||won||selI<0||puz[selI])return;
    snap();cur[selI]=0;notes[selI]=0;render();
  }
  function hint(){
    if(busy||won)return;
    let i=selI;
    if(i<0||puz[i]||cur[i]===sol[i]){
      const open=[];for(let j=0;j<81;j++)if(cur[j]!==sol[j])open.push(j);
      if(!open.length)return;i=open[rnd(open.length)];
    }
    snap();selI=i;cur[i]=sol[i];notes[i]=0;hints++;
    const pe=peers(i);for(let j=0;j<81;j++)if(pe(j))notes[j]&=~(1<<sol[i]);
    checkWin();render();
  }
  const onKey=e=>{
    if(e.ctrlKey||e.metaKey||e.altKey){if((e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault();undo()}return}
    if(/^[1-9]$/.test(e.key)){place(+e.key);return}
    if(e.key==='Backspace'||e.key==='Delete'||e.key==='0'){erase();return}
    if(e.key==='n'||e.key==='N'){noteMode=!noteMode;render();return}
    const mv={ArrowUp:-9,ArrowDown:9,ArrowLeft:-1,ArrowRight:1}[e.key];
    if(mv&&!busy){
      e.preventDefault();
      if(selI<0)selI=40;
      else{
        const r=(selI/9)|0,c=selI%9;
        if(e.key==='ArrowUp'&&r>0||e.key==='ArrowDown'&&r<8||e.key==='ArrowLeft'&&c>0||e.key==='ArrowRight'&&c<8)selI+=mv;
      }
      render();
    }
  };
  document.addEventListener('keydown',onKey);

  function render(){
    root.innerHTML='';
    const bar=el('div','bar');
    Object.keys(GIV).forEach(k=>{
      bar.append(btn(k,k===diff?'on':'',()=>{diff=k;store.set('sdk-diff',k);newGame()}));
    });
    root.append(bar);
    const info=el('div','bar');
    timeEl=el('span','stat');
    info.append(timeEl,el('span','sp'),el('span','stat','Salah: '+(busy?0:mist)+' · Petunjuk: '+hints));
    root.append(info);updTime();
    if(busy){root.append(el('div','busy','Menyusun teka-teki…'));return}
    const g=el('div','grid9');g.setAttribute('role','grid');
    const pe=selI>=0?peers(selI):null,sv=selI>=0?cur[selI]:0;
    for(let i=0;i<81;i++){
      const b=el('button','cell');b.type='button';
      const given=!!puz[i];
      if(given)b.classList.add('given');
      if(i===selI)b.classList.add('sel');
      else if(pe&&pe(i))b.classList.add('peer');
      if(sv&&cur[i]===sv&&i!==selI)b.classList.add('same');
      if(!given&&cur[i]&&cur[i]!==sol[i])b.classList.add('err');
      if(cur[i])b.textContent=cur[i];
      else if(notes[i]){
        const n=el('div','notes');
        for(let v=1;v<=9;v++)n.append(el('span','',notes[i]&(1<<v)?v:''));
        b.append(n);
      }
      b.setAttribute('aria-label','Baris '+((i/9|0)+1)+' kolom '+(i%9+1)+(cur[i]?', isi '+cur[i]:', kosong'));
      b.onclick=()=>{selI=i;render()};
      g.append(b);
    }
    root.append(g);
    const tools=el('div','bar tools');
    tools.append(
      btn('Catatan '+(noteMode?'aktif':'mati'),noteMode?'on':'',()=>{noteMode=!noteMode;render()}),
      btn('Hapus','',erase),btn('Undo','',undo),btn('Petunjuk','',hint),btn('Baru','primary',newGame)
    );
    root.append(tools);
    const pad=el('div','pad');
    for(let v=1;v<=9;v++){
      let n=0;for(let i=0;i<81;i++)if(cur[i]===v)n++;
      const b=btn(v+'<small>'+Math.max(0,9-n)+'</small>','',()=>place(v));
      b.disabled=n>=9;pad.append(b);
    }
    root.append(pad);
    if(won){
      Stats.rec('sudoku','w',{min:{t:secs}});
      const n=el('div','note','<div><b>Selesai!</b> <span class="stat">'+fmtTime(secs)+' · salah '+mist+'x · petunjuk '+hints+'</span></div>');
      n.append(btn('Teka-teki baru','primary',newGame));root.append(n);
    }
  }
  function updTime(){if(timeEl)timeEl.textContent=fmtTime(secs)+' · '+diff}
  T.every(()=>{if(!won&&!busy&&puz){secs++;updTime()}},1000);
  newGame();
  return{destroy(){T.clear();document.removeEventListener('keydown',onKey)}};
}

/* tile domino: 2 setengah 3x3, titik ditaruh sesuai angka (dipakai Domino) */
const DOM_PIPS={0:[],1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
function tileEl(a,b,cls){
  const d=el('div','dom '+cls);
  [a,b].forEach(v=>{
    const h=el('div','half');
    DOM_PIPS[v].forEach(c=>{const i=el('i');i.style.gridRow=(Math.floor(c/3)+1);i.style.gridColumn=(c%3+1);h.append(i)});
    d.append(h);
  });
  return d;
}
/* ---------- DOMINO (Gaple, 4 kursi: lokal, room online, bot isi kursi kosong) ----------
   Host (atau mode lokal) menjalankan semua logika dan acak, lalu mengirim state ke semua kursi.
   Pemain remote hanya mengirim langkah; host yang memvalidasi. Kursi kosong diisi bot oleh host. */
function Domino(box,arg){
  const T=timers();
  const root=el('div','dmn pro');box.appendChild(root);
  const PRE=typeof arg==='string'&&arg.length===8?arg.toUpperCase().replace(/[^A-Z0-9]/g,''):'';
  let screen=PRE.length===8?'join':'menu',joinPre=PRE.length===8?PRE:'';
  let mode=null,topic='',rl=null,roomCode='',hostU='',gen=0,status='',joined=false,botQ=[],L=[null,null,null,null];
  const uid=chRand(10);
  let started=false,seats=null,me=0,seq=0,lastSeq=-1,wasOver=false;
  let hands=[[],[],[],[]],chain=[],turn=0,passes=0,over=false,info='',result=null,round=0,scores=[0,0,0,0],waitFor=-1,pick=null;
  const isHost=()=>mode==='local'||mode==='host';
  const NM=i=>i===me?'Kamu':(seats&&seats[i]?seats[i].name:'Bot');
  const sum=h=>h.reduce((s,t)=>s+t[0]+t[1],0);
  const later=(fn,ms)=>{const g=gen;T.after(()=>{if(g===gen)fn()},ms)};
  const myName=()=>(String(Stats.get().name||'').replace(/[^\p{L}\p{N} _.\-]/gu,'').trim().slice(0,12))||'Pemain';
  const fmtC=c=>c.slice(0,4)+'-'+c.slice(4);
  const copyTxt=t=>{try{navigator.clipboard.writeText(t)}catch(e){}};
  const toSeats=()=>L.map(s=>({u:s.u,name:s.name,bot:!!s.bot}));

  /* ---------- jaringan ---------- */
  function post(o,tries){
    const t=topic;if(!t)return;
    const body=JSON.stringify(Object.assign({u:uid},o));
    const go=k=>Relay.send(t,body).catch(()=>{if(topic===t&&k>0)T.after(()=>go(k-1),1500)});
    go(tries==null?2:tries);
  }
  function listen(){
    const t=topic;
    rl=Relay.listen(t,txt=>{
      let m;try{m=JSON.parse(txt)}catch(x){return}
      if(topic===t&&m&&typeof m==='object'&&m.u!==uid)onMsg(m);
    },ev=>{
      if(topic!==t)return;
      if(ev==='open'){status='';render();return}
      if(rl){rl.close();rl=null}
      status='Sulit menghubungi server. Mencoba lagi…';render();
      T.after(()=>{if(topic===t&&!rl)listen()},3000);
    });
  }
  function leave(bye){
    if(bye&&topic&&mode)post({t:'bye'},0);
    if(rl){rl.close();rl=null}
    gen++;topic='';mode=null;started=false;seats=null;joined=false;L=[null,null,null,null];
    lastSeq=-1;wasOver=false;status='';pick=null;waitFor=-1;over=false;
  }

  /* ---------- host: lobi ---------- */
  function sendLobby(){post({t:'lobby',seats:L},2)}
  function hostRoom(){
    leave(false);mode='host';seq=0;
    roomCode=chRand(8);topic='maroe-domino-'+roomCode.toLowerCase();
    botQ=botNames(4);
    L=[{u:uid,name:myName()},null,null,null];
    listen();sendLobby();render();
  }
  function startLocal(){
    leave(false);mode='local';
    const bn=botNames(3);
    L=[{u:uid,name:myName()},{u:'b1',name:bn[0],bot:true},{u:'b2',name:bn[1],bot:true},{u:'b3',name:bn[2],bot:true}];
    beginGame(toSeats());
  }
  function addBot(){
    const e=L.findIndex(x=>!x);if(e<0)return;
    L[e]={u:'bot'+e+'-'+rnd(1e6),name:botQ.shift()||'Bot',bot:true};
    sendLobby();render();
  }
  function hostJoin(m){
    let i=L.findIndex(x=>x&&x.u===m.u);
    if(i<0){
      i=L.findIndex(x=>!x);
      if(i<0){post({t:'full',g:m.u});return}
      L[i]={u:m.u,name:String(m.n||'').replace(/[^\p{L}\p{N} _.\-]/gu,'').trim().slice(0,12)||'Pemain'};
    }
    sendLobby();render();
  }
  function startHost(){
    if(!L.every(Boolean))return;
    const s=toSeats();
    post({t:'start',seats:s});
    beginGame(s);
  }
  function dropSeat(u){
    if(!seats)return;
    const i=seats.findIndex(x=>x&&x.u===u);
    if(i<0||seats[i].bot)return;
    seats[i].bot=true;info=seats[i].name+' keluar. Bot mengambil alih.';
    if(waitFor===i){waitFor=-1;later(step,600)}
    upd();
  }

  /* ---------- guest: join ---------- */
  function joinRoom(code){
    leave(false);mode='guest';roomCode=code;topic='maroe-domino-'+code.toLowerCase();
    screen='lobby';listen();
    let tries=0;
    const hello=()=>post({t:'join',n:myName()},1);
    const tm=T.every(()=>{
      if(joined||started||!topic){clearInterval(tm);return}
      if(++tries>5){clearInterval(tm);leave(false);screen='join';status='Room tidak ditemukan atau room master belum membuatnya. Periksa kodenya.';render();return}
      hello();
    },3500);
    hello();render();
  }

  /* ---------- mulai game ---------- */
  function beginGame(s){
    seats=s;me=seats.findIndex(x=>x.u===uid);if(me<0)me=0;
    started=true;scores=[0,0,0,0];round=0;over=false;result=null;wasOver=false;
    if(isHost())later(deal,900);
    render();
  }

  /* ---------- pesan masuk ---------- */
  function onMsg(m){
    if(started){
      if(isHost()){
        if(m.t==='play')onPlay(m);
        else if(m.t==='bye')dropSeat(m.u);
      }else if(m.t==='state')applyState(m);
      else if(m.t==='bye'&&m.u===hostU){leave(false);screen='menu';status='Room master keluar dari room.';render()}
      return;
    }
    if(isHost()){
      if(m.t==='join')hostJoin(m);
      else if(m.t==='bye'){const i=L.findIndex(x=>x&&x.u===m.u);if(i>0){L[i]=null;sendLobby();render()}}
      return;
    }
    if(m.t==='lobby'&&Array.isArray(m.seats)){
      if(!hostU)hostU=m.u;
      if(m.u!==hostU)return;
      L=m.seats;if(L.some(x=>x&&x.u===uid))joined=true;
      render();
    }else if(m.t==='full'&&m.g===uid){
      leave(false);screen='join';status='Room ini sudah penuh.';render();
    }else if(m.t==='start'&&m.u===hostU&&Array.isArray(m.seats)){
      joined=true;beginGame(m.seats);
    }else if(m.t==='state'&&m.u===hostU&&Array.isArray(m.seats)){
      joined=true;started=true;applyState(m);
    }else if(m.t==='bye'&&m.u===hostU){
      leave(false);screen='menu';status='Room master keluar dari room.';render();
    }
  }
  function applyState(m){
    if(m.s<=lastSeq)return;lastSeq=m.s;
    seats=m.seats;me=seats.findIndex(x=>x.u===uid);if(me<0)me=0;
    hands=m.hands;chain=m.chain;turn=m.turn;passes=m.passes;over=m.over;info=m.info;
    result=m.result;round=m.round;scores=m.scores;waitFor=m.waitFor;
    if(over&&!wasOver&&result)recordEnd(result.w);
    wasOver=over;
    render();
  }
  function onPlay(m){
    if(over||waitFor<0||!seats[waitFor]||seats[waitFor].u!==m.u)return;
    const mv=legal(waitFor).find(x=>x.t===m.ti&&x.side===m.side);
    if(mv)applyPlay(waitFor,mv.t,mv.side);
  }
  function publish(){
    if(!isHost()||mode==='local')return;
    seq++;
    post({t:'state',s:seq,seats,hands,chain,turn,passes,over,info,result,round,scores,waitFor});
  }
  function upd(){publish();render()}

  /* ---------- aturan main (dijalankan host) ---------- */
  function legal(p){
    const out=[],h=hands[p];
    if(!chain.length){h.forEach((t,i)=>{if(t[0]===6&&t[1]===6)out.push({t:i,side:'R'})});return out}
    const Lend=chain[0][0],Rend=chain[chain.length-1][1];
    h.forEach((t,i)=>{
      if(t[0]===Lend||t[1]===Lend)out.push({t:i,side:'L'});
      if(t[0]===Rend||t[1]===Rend)out.push({t:i,side:'R'});
    });
    return out;
  }
  function deal(){
    if(!isHost())return;
    const all=[];for(let a=0;a<=6;a++)for(let b=a;b<=6;b++)all.push([a,b]);
    shuffle(all);
    hands=[0,1,2,3].map(i=>all.slice(i*7,i*7+7).sort((x,y)=>x[0]+x[1]-y[0]-y[1]));
    gen++;chain=[];passes=0;over=false;result=null;round++;waitFor=-1;pick=null;wasOver=false;
    turn=hands.findIndex(h=>h.some(t=>t[0]===6&&t[1]===6));
    info=NM(turn)+' pegang 6-6 dan jalan duluan.';
    upd();later(step,900);
  }
  function step(){
    if(over||!isHost())return;
    const p=turn,mv=legal(p);
    if(!mv.length){
      passes++;info=NM(p)+(p===me?' tidak punya kartu yang cocok. Pass.':' pass.');
      if(passes>=4){finish(-1);return}
      turn=(p+1)%4;upd();later(step,p===me?1100:800);return;
    }
    if(!seats[p].bot){
      waitFor=p;info=p===me?'Giliranmu.':'Menunggu '+NM(p)+'…';upd();return;
    }
    upd();
    later(()=>{const m=botPick(p,legal(p));applyPlay(p,m.t,m.side)},850);
  }
  function applyPlay(p,ti,side){
    const t=hands[p].splice(ti,1)[0];
    if(!chain.length)chain.push([6,6]);
    else if(side==='L'){const a=chain[0][0];chain.unshift(t[1]===a?[t[0],t[1]]:[t[1],t[0]])}
    else{const b=chain[chain.length-1][1];chain.push(t[0]===b?[t[0],t[1]]:[t[1],t[0]])}
    info=NM(p)+' main '+t[0]+'-'+t[1]+'.';passes=0;pick=null;waitFor=-1;
    if(!hands[p].length){finish(p);return}
    turn=(p+1)%4;upd();later(step,380);
  }
  function finish(w){
    over=true;gen++;
    if(w<0){
      const s=hands.map(sum),mn=Math.min(...s),ws=s.map((x,i)=>x===mn?i:-1).filter(i=>i>=0);
      if(ws.length===1){w=ws[0];info='Semua buntu. '+NM(w)+' menang dengan sisa angka paling kecil ('+mn+').'}
      else{info='Semua buntu dan angka terkecil seri. Ronde ini seri.';w=-2}
    }else info=NM(w)+' menghabiskan semua kartunya.';
    if(w>=0)scores[w]++;
    result={w};recordEnd(w);upd();
  }
  function recordEnd(w){Stats.arm('domino');Stats.rec('domino',w===me?'w':w===-2?'d':'l')}
  function botPick(p,mv){
    const h=hands[p];let best=mv[0],bs=-1e9;
    for(const m of mv){
      const t=h[m.t],rest=h.filter((_,i)=>i!==m.t);
      let end;
      if(!chain.length)end=6;
      else if(m.side==='L')end=t[0]===chain[0][0]?t[1]:t[0];
      else end=t[0]===chain[chain.length-1][1]?t[1]:t[0];
      const s=t[0]+t[1]+(t[0]===t[1]?3:0)+rest.filter(x=>x[0]===end||x[1]===end).length*2.5+Math.random();
      if(s>bs){bs=s;best=m}
    }
    return best;
  }

  /* ---------- input pemain ---------- */
  function humanPlay(ti,side){
    if(mode==='guest'){post({t:'play',ti,side});pick=null;render();return}
    applyPlay(me,ti,side);
  }
  function clickTile(ti){
    if(over||waitFor!==me)return;
    const sides=legal(me).filter(m=>m.t===ti).map(m=>m.side);
    if(!sides.length)return;
    if(sides.length===1||(chain.length&&chain[0][0]===chain[chain.length-1][1])){humanPlay(ti,sides[sides.length-1]);return}
    pick=ti;render();
  }

  /* ---------- tampilan ---------- */
  function render(){
    root.innerHTML='';
    if(started)return renderGame();
    if(screen==='join')return renderJoin();
    if(mode)return renderLobby();
    return renderMenu();
  }
  function renderMenu(){
    const f=el('div','felt hubmenu');
    f.append(el('p','','Empat pemain, 28 kartu. Habiskan kartumu duluan.'));
    const a=el('div','actions');
    a.append(
      btn('Main sendiri, lawan 3 bot','primary',startLocal),
      btn('Buat room (online)','',hostRoom),
      btn('Gabung dengan kode','',()=>{screen='join';status='';render()})
    );
    f.append(a);root.append(f);
  }
  function renderJoin(){
    const f=el('div','felt');
    const inp=el('input');inp.type='text';inp.maxLength=9;inp.placeholder='ABCD-EFGH';
    inp.autocapitalize='characters';inp.autocomplete='off';inp.spellcheck=false;
    inp.value=joinPre?fmtC(joinPre):'';
    inp.style.cssText='font:700 22px var(--mono);letter-spacing:.12em;text-align:center;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.3);color:var(--felt-fg);width:100%';
    inp.oninput=()=>{inp.value=inp.value.toUpperCase().replace(/[^A-Z0-9-]/g,'')};
    const go=btn('Gabung','primary',()=>{
      const c=inp.value.replace(/[^A-Z0-9]/g,'');
      if(c.length!==8){status='Kodenya 8 huruf atau angka.';render();return}
      joinRoom(c);
    });
    f.append(inp,go,el('p','',status),btn('Kembali','',()=>{screen='menu';status='';render()}));
    root.append(f);
    if(joinPre){const c=joinPre;joinPre='';if(c.length===8)joinRoom(c)}
  }
  function renderLobby(){
    const f=el('div','felt');
    const host=mode==='host';

/* ---------- CAPSA SUSUN (13 kartu, 3 baris, lawan 3 bot) ---------- */
function royalty(f,m,b){
  let r=0;
  if(f[0]===3)r+=3;
  if(m[0]===6)r+=2;else if(m[0]===7)r+=8;else if(m[0]===8)r+=m[1]===14?20:10;
  if(b[0]===7)r+=4;else if(b[0]===8)r+=b[1]===14?10:5;
  return r;
}
function arrScore(a){
  const fv=evalHand(a.slice(0,3)),mv=evalHand(a.slice(3,8)),bv=evalHand(a.slice(8));
  const nf=num(fv),nm=num(mv),nb=num(bv);
  const st=x=>x/759375;
  const s=royalty(fv,mv,bv)*3+st(nb)+1.3*st(nm)+1.7*st(nf);
  return(nm<nf||nb<nm)?s-1000:s;
}
function bestArr(cards){
  let best=null,bs=-1e9;
  for(let r=0;r<30;r++){
    const a=r===0?cards.slice().sort((x,y)=>x.r-y.r):shuffle(cards.slice());
    let s=arrScore(a);
    for(let it=0;it<240;it++){
      const i=rnd(13),j=rnd(13);if(i===j)continue;
      [a[i],a[j]]=[a[j],a[i]];
      const s2=arrScore(a);
      if(s2>=s)s=s2;else[a[i],a[j]]=[a[j],a[i]];
    }
    if(s>bs){bs=s;best=a.slice()}
  }
  return[best.slice(0,3),best.slice(3,8),best.slice(8)];
}
function summarize(arr){
  const v=arr.map(evalHand),n=v.map(num);
  const foul=n[1]<n[0]||n[2]<n[1];
  return{arr,v,n,foul,roy:foul?0:royalty(v[0],v[1],v[2])};
}
function pairPts(A,B){
  if(A.foul&&B.foul)return 0;
  if(A.foul)return-(6+B.roy);
  if(B.foul)return 6+A.roy;
  let w=0;for(let k=0;k<3;k++)w+=Math.sign(A.n[k]-B.n[k]);
  let s=w;if(w===3)s+=3;if(w===-3)s-=3;
  return s+A.roy-B.roy;
}
/* ---------- ROOM ONLINE BERSAMA (dipakai Capsa & Hold'em) ----------
   Host menjalankan semua aturan dan acak. Pemain lain hanya mengirim aksi ('in').
   State umum dikirim ke semua ('st'); kartu privat hanya ke pemiliknya ('pv'). */
const roomName=()=>(String(Stats.get().name||'').replace(/[^\p{L}\p{N} _.\-]/gu,'').trim().slice(0,12))||'Pemain';
function RoomNet(game){
  const N={role:'',code:'',topic:'',uid:chRand(10),hostU:'',seats:[null,null,null,null],names:[],cap:4,rl:null,dead:false,started:false,seq:0,lastS:-1,lastQ:{},q:0,joined:false,tries:0,h:{}};
  const tm=timers();
  const cln=v=>(String(v==null?'':v).replace(/[^\p{L}\p{N} _.\-]/gu,'').trim().slice(0,12))||'Pemain';
  const st=t=>{if(N.h.status)N.h.status(t)};
  function post(o,tries){
    const t=N.topic;if(!t||N.dead)return;
    const body=JSON.stringify(Object.assign({u:N.uid},o));
    const go=k=>Relay.send(t,body).catch(()=>{if(N.topic===t&&!N.dead&&k>0)tm.after(()=>go(k-1),1500)});
    go(tries==null?2:tries);
  }
  function listen(){
    const t=N.topic;if(!t)return;
    if(N.rl){N.rl.close();N.rl=null}
    N.rl=Relay.listen(t,txt=>{
      let m;try{m=JSON.parse(txt)}catch(x){return}
      if(N.topic===t&&!N.dead&&m&&typeof m==='object'&&typeof m.u==='string'&&m.u!==N.uid)route(m);
    },ev=>{
      if(N.topic!==t||N.dead)return;
      if(ev==='open'){st('');return}
      if(N.rl){N.rl.close();N.rl=null}
      st('Sulit menghubungi server. Mencoba lagi…');
      tm.after(()=>{if(N.topic===t&&!N.dead&&!N.rl)listen()},3000);
    });
  }
  function lobby(){post({t:'lobby',seats:N.seats,cap:N.cap},2);if(N.h.lobby)N.h.lobby()}
  function route(m){
    /* tamu yang belum sempat menerima 'start' tapi sudah dapat state: anggap game sudah mulai */
    if(!N.started&&N.role==='guest'&&(m.t==='st'||m.t==='pv')&&m.u===N.hostU&&N.hostU){
      N.started=true;if(N.h.start)N.h.start(N.seats);
    }
    if(N.started){
      if(N.role==='host'){
        if(m.t==='in'){const q=m.q|0;if(q>(N.lastQ[m.u]||0)){N.lastQ[m.u]=q;if(N.h.onIn)N.h.onIn(m.u,m)}}
        else if(m.t==='bye'){if(N.h.onDrop)N.h.onDrop(m.u)}
      }else{
        if(m.t==='st'&&m.u===N.hostU&&m.s>N.lastS){N.lastS=m.s;if(N.h.onState)N.h.onState(m)}
        else if(m.t==='pv'&&m.u===N.hostU&&m.g===N.uid){if(N.h.onPriv)N.h.onPriv(m)}
        else if(m.t==='bye'&&m.u===N.hostU){if(N.h.hostLeft)N.h.hostLeft()}
      }
      return;
    }
    if(N.role==='host'){
      if(m.t==='join'){
        let i=N.seats.findIndex(x=>x&&x.u===m.u);
        if(i<0){i=N.seats.findIndex(x=>!x);if(i<0){post({t:'full',g:m.u});return}N.seats[i]={u:m.u,name:cln(m.n)}}
        lobby();
      }else if(m.t==='bye'){const i=N.seats.findIndex(x=>x&&x.u===m.u);if(i>0){N.seats[i]=null;lobby()}}
      return;
    }
    if(m.t==='lobby'&&Array.isArray(m.seats)&&m.seats.some(x=>x&&x.u===N.uid)){
      if(!N.hostU)N.hostU=m.u;
      if(m.u!==N.hostU)return;
      N.joined=true;N.seats=m.seats;if(N.h.lobby)N.h.lobby();st('Terhubung ke server.');
    }else if(m.t==='full'&&m.g===N.uid){if(N.h.full)N.h.full()}
    else if(m.t==='start'&&m.u===N.hostU&&Array.isArray(m.seats)){N.started=true;N.seats=m.seats;if(N.h.start)N.h.start(m.seats)}
    else if(m.t==='bye'&&m.u===N.hostU){if(N.h.hostLeft)N.h.hostLeft()}
  }
  return{
    get role(){return N.role},get uid(){return N.uid},get code(){return N.code},
    get seats(){return N.seats},get started(){return N.started},
    get h(){return N.h},set h(v){N.h=v},
    host(cap,name){
      N.role='host';N.code=chRand(8);N.topic='maroe-'+game+'-'+N.code.toLowerCase();N.cap=cap;
      N.names=botNames(4);N.seats=Array(cap).fill(null);N.seats[0]={u:N.uid,name:cln(name)};N.hostU=N.uid;
      listen();lobby();
    },
    join(code,name){
      N.role='guest';N.code=code.toUpperCase();N.topic='maroe-'+game+'-'+code.toLowerCase();
      listen();
      const hello=()=>post({t:'join',n:cln(name)},1);
      hello();
      const iv=tm.every(()=>{
        if(N.joined||N.started||N.dead){clearInterval(iv);return}
        if(++N.tries>5){clearInterval(iv);if(N.h.fail)N.h.fail();return}
        hello();
      },3500);
    },
    addBot(){
      const e=N.seats.findIndex(x=>!x);if(e<0)return;
      const nm=N.names.find(x=>!N.seats.some(s=>s&&s.name===x))||'Bot';
      N.seats[e]={u:'bot'+e+'-'+rnd(1e6),name:nm,bot:true};lobby();
    },
    kick(i){if(i>0&&N.seats[i]&&N.seats[i].bot){N.seats[i]=null;lobby()}},
    start(){
      if(N.role!=='host'||N.started||N.seats.some(x=>!x))return false;
      const seats=N.seats.map(x=>({u:x.u,name:x.name,bot:!!x.bot}));
      N.started=true;N.seats=seats;post({t:'start',seats},3);
      if(N.h.start)N.h.start(seats);
      return true;
    },
    pub(o){if(N.role!=='host'||!N.started)return;N.seq++;post(Object.assign({t:'st',s:N.seq},o),2)},
    priv(uid,o){if(N.role!=='host')return;post(Object.assign({t:'pv',g:uid},o),2)},
    send(o){if(N.role!=='guest')return;N.q++;post(Object.assign({t:'in',q:N.q},o),4)},
    close(bye){if(bye)post({t:'bye'},0);N.dead=true;if(N.rl){N.rl.close();N.rl=null}tm.clear()}
  };
}
/* Layar room (buat, gabung, lobi, tambah bot). Setelah start, begin(net) dipanggil. */
function RoomHub(root,game,arg,begin,hint){

  function drop(bye){if(net){const n=net;net=null;n.close(bye)}}
  function attach(n){

      lobby:()=>{if(live)ui()},

      start:()=>{if(!live)return;live=false;root.innerHTML='';begin(n)},

/* ---------- CAPSA SUSUN ONLINE (13 kartu, 3 baris, 4 kursi) ----------
   Host membagi kartu, menerima susunan yang dikunci, mengisi bot, lalu menghitung skor. */
function Capsa(box,arg){
  const T=timers();
  const root=el('div','cps pro');box.appendChild(root);
  let net=null,seats=[],me=0,host=true,V=null,H=null,recRound=-1;
  let myHand=null,myRound=0,lockedLocal=false,sel=null,sortMode='rank';
  let rows=[Array(3).fill(null),Array(5).fill(null),Array(5).fill(null)],pool=[];
  const hub=RoomHub(root,'capsa',arg,begin,'Susun 13 kartu jadi tiga baris dan adu. Empat kursi: buat room atau main sendiri.');
  const selfU=()=>net?net.uid:'me';
  const cmp=(a,b)=>sortMode==='suit'?a.s-b.s||b.r-a.r:b.r-a.r||a.s-b.s;
  const cv=c=>[c.r,c.s], fc=a=>({r:a[0],s:a[1]}), keyOf=c=>c.r*4+c.s;
  const sgn=n=>(n>0?'+':'')+n;
  const lk=i=>!!(V&&V.round===myRound&&V.locked&&V.locked[i]);
  const miniRow=cards=>{const d=el('div','mr mini');cards.forEach(c=>d.append(pcard(c)));return d};
  function resetArr(){
    rows=[Array(3).fill(null),Array(5).fill(null),Array(5).fill(null)];
    pool=myHand?myHand.slice().sort(cmp):[];sel=null;
  }
  function applyArr(arr){
    rows=arr.map(r=>r.slice());
    const used=new Set(arr.flat().map(keyOf));
    pool=myHand.filter(c=>!used.has(keyOf(c))).sort(cmp);sel=null;render();
  }
  function clickSlot(r,i){
    const cur=rows[r][i];
    if(cur){
      if(sel){rows[r][i]=sel;pool=pool.filter(c=>c!==sel);pool.push(cur);pool.sort(cmp);sel=null}
      else{rows[r][i]=null;pool.push(cur);pool.sort(cmp)}
    }else if(sel){rows[r][i]=sel;pool=pool.filter(c=>c!==sel);sel=null}
    render();
  }
  function lockMine(){
    if(lockedLocal||!myHand||pool.length||rows.some(r=>r.some(c=>!c)))return;
    const rc=rows.map(r=>r.map(cv));
    lockedLocal=true;
    if(host)hostLock(me,rc,myRound);else net.send({k:'lock',rows:rc,round:myRound});
    render();
  }
  function hostLock(i,rc,rd){
    if(!H||H.phase!=='arrange'||rd!==H.round||H.locked[i]||seats[i].bot)return;
    if(!Array.isArray(rc)||rc.length!==3||!rc.every(Array.isArray)||rc[0].length!==3||rc[1].length!==5||rc[2].length!==5)return;
    const got=rc.flat().map(c=>c[0]*4+c[1]).sort((a,b)=>a-b),want=H.hands[i].map(keyOf).sort((a,b)=>a-b);
    if(got.length!==want.length||got.some((k,j)=>k!==want[j]))return;
    H.rows[i]=rc;H.locked[i]=true;
    if(seats.every((s,k)=>s.bot||H.locked[k]))resolve();else commit();
  }
  function resolve(){
    H.phase='result';
    const arrs=seats.map((s,i)=>(s.bot||!H.locked[i])?bestArr(H.hands[i]):H.rows[i].map(r=>r.map(fc)));
    const S=arrs.map(summarize),pts=seats.map(()=>0);
    for(let a=0;a<seats.length;a++)for(let b=a+1;b<seats.length;b++){const p=pairPts(S[a],S[b]);pts[a]+=p;pts[b]-=p}
    pts.forEach((p,i)=>{H.total[i]+=p});
    H.res={arrs:arrs.map(a=>a.map(r=>r.map(cv))),pts};
    commit();
  }
  function forceRes(){
    if(!H||H.phase!=='arrange')return;
    seats.forEach((s,i)=>{if(!s.bot&&!H.locked[i])s.bot=true});
    resolve();
  }
  function deal(){
    const d=shuffle(newDeck());
    H.round++;H.phase='arrange';H.locked=seats.map(()=>false);H.rows=seats.map(()=>null);H.res=null;
    H.hands=seats.map((_,i)=>d.slice(i*13,i*13+13));
    if(net)seats.forEach((s,i)=>{if(!s.bot&&s.u!==net.uid)net.priv(s.u,{round:H.round,hand:H.hands[i].map(cv)})});
    myHand=H.hands[me];myRound=H.round;lockedLocal=false;
    Stats.arm('capsa');resetArr();commit();
  }
  function commit(){
    V={round:H.round,phase:H.phase,locked:H.locked.slice(),bot:seats.map(s=>!!s.bot),total:H.total.slice(),res:H.res};
    V=JSON.parse(JSON.stringify(V));
    if(net)net.pub(V);
    afterSync();render();
  }
  function afterSync(){
    if(V&&V.phase==='result'&&V.round!==recRound){
      recRound=V.round;const p=V.res.pts[me];
      Stats.rec('capsa',p>0?'w':p<0?'l':'d',{add:{pts:p}});
    }
  }
  function onIn(uid,m){
    if(!m||m.k!=='lock')return;
    const i=seats.findIndex(s=>s.u===uid);if(i>=0)hostLock(i,m.rows,m.round);
  }
  function onDrop(uid){
    if(!H)return;
    const i=seats.findIndex(s=>s.u===uid);if(i<0||seats[i].bot)return;
    seats[i].bot=true;
    if(H.phase==='arrange'&&seats.every((s,k)=>s.bot||H.locked[k]))resolve();else commit();
  }
  function onPriv(m){
    if(!m||m.round<myRound)return;
    myRound=m.round;myHand=m.hand.map(fc);lockedLocal=false;
    Stats.arm('capsa');resetArr();render();
  }
  function renderArrange(f){
    const placed=rows.flat().filter(Boolean).length;
    const E=rows.map(r=>r.every(Boolean)?evalHand(r):null);
    const bad=[false,false,false];
    if(E[0]&&E[1]&&num(E[1])<num(E[0])){bad[0]=bad[1]=true}
    if(E[1]&&E[2]&&num(E[2])<num(E[1])){bad[1]=bad[2]=true}
    ['Depan','Tengah','Belakang'].forEach((name,ri)=>{
      const lane=el('div','lane psl'+(bad[ri]?' bad':''));
      const ll=el('div','ll');
      ll.append(el('span','',name),el('b','',E[ri]?handName(E[ri]):rows[ri].filter(Boolean).length+'/'+rows[ri].length));
      const mt=el('div','meter'),mi=el('i',E[ri]?'t'+E[ri][0]:'t0');
      mi.style.width=E[ri]?((E[ri][0]+1)/9*100)+'%':'0%';
      mt.append(mi);ll.append(mt);lane.append(ll);
      const sl=el('div','slots');
      rows[ri].forEach((c,i)=>{const s=el('div','slot2'+(sel&&!c?' hot':''));s.onclick=()=>clickSlot(ri,i);if(c)s.append(pcard(c,'clk'));sl.append(s)});
      lane.append(sl);f.append(lane);
    });
    if(placed===13&&bad.some(Boolean))f.append(el('p','foulmsg','Susunan mati: Belakang harus lebih kuat dari Tengah, dan Tengah dari Depan.'));
    const cnt=el('div','cnt');cnt.append(el('span','','Kartu kamu'));
    const dots=el('div','dots');for(let i=0;i<13;i++)dots.append(el('i',i<placed?'on':''));
    cnt.append(dots);f.append(cnt);
    const pl=el('div','pool');
    pool.forEach(c=>{const e=pcard(c,'clk'+(sel===c?' sel':''));e.onclick=()=>{sel=sel===c?null:c;render()};pl.append(e)});
    f.append(pl);
    const act=el('div','tools');
    const a=btn('Susun otomatis','',()=>applyArr(bestArr(myHand)));
    const so=btn('Urut: '+(sortMode==='rank'?'angka':'bunga'),'',()=>{sortMode=sortMode==='rank'?'suit':'rank';pool.sort(cmp);render()});
    const rs=btn('Kosongkan','',()=>{resetArr();render()});
    const l=btn('Kunci susunan','primary',lockMine);l.disabled=placed!==13;
    act.append(a,so,rs,el('span','sp'),l);f.append(act);
  }
  function renderWait(f){
    f.append(el('p','pempty','Susunanmu sudah dikunci. Menunggu pemain lain…'));
    const who=seats.map((s,i)=>(!s.bot&&i!==me&&!lk(i))?s.name:null).filter(Boolean);
    if(who.length)f.append(el('p','pnote','Belum kunci: '+who.join(', ')));
    if(host)f.append(btn('Paksa lanjut (yang belum kunci jadi bot)','',forceRes));
  }
  function renderResult(f){
    const res=V.res;
    const S=res.arrs.map(a=>summarize(a.map(r=>r.map(fc))));
    const best=Math.max(...res.pts),ROWN=['Depan','Tengah','Belakang'];
    const grid=el('div','res');
    res.pts.forEach((p,i)=>{
      const b=el('div','pl-res psl'+(p===best?' best':''));b.style.animationDelay=(i*90)+'ms';
      const h=el('h4');
      h.append(avatar(i===me?myAv():i,28),el('span','',(p===best?'♛ ':'')+(i===me?'Kamu':seats[i].name)));
      h.append(el('span','pts '+(p>0?'pos':p<0?'neg':''),sgn(p)));
      b.append(h);
      const s=S[i];
      if(s.foul)b.append(el('div','foulmsg','Susunan mati'));
      s.arr.forEach((r,k)=>{b.append(el('div','hn',ROWN[k]+' · '+handName(s.v[k])));b.append(miniRow(r))});
      if(s.roy)b.append(el('div','hn','Bonus kombinasi: +'+s.roy));
      grid.append(b);
    });
    f.append(grid);
    const mine=res.pts[me];
    const n=el('div','note','<div><b>'+(mine>0?'Kamu untung '+mine+' poin':mine<0?'Kamu rugi '+(-mine)+' poin':'Impas')+'</b></div>');
    if(host)n.append(btn('Ronde berikutnya','primary',()=>deal()));else n.append(el('span','','Menunggu room master…'));
    root.append(n);
  }
  function render(){
    root.innerHTML='';
    const sb=el('div','sb');
    seats.forEach((s,i)=>{
      const tot=V&&V.total?V.total[i]:0,p=el('div','sbi'+(i===me?' me':''));
      p.append(avatar(i===me?myAv():i,24),el('div','','<b>'+(i===me?'Kamu':s.name)+'</b><span class="'+(tot>0?'pos':tot<0?'neg':'')+'">'+sgn(tot)+'</span>'));
      sb.append(p);
    });
    root.append(sb);
    const f=el('div','felt');root.append(f);
    const cur=!!V&&V.round===myRound;
    if(!myHand)f.append(el('p','pempty','Menunggu kartu dibagikan…'));
    else if(cur&&V.phase==='result')renderResult(f);
    else if(lockedLocal||lk(me))renderWait(f);
    else renderArrange(f);
  }
  function begin(n){
    net=n;
    if(n){seats=n.seats.map(x=>({u:x.u,name:x.name,bot:!!x.bot}));host=n.role==='host'}
    else{seats=[{u:'me',name:roomName(),bot:false}].concat(botNames(3).map((nm,i)=>({u:'b'+i,name:nm,bot:true})));host=true}
    me=Math.max(0,seats.findIndex(s=>s.u===selfU()));
    H=host?{round:0,phase:'arrange',locked:seats.map(()=>false),total:seats.map(()=>0),hands:[],rows:[],res:null}:null;
    if(n)n.h={
      onState:m=>{V=m;afterSync();render()},
      onPriv,onIn,onDrop,
      hostLeft:()=>{root.innerHTML='';root.append(el('p','pempty','Room master keluar dari room.'))}
    };
    if(H)deal();else render();
  }
  return{destroy(){if(net)net.close(true);hub.destroy();T.clear()}};
}

/* satu ronde = 7 soal dengan kategori berbeda (selama masih ada pilihan) */
function pickRound(pool,rnd){
  const left=pool.slice(),out=[],used=new Set();
  while(out.length<7&&left.length){
    let k=left.findIndex(q=>!used.has(q.c));
    if(k<0)k=0;
    const q=left.splice(k,1)[0];out.push(q);used.add(q.c);
  }
  return out;
}
const qid=q=>strHash(q.q).toString(36);
function dnorm(s){return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/&/g,' and ').replace(/#/g,' sharp ').replace(/\+/g,' plus ').replace(/['\u2019]/g,'').replace(/[^a-z0-9]+/g,' ').trim()}
function buildIndex(q){
  const m=new Map();
  q.t.forEach((list,ti)=>{
    list.split(',').forEach(item=>{
      const names=item.split('|').map(s=>s.trim()).filter(Boolean);
      names.forEach(n=>{const k=dnorm(n);if(k&&!m.has(k))m.set(k,{tier:ti,label:names[0]})});
    });
  });
  return m;
}
function dl(a,b){
  const m=a.length,n=b.length,d=[];
  for(let i=0;i<=m;i++){d[i]=new Array(n+1).fill(0);d[i][0]=i}
  for(let j=0;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++){
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
    if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1);
  }
  return d[m][n];
}
const maxEdits=n=>n<=3?0:n<=6?1:n<=10?2:3;
function lookupAnswer(input,index,loose){
  const k=dnorm(input).replace(/^(the|a|an) /,'');
  if(!k)return null;
  if(index.has(k))return Object.assign({corrected:false},index.get(k));
  let best=null,bl=0;
  const padded=' '+k+' ';
  for(const [key,v] of index){
    if(key.length>=3&&padded.includes(' '+key+' ')&&key.length>bl){best=v;bl=key.length}
  }
  if(best)return Object.assign({corrected:false},best);
  if(loose&&k.length>=4){
    let pk=null;
    for(const [key,v] of index){
      if(key.startsWith(k)&&(!pk||key.length<pk[0].length||(key.length===pk[0].length&&v.tier<pk[1].tier)))pk=[key,v];
    }
    if(pk)return Object.assign({corrected:true},pk[1]);
  }
  /* autocorrect: salah ketik, huruf tertukar, huruf kurang atau lebih */
  const cands=[[k,0]];
  if(k.includes(' '))k.split(' ').forEach(w=>{if(w.length>=4)cands.push([w,.4])});
  let bd=99,pick=null;
  for(const [word,pen] of cands){
    for(const [key,v] of index){
      if(Math.abs(key.length-word.length)>3)continue;
      const single=!key.includes(' ');
      if(pen&&!single)continue;
      const nn=Math.min(key.length,word.length);
      const lim=loose?(nn<=3?0:nn<=5?1:nn<=8?2:nn<=12?3:4):maxEdits(nn);
      if(!lim)continue;
      if(key.length<=(loose?5:4)&&key[0]!==word[0])continue;
      const d=dl(word,key);
      if(d>lim)continue;
      const sc=d+pen;
      if(sc<bd||(sc===bd&&pick&&v.tier<pick.tier)){bd=sc;pick=v}
    }
  }
  return pick?Object.assign({corrected:true},pick):null;
}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function strHash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}

      const a=y0+worldY(edges[i])/WMAX*hh,b=y0+worldY(edges[i+1])/WMAX*hh;
      ctx.fillStyle=zc[i];ctx.fillRect(x,Math.round(a),3,Math.max(1,Math.round(b-a)));
    }
    const my=Math.round(y0+worldY(camM)/WMAX*hh);
    ctx.fillStyle='#fff';ctx.fillRect(x-4,my-1,3,3);ctx.fillRect(x-5,my,1,1);
    ctx.fillStyle='#02060f';ctx.fillRect(x-4,my,2,1);
  }
  function drawAll(moving){
    bg();surface();shafts();walls();critters();floorDraw();snowDraw();bubDraw();diverDraw(moving);speedLines();gauge();
  }
  function frame(){
    tick++;
    const d=tgtM-camM;
    camM+=d*.05;if(Math.abs(d)<.4)camM=tgtM;
    camY=worldY(camM);speed=camY-lastY;lastY=camY;
    for(const o of crit){if(o.v){o.x+=o.v;if(o.x>W+25)o.x=-25;if(o.x<-25)o.x=W+25}}
    drawAll(Math.abs(speed)>.9);
    onTick&&onTick(camM,zoneOf(camM));
  }
  if(reduce){camY=0;drawAll(false);onTick&&onTick(0,'Sunlight')}
  else T.every(frame,40);
  return{
    set(m){
      tgtM=Math.max(0,Math.min(MAXM,m));
      if(reduce){camM=tgtM;camY=worldY(camM);drawAll(false);onTick&&onTick(camM,zoneOf(camM))}
    },
    setLook(l){
      look=Object.assign({},look,l);
      BG=BGS[look.bg]||BGS[0];pal=BG.pal;sprite=composeSprite(look.ch,look.hat);bub=[];
      if(reduce)drawAll(false);
    }
  };
}

    const r=mulberry(strHash('deepdive-order-v1'));
    const order=DEEP_QS.slice();
    for(let i=order.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[order[i],order[j]]=[order[j],order[i]]}
    const rounds=[];let rest=order.slice();

    setTimeout(()=>{try{inp.focus({preventScroll:true})}catch(e){}},50);
    deadline=Date.now()+25000;Music.sfx('ask');let lastSec=0;

      tm.firstChild.style.width=(left/250)+'%';
      {const sc=Math.ceil(left/1000);if(left>0&&sc<=5&&sc!==lastSec){lastSec=sc;Music.sfx('tick')}}if(left<=0)submit(inp.value,true);

  let busy=false;

  }

  function finish(){

const DS_W=320,DS_H=180,DS_TY=112;

function dsPoly(c,pts,col){
  let a=1e9,b=-1e9;pts.forEach(p=>{a=Math.min(a,p[1]);b=Math.max(b,p[1])});
  a=Math.max(0,Math.floor(a));b=Math.min(DS_H-1,Math.ceil(b));c.fillStyle=(DS_REMAP&&DS_REMAP[col])||col;
  for(let y=a;y<=b;y++){
    const xs=[];
    for(let i=0;i<pts.length;i++){
      const p=pts[i],q=pts[(i+1)%pts.length];
      if((p[1]<=y+.5&&q[1]>y+.5)||(q[1]<=y+.5&&p[1]>y+.5))xs.push(p[0]+(y+.5-p[1])/(q[1]-p[1])*(q[0]-p[0]));
    }
    xs.sort((m,n)=>m-n);
    for(let k=0;k+1<xs.length;k+=2){const x0=Math.round(xs[k]),x1=Math.round(xs[k+1]);if(x1>x0)c.fillRect(x0,y,x1-x0,1)}
  }
}
function dsEll(c,cx,cy,rx,ry,col){

  for(let y=-ry;y<=ry;y++){const k=Math.round(rx*Math.sqrt(Math.max(0,1-(y*y)/(ry*ry+.001))));c.fillRect(Math.round(cx-k),Math.round(cy+y),k*2+1,1)}
}

    return true;
  }

  /* ---------- aksi pemain ---------- */
  function humanShoot(ti){if(!canAct())return;shoot(0,ti)}
  function humanCuff(ti){if(!canAct())return;const slot=S.players[0].items.indexOf('cuffs');if(slot<0)return;useItem(0,slot,ti)}
  function humanItem(slot){
    if(!canAct())return;
    S.pick=null;S.sel=S.sel===slot?null:slot;render();
  }
  function useSel(){
    if(!canAct()||S.sel==null)return;
    const me=S.players[0],slot=S.sel,id=me.items[slot];if(!id)return;
    if(id==='bandage'&&me.hp>=me.max){S.msg='Nyawamu sudah penuh.';S.sel=null;render();return}
    if(id==='saw'&&S.sawed){S.msg='Bilah sudah diasah.';S.sel=null;render();return}
    if(id==='cuffs'){
      const t=S.players.map((p,i)=>i).filter(i=>i>0&&S.players[i].alive&&!S.players[i].cuffed);
      if(!t.length){S.msg='Semua lawan sudah terborgol.';S.sel=null;render();return}
      if(t.length===1){useItem(0,slot,t[0]);return}
      S.pick='cuffs';S.sel=null;render();return;
    }
    useItem(0,slot);
  }

  function humanSteal(ti,sl){if(!canAct())return;if(sl==null){const t=S.players[ti];if(!t||!t.alive||!t.items.length)return;S.pick='stealitem';S.stealT=ti;S.sel=null;render();return}stealItem(0,ti,sl)}
  function stealMenu(){
    if(!canAct())return;
    const me=S.players[0];if(!canSteal(me))return;
    if((me.steals|0)>=STEAL_MAX){S.msg='Jatah curi habis.';S.sel=null;render();return}
    if(me.items.length>=DS_MAXIT){S.msg='Slot itemmu penuh.';S.sel=null;render();return}
    const t=S.players.map((p,i)=>i).filter(i=>i>0&&S.players[i].alive&&S.players[i].items.length);
    if(!t.length){S.msg='Item lawan kosong.';S.sel=null;render();return}
    if(t.length===1){S.pick='stealitem';S.stealT=t[0];S.sel=null;render();return}
    S.pick='steal';S.sel=null;render();
  }

  /* ---------- bot ---------- */
  function botStep(){
    if(!S||S.over)return;
    const pi=S.turn,p=S.players[pi];
    if(!p||!p.alive||p.human)return;
    const L=S.pL,B=S.pB;
    const pl=L/((L+B)||1);
    const has=id=>p.items.indexOf(id);
    const opps=bySeat().filter(i=>i!==pi&&S.players[i].alive);
    let i;
    if(p.hp<p.max&&(i=has('bandage'))>=0)return useItem(pi,i);
    if(p.hp<=p.max-2&&p.hp>=2&&(i=has('pill'))>=0)return useItem(pi,i);
    if(p.k==null&&L>0&&B>0&&(i=has('lens'))>=0)return useItem(pi,i);
    let known=p.k;
    if(known==null&&!S.flipU){if(L===0)known='B';else if(B===0)known='L'}
    if(known==='B'&&opps.length&&(i=has('flip'))>=0){p.k='B';return useItem(pi,i)}
    if(known==='L'&&!S.sawed&&(i=has('saw'))>=0)return useItem(pi,i);
    if(known==null&&L>0&&B>0&&rf()<.45&&(i=has('soda'))>=0)return useItem(pi,i);
    const nx=nextAlive(pi);
    if(nx>=0&&nx!==pi&&!S.players[nx].cuffed&&(i=has('cuffs'))>=0&&rf()<.8)return useItem(pi,i,nx);
    const pick=()=>{
      let best=opps[0],bh=99;
      opps.forEach(j=>{const h=S.players[j].hp-(rf()*.4);if(h<bh){bh=h;best=j}});
      return best;
    };
    if(known==='L')return shoot(pi,pick());
    if(known==='B')return shoot(pi,pi);
    if(pl>.5)return shoot(pi,pick());
    if(pl<.5)return shoot(pi,(p.hp>1||pl<.34)?pi:pick());
    return shoot(pi,rf()<.5&&p.hp>1?pi:pick());
  }

  /* ================= ONLINE (relay ntfy.sh, simulasi lockstep) ================= */
  const cleanName=v=>(String(v==null?'':v).replace(/[^\p{L}\p{N} _.\-]/gu,'').trim().slice(0,12))||'Pemain';
  const nick=()=>cleanName(Stats.get().name);
  const fmtCode=c=>c.slice(0,4)+'-'+c.slice(4);
  const dsCopy=(text,b)=>{
    const done=()=>{const t=b.textContent;b.textContent='Tersalin';T.after(()=>{b.textContent=t},1500)};
    try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done,()=>{});return}}catch(e){}
    const ta=document.createElement('textarea');ta.value=text;document.body.append(ta);ta.select();try{document.execCommand('copy');done()}catch(e){}ta.remove();
  };
  const mkB=(t,cls,fn)=>{const b=el('button','dbtn'+(cls?' '+cls:''),t);b.type='button';b.onclick=fn;return b};
  function nPost(o,tries,keep){
    const n=NET;if(!n)return;
    const body=JSON.stringify(Object.assign({u:n.uid},o));
    const go=k=>Relay.send(n.topic,body,keep).catch(e=>{if(NET===n&&k>0){if(e&&e.wait)setSt('Server relay sedang sibuk, mencoba lagi sebentar...');T.after(()=>go(k-1),(e&&e.wait)||1500+(3-k)*1500)}});
    go(tries==null?3:tries);
  }
  function nOpen(onMsg,onEv){
    const n=NET;if(!n)return;
    nClose();
    const proc=m=>{
      if(!m||typeof m!=='object'||m.u===n.uid||typeof m.u!=='string')return;
      if(m.t==='need'){if(m.g===n.uid&&n.sent&&n.sent[m.q])nPost(n.sent[m.q],2);return}
      if(m.q!=null){
        /* langkah harus diproses berurutan; kalau ada yang bolong, tahan dulu dan minta kirim ulang */
        const last=n.lastQ[m.u]||0;
        if(m.q<=last)return;
        n.pend=n.pend||{};const pu=(n.pend[m.u]=n.pend[m.u]||{});pu[m.q]=m;
        let nx;
        while(NET===n&&(nx=pu[(n.lastQ[m.u]||0)+1])){delete pu[nx.q];n.lastQ[m.u]=nx.q;onMsg(nx)}
        if(NET===n&&Object.keys(pu).length){
          const want=(n.lastQ[m.u]||0)+1,uu=m.u;
          T.after(()=>{if(NET===n&&(n.lastQ[uu]||0)+1===want&&n.pend[uu]&&Object.keys(n.pend[uu]).length)nPost({t:'need',g:uu,q:want},1)},1500);
        }
        return;
      }
      if(NET===n)onMsg(m);
    };
    if(FS_RELAY){
      let h;
      h=Relay.listen(n.topic,txt=>{let m;try{m=JSON.parse(txt)}catch(x){return}proc(m)},ev=>{
        if(NET!==n||n.es!==h)return;
        if(ev==='open'){n.esTry=0;onEv('open');return}
        h.close();n.es=null;n.esTry++;onEv('err');
        T.after(()=>{if(NET===n&&!n.es)nOpen(onMsg,onEv)},Math.min(8000,1000*n.esTry));
      });
      n.es=h;return;
    }
    let e;try{e=new EventSource(CH_RELAY+n.topic+'/sse'+(n.lastT?'?since='+n.lastT:''))}catch(x){onEv('nosupport');return}
    n.es=e;
    e.onopen=()=>{n.esTry=0;onEv('open')};
    e.onmessage=ev=>{
      let d;try{d=JSON.parse(ev.data)}catch(x){return}
      if(!d||d.event!=='message')return;
      if(d.id){if(n.seen.has(d.id))return;n.seen.add(d.id);if(n.seen.size>400)n.seen=new Set([...n.seen].slice(-200))}
      if(d.time)n.lastT=Math.max(n.lastT,d.time);
      let m;try{m=JSON.parse(d.message)}catch(x){return}
      proc(m);
    };
    e.onerror=()=>{
      if(NET!==n||n.es!==e)return;
      e.close();n.es=null;n.esTry++;onEv('err');
      T.after(()=>{if(NET===n)nOpen(onMsg,onEv)},Math.min(8000,1000*n.esTry));
    };
  }
  function nClose(){const n=NET;if(n&&n.es){try{n.es.close()}catch(x){}n.es=null}}
  function nLeave(bye){const n=NET;if(!n)return;if(bye)nPost({t:'bye'},0,true);nClose();NET=null;RR=null}

  function onNetMsg(m){
    const n=NET;if(!n)return;
    if(S&&S.online){gameNet(m);return}
    if(n.role==='host'){
      const L=n.L;
      if(m.t==='join'){
        let i=L.seats.findIndex(x=>x&&x.u===m.u);
        if(i<0){
          i=L.seats.findIndex(x=>!x);
          if(i<0){nPost({t:'full',g:m.u});return}
          let nm=cleanName(m.n),base=nm,k=2;
          while(L.seats.some(x=>x&&x.name===nm))nm=base.slice(0,10)+k++;
          L.seats[i]={u:m.u,name:nm,sk:(m.sk|0)>=0&&(m.sk|0)<DS_SKINS.length?(m.sk|0):0,ch:chOk(m.ch),sw:(m.sw|0)>=0&&(m.sw|0)<DS_SW_SKINS.length?(m.sw|0):0};
        }
        sendLobby();lobbyView();
      }else if(m.t==='bye'){
        const i=L.seats.findIndex(x=>x&&x.u===m.u);
        if(i>0){L.seats[i]=null;sendLobby();lobbyView()}
      }
    }else{
      if(m.t==='lobby'&&Array.isArray(m.seats)&&m.seats.some(x=>x&&x.u===n.uid)){
        n.joined=true;n.hostU=m.u;
        n.L={mode:m.mode,cap:m.cap|0,seats:m.seats.map(x=>x?{u:String(x.u),name:cleanName(x.name),sk:x.sk|0,ch:chOk(x.ch),sw:(x.sw|0)>=0&&(x.sw|0)<DS_SW_SKINS.length?(x.sw|0):0,bot:!!x.bot}:null)};
        lobbyView();setSt('Terhubung ke server.');
      }else if(m.t==='full'&&m.g===n.uid){
        nLeave(false);netMenu('Room ini sudah penuh.');
      }else if(m.t==='start'&&Array.isArray(m.seats)&&m.seats.some(x=>x&&x.u===n.uid)){
        startOnline(m);
      }else if(m.t==='bye'&&m.u===n.hostU){
        nLeave(false);netMenu('Room master keluar dari room.');
      }else if(m.t==='kick'&&m.g===n.uid&&m.u===n.hostU){
        nLeave(false);netMenu('Kamu dikeluarkan oleh room master.');
      }
    }
  }
  function startOnline(cfg){
    const n=NET;if(!n)return;

    const N=seats.length,m=seats.findIndex(x=>x.u===n.uid);
    if(m<0||N<2||N>4)return;
    n.cfg={mode:cfg.mode,seats};n.gone=new Set();
    if(n.role==='guest'&&cfg.u)n.hostU=cfg.u;
    RR=mulberry(cfg.seed>>>0);
    const ps=[];
    for(let j=0;j<N;j++){
      const seat=(m+j)%N,x=seats[seat];
      ps.push({name:j===0?'Kamu':x.name,face:j===0?0:chFace(x.ch),ch:x.ch,human:j===0,remote:j>0&&!x.bot,uid:x.u,seat,sk:x.sk,swi:x.sw|0,hp:0,max:0,items:[],cuffed:false,alive:true,wins:0,k:null});
    }
    start('online',ps);
  }
  function gameNet(m){
    const n=NET;
    if(m.t==='start'){if(n.role!=='host'&&m.u===n.hostU&&Array.isArray(m.seats)&&m.seats.some(x=>x&&x.u===n.uid))startOnline(m);return}
    const p=S.players.find(x=>x.uid===m.u);
    if(m.t==='act'){
      if(!p||!p.remote||p.gone)return;
      S.inbox.push({p,k:m.k,slot:m.slot|0,ti:m.ti==null?null:m.ti});pump();
    }else if(m.t==='bye'){
      if(p&&p.remote)dropPlayer(p);
    }else if(m.t==='kick'&&m.u===n.hostU){
      if(m.g===n.uid){nLeave(false);netMenu('Kamu dikeluarkan oleh room master.');return}
      const q=S.players.find(x=>x.uid===m.g);if(q&&q.remote)dropPlayer(q,true);
    }
  }
  function dropPlayer(p,keep){
    if(!S||p.gone)return;
    p.gone=true;if(NET&&NET.gone)NET.gone.add(p.uid);
    if(!keep&&S.online){
      /* pemain keluar: permainan dihentikan untuk semua */
      S.over=true;S.lock=true;S.fx.aim=-1;S.fx.holder=-1;S.log.push(p.name+' terputus. Permainan dihentikan.');

    if(!S||!S.online||S.over||S.lock)return;

}

  const tv=c=>c.r===14?11:c.r>=10?10:c.r;
  function val(cs){let t=0,a=0;cs.forEach(c=>{t+=tv(c);if(c.r===14)a++});while(t>21&&a>0){t-=10;a--}return{t,soft:a>0&&t<=21}}
