<!doctype html>
<!-- CATATAN UNTUK AGENT LAIN: kalau menambah game dengan lawan bot, ambil nama bot dari botNames(n) (lihat "ATURAN NAMA BOT" di dalam script). Jangan buat nama bot sendiri. -->
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Board Game Maroe</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* Layout: lobby of eight table tiles; each game opens as a felt (or paper, for Sudoku) surface under a slim toolbar. */
:root{
  --bg:#e7eeea; --fg:#13201b; --muted:#566962; --line:#c5d2cb; --panel:#f5f9f7;
  --accent:#b07a1c; --accent-fg:#1a1304; --ink-user:#2557a7;
  --peer:#dfe9e4; --same:#efdba6; --selbg:#e3c274;
  --felt:#15523f; --felt-d:#0d3a2c; --felt-fg:#e9f3ee; --felt-mut:#a9c7ba;
  --card:#fbfaf5; --card-ink:#1c2326; --card-red:#c23a2f; --card-back:#2a438a; --card-back2:#203672;
  --good:#23885a; --bad:#cf3f3f;
  --display:"Bricolage Grotesque",system-ui,sans-serif; --body:"DM Sans",system-ui,sans-serif; --mono:"DM Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1411; --fg:#e4eee9; --muted:#8ea39a; --line:#22352e; --panel:#121f1a;
    --accent:#e0ad4c; --accent-fg:#1a1304; --ink-user:#82b1ff;
    --peer:#1a2c25; --same:#4a3d17; --selbg:#6b5318;
    --felt:#124435; --felt-d:#0a2e23;
    --good:#4cc58a; --bad:#ff7070;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1411; --fg:#e4eee9; --muted:#8ea39a; --line:#22352e; --panel:#121f1a;
  --accent:#e0ad4c; --accent-fg:#1a1304; --ink-user:#82b1ff;
  --peer:#1a2c25; --same:#4a3d17; --selbg:#6b5318;
  --felt:#124435; --felt-d:#0a2e23;
  --good:#4cc58a; --bad:#ff7070;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-block:18px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font-family:inherit}
.wrap{max-width:920px;margin:0 auto}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.brand{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em;color:var(--fg);text-decoration:none}
.sub{color:var(--muted);font-size:13px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,7vw,52px);line-height:1.02;letter-spacing:-.03em;margin:8px 0 10px;text-wrap:balance;max-width:14ch}
.lead{color:var(--muted);max-width:52ch;margin:0 0 22px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.tile{position:relative;display:flex;flex-direction:column;gap:6px;min-height:150px;padding:16px;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--fg);text-decoration:none;overflow:hidden;transition:border-color .15s,transform .15s}
.tile:hover{border-color:var(--accent);transform:translateY(-2px)}
.tile:focus-visible,.btn:focus-visible,.cell:focus-visible,.ch:focus-visible,.dom.pl:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tile .glyph{position:absolute;right:12px;bottom:-6px;font-family:var(--display);font-weight:800;font-size:76px;line-height:1;letter-spacing:-.04em;color:var(--line);pointer-events:none}
.tile .tag{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tile .tag.bot{color:var(--accent)}
.pav{display:inline-flex;align-items:center;justify-content:center;border-radius:99px;border:1.5px solid;font-family:var(--display);font-weight:800;flex:none}
.lprof{display:flex;align-items:center;gap:12px;padding:10px 14px;margin-bottom:12px;border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--fg);text-decoration:none}
.lprof:hover{border-color:var(--accent)}.lpt{display:flex;flex-direction:column;flex:1}.lpt b{font-family:var(--display);font-weight:800;font-size:16px}.lpt span{font-size:12px;color:var(--muted)}.lpa{color:var(--accent);font-size:18px}
.pback{display:inline-flex;align-items:center;min-height:44px;color:var(--muted);text-decoration:none;font-size:14px}
.phead{display:flex;align-items:center;gap:14px;margin:6px 0 12px}
.phead input{flex:1;min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font:700 18px var(--display)}
.ppick{display:flex;flex-wrap:wrap;gap:8px}.ppick button{background:none;border:2px solid transparent;border-radius:99px;padding:0;cursor:pointer}.ppick button.on{border-color:var(--accent)}
.psum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.pbox{padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--panel);display:flex;flex-direction:column;gap:2px}.pbox b{font:800 24px var(--display);color:var(--accent)}.pbox span{font-size:11px;color:var(--muted)}
.pcard{padding:12px 14px;margin-bottom:10px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.pname{font:800 16px var(--display);margin-bottom:6px}.pbits{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}.pbits b{color:var(--fg);font-size:16px}
.pbar{height:6px;border-radius:99px;background:var(--line);margin-top:10px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--accent)}
.pnote{font-size:12px;color:var(--muted);margin-top:6px}.pempty{padding:20px;border:1px dashed var(--line);border-radius:14px;color:var(--muted);font-size:14px}
.pacct{display:flex;flex-direction:column;gap:10px;align-items:flex-start;margin-top:16px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}.pat{display:flex;flex-direction:column;gap:4px}.pat b{font:800 15px var(--display)}.pat span{font-size:12px;color:var(--muted);line-height:1.4}
.pfoot{font-size:12px;color:var(--muted);margin:18px 0 10px}
.lbl{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:22px 2px 8px}
.lbs{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:640px){.lbs{grid-template-columns:repeat(4,1fr)}}
.lbt{display:flex;flex-direction:column;justify-content:space-between;gap:14px;min-height:92px;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;color:var(--fg);text-decoration:none;transition:transform .15s,border-color .15s}
.lbt:hover{border-color:var(--accent);transform:translateY(-2px)}
.lbt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lbg{font-family:var(--display);font-weight:800;font-size:30px;line-height:1;letter-spacing:-.04em;color:var(--muted)}
.lbt.bot .lbg{color:var(--accent)}
.lbt b{font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:-.01em}
.lbt.last{flex-direction:row;align-items:center;min-height:0;gap:12px;border-color:var(--accent)}
.lbt.last i{margin-left:auto;font-style:normal;font-family:var(--mono);font-size:12px;color:var(--accent)}
.lhero{display:flex;align-items:center;gap:14px;padding:16px;margin-bottom:14px;border:1px solid var(--accent);border-radius:16px;background:linear-gradient(135deg,#124435,#0a2e23);color:#e4eee9;text-decoration:none}
.lha{display:flex;color:var(--accent)}.lha svg{fill:var(--accent)}
.lht{flex:1;display:flex;flex-direction:column}.lht i{font-style:normal;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.lht b{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.02em}.lht span{font-size:12px;color:#b9cdc3}
.lhp{width:44px;height:44px;border-radius:99px;background:var(--accent);color:var(--accent-fg);display:flex;align-items:center;justify-content:center}
.lchips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.lchip{flex:none;min-height:44px;padding:0 16px;border-radius:99px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font-size:13px;font-weight:500;cursor:pointer}
.lchip.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.lsec{display:flex;align-items:baseline;justify-content:space-between;margin:26px 2px 10px}
.lsec b{font-family:var(--mono);font-weight:500;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}.lsec span{font-size:12px;color:var(--muted)}
.lgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:640px){.lgrid{grid-template-columns:repeat(4,1fr)}}
.lt{display:block;background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;color:var(--fg);text-decoration:none;transition:transform .15s,border-color .15s}
.lt:hover{border-color:var(--accent);transform:translateY(-2px)}.lt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lart{height:84px;display:flex;align-items:center;justify-content:center;position:relative}
.lbn{font-family:var(--display);font-weight:800;font-size:40px;color:var(--accent);letter-spacing:-.04em}
.lbd{position:absolute;top:8px;right:8px;font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:99px;background:rgba(11,20,17,.7);color:var(--accent);border:1px solid rgba(224,173,76,.4)}
.lnf{padding:10px 12px 12px}.lnf b{display:block;font-family:var(--display);font-weight:800;font-size:16px;letter-spacing:-.01em}.lnf span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.lt.wide{grid-column:1/-1;display:flex;align-items:stretch;background:linear-gradient(135deg,#0d2a3a,#0a1a26);border-color:#1d4a63}
.lt.wide .lart{width:92px;height:auto;flex:none}.lt.wide .lnf{padding:14px 16px;flex:1}.lt.wide .lnf b{font-size:22px}.lt.wide .lnf span{font-size:12.5px;line-height:1.4;margin-top:4px;color:#a9c7d6}
.tile h2{font-family:var(--display);font-weight:700;font-size:24px;margin:0;letter-spacing:-.02em}
.tile p{margin:0;color:var(--muted);max-width:26ch;position:relative}
.back{display:inline-flex;gap:6px;align-items:center;color:var(--muted);text-decoration:none;font-weight:500;font-size:14px}
.back:hover{color:var(--fg)}
.ghead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.ghead h2{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:-.02em;margin:0}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.bar .sp{flex:1}
.stat{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.btn{font-weight:600;font-size:14px;border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:8px 14px;border-radius:6px;cursor:pointer;min-height:38px}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.btn.danger{color:var(--bad)}
.btn.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.felt{--pad:clamp(10px,2.4vw,20px);background:radial-gradient(120% 90% at 50% 10%,var(--felt) 0%,var(--felt-d) 100%);color:var(--felt-fg);border-radius:14px;padding:var(--pad);border:1px solid rgba(0,0,0,.3);position:relative}
.felt .stat,.felt .muted{color:var(--felt-mut)}
.felt .btn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2);color:var(--felt-fg)}
.felt .btn.primary{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.felt .btn:hover:not(:disabled){border-color:var(--accent)}
.note{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-top:12px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.note b{font-family:var(--display);font-size:18px}
.felt .note{background:rgba(0,0,0,.28);border-color:rgba(255,255,255,.14);color:var(--felt-fg)}
.help{color:var(--muted);font-size:13px;margin:12px 0 0;max-width:70ch}
.help summary{cursor:pointer;color:var(--fg);font-weight:600}
.help p{margin:6px 0}

/* cards */
.card{--w:var(--cw,56px);width:var(--w);height:calc(var(--w)*1.4);background:var(--card);color:var(--card-ink);border-radius:calc(var(--w)*.1);box-shadow:0 1px 2px rgba(0,0,0,.4);position:relative;flex:none;user-select:none;-webkit-user-select:none}
.card.red{color:var(--card-red)}
.card .ci{position:absolute;top:calc(var(--w)*.06);left:calc(var(--w)*.09);display:flex;flex-direction:column;align-items:center;line-height:1;font-size:calc(var(--w)*.3)}
.card .ci b{font-family:var(--display);font-weight:700;letter-spacing:-.04em}
.card .ci i{font-style:normal;font-size:.82em}
.card .cm{position:absolute;right:calc(var(--w)*.1);bottom:calc(var(--w)*.05);font-size:calc(var(--w)*.5);line-height:1}
.card.back{background:repeating-linear-gradient(45deg,var(--card-back) 0 4px,var(--card-back2) 4px 8px);border:calc(var(--w)*.07) solid var(--card)}
.card.sel{outline:3px solid var(--accent);outline-offset:1px;z-index:5}
.card.dim{opacity:.4}
.card.clk{cursor:pointer}

/* solitaire */
.sol{--gap:clamp(4px,1.2vw,10px);--cw:clamp(38px,calc((min(100vw - 40px,920px) - 2*var(--pad,18px) - 6*var(--gap))/7),92px)}
.sol .felt{--pad:clamp(8px,2vw,18px)}
.sol .row{display:grid;grid-template-columns:repeat(7,var(--cw));gap:var(--gap);justify-content:center}
.sol .row+.row{margin-top:calc(var(--cw)*.3)}
.slot{width:var(--cw);height:calc(var(--cw)*1.4);border-radius:calc(var(--cw)*.1);outline:2px dashed rgba(255,255,255,.22);outline-offset:-2px;position:relative;display:grid;place-items:center;color:rgba(255,255,255,.28);font-size:calc(var(--cw)*.5);cursor:pointer}
.slot .card{position:absolute;left:0;top:0}
.col{position:relative;width:var(--cw)}
.col .card{position:absolute;left:0}
.col.empty{outline:2px dashed rgba(255,255,255,.22);outline-offset:-2px;border-radius:calc(var(--cw)*.1)}

/* sudoku */
.sdk{display:flex;flex-direction:column;align-items:center;gap:14px}
.sdk .bar{width:min(100%,480px)}
.grid9{display:grid;grid-template-columns:repeat(9,1fr);width:min(100%,480px);aspect-ratio:1;border:2px solid var(--fg);background:var(--panel)}
.cell{position:relative;border:1px solid var(--line);display:grid;place-items:center;font-family:var(--display);font-size:clamp(18px,5.4vw,28px);cursor:pointer;background:transparent;color:var(--ink-user);padding:0;font-weight:500;min-width:0}
.cell:nth-child(3n){border-right:2px solid var(--fg)}
.cell:nth-child(n+19):nth-child(-n+27),.cell:nth-child(n+46):nth-child(-n+54){border-bottom:2px solid var(--fg)}
.cell:nth-child(9n){border-right-width:1px}
.cell.given{color:var(--fg);font-weight:800}
.cell.peer{background:var(--peer)}
.cell.same{background:var(--same)}
.cell.sel{background:var(--selbg);z-index:1;outline:2px solid var(--accent);outline-offset:-2px}
.cell.err{color:var(--bad)}
.notes{display:grid;grid-template-columns:repeat(3,1fr);width:100%;height:100%;font-family:var(--mono);font-size:clamp(7px,2vw,11px);color:var(--muted);line-height:1;font-weight:400}
.notes span{display:grid;place-items:center}
.pad{display:grid;grid-template-columns:repeat(9,1fr);gap:5px;width:min(100%,480px)}
.pad .btn{padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:0;line-height:1.1;font-family:var(--display);font-size:20px;min-height:48px}
.pad .btn small{font-family:var(--mono);font-size:10px;color:var(--muted);font-weight:400}
.sdk .bar.tools .btn{flex:1;padding-inline:8px}
.busy{display:grid;place-items:center;width:min(100%,480px);aspect-ratio:1;color:var(--muted)}

/* domino */
.dmn{--gap:6px}
.seats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.seat{background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:8px 10px;min-width:0}
.seat.turn{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.seat .nm{font-weight:700;display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap}
.seat .nm span{font-family:var(--mono);font-weight:400;font-size:12px;color:var(--felt-mut)}
.seat .bk{display:flex;gap:2px;flex-wrap:wrap;margin-top:6px}
.seat .bk i{width:9px;height:18px;border-radius:2px;background:var(--card);opacity:.9}
.chain{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;align-content:flex-start;min-height:90px;padding:10px 6px;background:rgba(0,0,0,.18);border-radius:10px;--ds:clamp(20px,5.2vw,32px)}
.chain .empty{color:var(--felt-mut);align-self:center}
.dom{--ds:clamp(24px,6.4vw,38px);display:inline-flex;background:var(--card);border-radius:calc(var(--ds)*.22);box-shadow:0 1px 2px rgba(0,0,0,.45);flex:none;border:0;padding:0;position:relative}
.dom.h{flex-direction:row}.dom.v{flex-direction:column}
.dom .half{width:var(--ds);height:var(--ds);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:calc(var(--ds)*.13)}
.dom.h .half+.half{border-left:2px solid rgba(0,0,0,.3)}
.dom.v .half+.half{border-top:2px solid rgba(0,0,0,.3)}
.dom .half i{width:78%;height:78%;border-radius:50%;background:var(--card-ink);place-self:center}
.dom .half u{display:block}
.dom.endL,.dom.endR{outline:2px solid var(--accent);outline-offset:1px}
.dom.pl{cursor:pointer;outline:2px solid var(--accent);outline-offset:2px;transform:translateY(-6px)}
.dom.pl.pick{background:#fff3c9}
.dom.dull{opacity:.55}
.hand{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px;padding-top:6px;min-height:70px}
.hand .dom{--ds:clamp(26px,7.4vw,42px)}
.endinfo{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;color:var(--felt-mut);margin:8px 2px 0}
.say{min-height:24px;text-align:center;margin-top:10px;color:var(--felt-fg);font-weight:500}
.sides{display:flex;gap:8px;justify-content:center;margin-top:10px}

/* capsa */
.cps{--gap:6px;--cw:clamp(40px,calc((min(100vw - 40px,920px) - 2*var(--pad,20px) - 6*var(--gap))/6),68px)}
.rowline{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.rowline .lab{width:78px;flex:none;font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--felt-mut)}
.rowline .lab b{display:block;font-family:var(--display);font-size:14px;letter-spacing:0;text-transform:none;color:var(--felt-fg);min-height:18px}
.slots{display:flex;gap:var(--gap)}
.slot2{width:var(--cw);height:calc(var(--cw)*1.4);border-radius:calc(var(--cw)*.1);outline:2px dashed rgba(255,255,255,.28);outline-offset:-2px;cursor:pointer;position:relative}
.slot2 .card{position:absolute;inset:0}
.pool{display:flex;flex-wrap:wrap;gap:var(--gap);justify-content:center;margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.14);min-height:calc(var(--cw)*1.4 + 14px)}
.foulmsg{color:#ffb3b3;font-weight:600;margin:4px 0 0}
.mini{--cw:clamp(22px,5.6vw,34px)}
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:10px;margin-top:6px}
.pl-res{background:rgba(0,0,0,.24);border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:10px}
.pl-res.me{border-color:var(--accent)}
.pl-res h4{margin:0 0 6px;display:flex;justify-content:space-between;font-family:var(--display);font-size:16px}
.pl-res .pts.pos{color:#8ff0bb}.pl-res .pts.neg{color:#ffb0b0}
.pl-res .mr{display:flex;align-items:center;gap:3px;margin-bottom:5px}
.pl-res .mr .card{box-shadow:0 1px 1px rgba(0,0,0,.4)}
.pl-res .hn{font-size:11px;color:var(--felt-mut);margin:-2px 0 6px;font-family:var(--mono)}
.vs{font-size:13px;color:var(--felt-mut);margin-top:8px}

/* blackjack */
.bj{--cw:clamp(52px,14vw,76px)}
.bj .zone{min-height:calc(var(--cw)*1.4 + 40px);margin-bottom:12px}
.bj .zl{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--felt-mut);margin-bottom:6px;display:flex;gap:10px;align-items:center}
.cards{display:flex;min-height:calc(var(--cw)*1.4)}
.cards .card+.card{margin-left:calc(var(--cw)*-.5)}
.hands{display:flex;gap:18px;flex-wrap:wrap}
.hbox{padding:8px 10px 10px;border-radius:10px;border:2px solid transparent}
.hbox.act{border-color:var(--accent);background:rgba(0,0,0,.18)}
.badge{display:inline-block;font-family:var(--mono);font-size:12px;padding:2px 8px;border-radius:99px;background:rgba(255,255,255,.14);color:var(--felt-fg)}
.badge.win{background:#1f8f58;color:#fff}.badge.lose{background:#a63b3b;color:#fff}.badge.push{background:#6d7a74;color:#fff}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.chips{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ch{width:56px;height:56px;border-radius:50%;border:3px dashed rgba(255,255,255,.75);font-family:var(--display);font-weight:800;font-size:16px;color:#fff;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.4);outline:0}
.ch:disabled{opacity:.35;cursor:not-allowed}
.ch.c5{background:#b23b3b}.ch.c25{background:#2e7d4f}.ch.c100{background:#26262b}.ch.c500{background:#7a3fa6}
.money{display:flex;gap:18px;flex-wrap:wrap;font-family:var(--mono);font-size:14px}
.money b{font-family:var(--display);font-size:22px;color:var(--felt-fg);margin-left:4px;font-variant-numeric:tabular-nums}

/* holdem */
.hld{--cw:clamp(34px,8.6vw,56px)}
.hld .seats{margin-bottom:10px}
.hs{background:rgba(0,0,0,.24);border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:8px;min-width:0;display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center}
.hs.turn{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.hs.fold{opacity:.5}
.hs .nm{font-weight:700;font-size:14px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center}
.hs .st{font-family:var(--mono);font-size:12px;color:var(--felt-mut);font-variant-numeric:tabular-nums}
.hs .cards{min-height:0;gap:3px;--cw:clamp(28px,7vw,44px)}
.hs .cards .card+.card{margin-left:0}
.hs .bt{font-family:var(--mono);font-size:12px;color:var(--accent);min-height:16px}
.tag2{font-family:var(--mono);font-size:10px;padding:1px 6px;border-radius:99px;background:rgba(255,255,255,.16)}
.tag2.d{background:var(--accent);color:var(--accent-fg)}
.board{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 6px;background:rgba(0,0,0,.16);border-radius:10px}
.board .cards{gap:6px}
.board .cards .card+.card{margin-left:0}
.board .ph{border-radius:calc(var(--cw)*.1);outline:2px dashed rgba(255,255,255,.2);outline-offset:-2px;width:var(--cw);height:calc(var(--cw)*1.4)}
.pot{font-family:var(--mono);font-size:14px}
.pot b{font-family:var(--display);font-size:22px;margin-left:4px}
.me{margin-top:10px}
.me .hs{max-width:340px;margin:0 auto}
.me .hs .cards{--cw:clamp(40px,10vw,60px)}
.betbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin-top:10px}
.betbar input[type=range]{flex:1 1 140px;min-width:120px;accent-color:var(--accent)}
.logbox{font-family:var(--mono);font-size:12px;color:var(--felt-mut);margin-top:10px;min-height:54px;display:flex;flex-direction:column;gap:2px}
.logbox div:last-child{color:var(--felt-fg)}

/* deep dive */
.dv{--pixel:"Press Start 2P",ui-monospace,monospace;font-family:var(--pixel)}
.sea{position:relative;border:3px solid #02060f;border-radius:6px;overflow:hidden;background:#06121f;box-shadow:0 0 0 3px #0e2a4a}
.sea canvas{display:block;width:100%;height:auto;aspect-ratio:16/10;image-rendering:pixelated}
.hud{position:absolute;inset:0 0 auto 0;display:grid;grid-template-columns:1fr auto 1fr;gap:8px;padding:8px 12px;font-size:clamp(8px,2.4vw,12px);color:#e8f6ff;text-shadow:2px 2px 0 #02060f;pointer-events:none;background:linear-gradient(rgba(2,6,15,.45),rgba(2,6,15,0))}
.hud .hz{color:#ffcc33;text-transform:uppercase;text-align:center}.hud span:last-child{text-align:right}
.zbanner,.pop{position:absolute;left:50%;transform:translateX(-50%);font-size:clamp(9px,3vw,13px);text-align:center;white-space:nowrap;padding:8px 12px;border:3px solid #02060f;pointer-events:none}
.zbanner{top:14%;background:#ffcc33;color:#1b1200;animation:zb 2.4s steps(12) forwards}
.pop{top:74%;color:#02060f;animation:pp 1.8s steps(14) forwards}
@keyframes zb{0%{opacity:0;transform:translate(-50%,10px)}12%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-8px)}}
@keyframes pp{0%{opacity:0;transform:translate(-50%,16px)}15%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-28px)}}
.hint{min-height:18px;color:#ffcc33}.hint .bad{color:#ff9a8a}
.dvp input.shake{animation:shk .35s steps(6)}
@keyframes shk{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.cl{font-size:clamp(8px,2.2vw,10px);color:#8fb6d8;text-transform:uppercase;letter-spacing:.08em;margin-bottom:-6px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{font-family:var(--pixel);font-size:clamp(8px,2.3vw,10px);line-height:1.4;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;min-width:70px;padding:8px;background:#102740;color:#e8f6ff;border:3px solid #02060f;border-radius:0;cursor:pointer}
.opt.on{border-color:#ffcc33;background:#16324f}
.opt:focus-visible{outline:3px solid #fff;outline-offset:2px}
.opt .sw{display:block;width:36px;height:30px;border:2px solid #02060f}
.dvp{margin-top:12px;background:#0a1a2e;color:#e8f6ff;border:3px solid #02060f;box-shadow:0 0 0 3px #0e2a4a;padding:16px;border-radius:6px;display:flex;flex-direction:column;gap:14px;font-size:clamp(9px,2.6vw,11px);line-height:1.8}
.dvq{font-size:clamp(11px,3.4vw,15px);line-height:1.6}
.dvp input[type=text]{font-family:var(--mono);font-size:18px;padding:10px 12px;border:3px solid #5fb8ff;background:#02060f;color:#e8f6ff;border-radius:0;width:100%}
.dvp input[type=text]:focus{outline:3px solid #ffcc33;outline-offset:0}
.dbtn{font-family:var(--pixel);font-size:11px;padding:12px 14px;border:3px solid #02060f;background:#ffcc33;color:#1b1200;cursor:pointer;box-shadow:3px 3px 0 #02060f;border-radius:0}
.dbtn.alt{background:#5fb8ff}.dbtn.ghost{background:#16324f;color:#e8f6ff}
.dbtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #02060f}
.dbtn:focus-visible{outline:3px solid #fff;outline-offset:2px}
.timer{height:12px;background:#02060f;border:2px solid #02060f}.timer i{display:block;height:100%;width:100%;background:#ffcc33}
.tier{display:inline-block;padding:3px 8px;color:#02060f}
.t0{background:#8fe3ff}.t1{background:#5fb8ff}.t2{background:#a78bfa}.t3{background:#ff8ad8}.t4{background:#ffcc33}
.dvp .rows{display:flex;flex-direction:column;gap:8px}
.dvp .rows>div{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:2px dashed #16324f;padding-bottom:8px}
.dv .row-actions{display:flex;gap:10px;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---- Dead Shell ---- */
.ds{--pixel:"Press Start 2P",ui-monospace,monospace;font-family:var(--pixel);color:#e9e4d6}
.dsw{position:relative;background:#0c0e12;border:3px solid #02060f;box-shadow:0 0 0 3px #3a2a1a;padding:10px;border-radius:6px;display:flex;flex-direction:column;gap:10px}
.dst{font-size:clamp(14px,5vw,22px);color:#ffd23f;text-shadow:3px 3px 0 #02060f;margin:4px 0}
.dsp{font-family:var(--body);font-size:14px;line-height:1.55;color:#c9c4b4;margin:0}
.dsmode{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dsbig{font-family:var(--pixel);display:flex;flex-direction:column;gap:10px;text-align:left;padding:14px;border:3px solid #02060f;background:#2a1e14;color:#e9e4d6;box-shadow:3px 3px 0 #02060f;cursor:pointer;border-radius:0}
.dsbig b{font-size:clamp(11px,3.4vw,15px);color:#ffd23f;font-weight:400}
.dsbig span{font-family:var(--body);font-size:13px;line-height:1.4;color:#b9b29c}
.dsbig:hover{background:#3a2a1a}.dsbig:focus-visible{outline:3px solid #fff;outline-offset:2px}
.dsstat{font-size:9px;line-height:1.9;color:#9aa3b2}
.dsrules{font-family:var(--body);font-size:13.5px;color:#c9c4b4;border-top:2px solid #22252d;padding-top:8px}
.dsrules summary{font-family:var(--pixel);font-size:9px;color:#ffd23f;cursor:pointer;padding:4px 0}
.dsrules ul{padding-left:18px;margin:8px 0;display:flex;flex-direction:column;gap:6px;line-height:1.5}
.dsil{display:flex;flex-direction:column;gap:5px;line-height:1.45}.dsil b{color:#ffd23f;font-weight:600}
.dsbar{display:flex;justify-content:space-between;gap:6px;font-size:clamp(9px,2.6vw,11px);color:#9aa3b2;text-transform:uppercase}
.dssc{position:relative;border:3px solid #02060f;background:#050507;line-height:0}
.dscv{display:block;width:100%;height:auto;aspect-ratio:16/9;image-rendering:pixelated}
.dslabs{position:absolute;inset:0;pointer-events:none;line-height:1.2}
.dslabs button,.dslabs .slot{pointer-events:auto}
.selfv .dslabs{visibility:hidden}
.dslab{position:absolute;top:1.5%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 7px;background:rgba(5,5,8,.72);border:2px solid #02060f;font-size:9px;text-align:center;white-space:nowrap}
.dslab b{font-weight:400;color:#fff;font-size:10px}
.dslab em,.dsmine em{font-style:normal;color:#ff9a8a;font-size:9px}
.dslab.act{border-color:#ffd23f;box-shadow:0 0 8px #ffd23f66}
.dslab.dead{opacity:.55}
.dslab.hit{animation:dshit .5s steps(6)}
@keyframes dshit{0%,40%{background:rgba(122,29,22,.9)}100%{background:rgba(5,5,8,.72)}}
.dshp{display:flex;gap:2px;justify-content:center;min-height:12px}
.dsoi{position:absolute;transform:translateX(-50%);display:grid;grid-template-columns:repeat(4,auto);gap:2px;padding:2px;background:rgba(5,5,8,.35)}
.dsoi span{display:block;line-height:0}.dsoi{max-height:64px;overflow-y:auto;scrollbar-width:none}
.dsfig{position:absolute;border:0;background:transparent;padding:0;cursor:pointer;border-radius:0}
.dsfig:disabled{cursor:default}
.dsfig.on{outline:1px dashed rgba(255,106,90,.55);outline-offset:-2px}
.dsfig.on:hover,.dsfig.on:focus-visible{outline:2px dashed #ff6a5a;background:rgba(214,64,47,.12)}
.dsmy{position:absolute;left:0;right:0;bottom:1.5%;display:flex;justify-content:center;gap:3px;padding:0 4px}
.dsmy .slot{flex:1 1 0;max-width:44px;aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:rgba(8,6,4,.78);border:2px solid #3a2a1a;padding:3px;border-radius:0;line-height:0}
.dsmy .slot.empty{background:rgba(8,6,4,.25);border:2px dashed #2a1e14}
.dsmy .slot.has{cursor:pointer}
.dsmy .slot.has:hover:not(:disabled),.dsmy .slot.on{border-color:#ffd23f;background:rgba(58,42,26,.92)}
.dsmy .slot:disabled{opacity:.7;cursor:default}
.dsmy .slot:focus-visible{outline:3px solid #fff}
.dsmy canvas{width:100%!important;height:auto!important}
.dsmy2{--g:4px;position:relative;display:grid;grid-auto-flow:column;grid-template-columns:none;grid-auto-columns:calc((100% - 7*var(--g))/8);gap:var(--g);padding:2px 0 6px;overflow-x:auto;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;scrollbar-width:thin}.dsmy2 .slot{max-width:none;min-width:0}
.dsmine{display:flex;align-items:center;gap:10px;font-size:9px;flex-wrap:wrap}
.dsmine b{font-weight:400;color:#fff}
.dsmsg{min-height:64px;font-family:var(--body);font-size:14.5px;line-height:1.5;color:#e9e4d6}
.dsk{margin-top:6px;color:#9fd0ff}.dsk .lv{color:#ff7a6a}.dsk .bl{color:#6ea8ff}
.dsgo{font-family:var(--body);font-size:14px;color:#ffd23f;margin-bottom:8px}
.dsdesc{font-family:var(--body);font-size:14px;line-height:1.5;color:#e9e4d6;margin-bottom:8px}.dsdesc b{color:#ffd23f;font-weight:600}
.dswait{font-size:9px;color:#9aa3b2;line-height:1.6}
.dsrow{display:flex;flex-wrap:wrap;gap:8px}
.dslog{font-family:var(--mono);font-size:11.5px;line-height:1.5;color:#7e8696;border-top:2px solid #22252d;padding-top:8px;min-height:80px}
.dsfoot{display:flex;gap:8px}
.dbtn.red{background:#d6402f;color:#fff}
.dbtn.out{background:transparent;color:#ff9a8a;border-color:#d6402f}
.dsend{background:#151922;border:3px solid #ffd23f;padding:14px;display:flex;flex-direction:column;gap:10px}
.dsend .dsmode{grid-template-columns:auto auto;justify-content:start}
/* Buckshot: monospasi kecil, mengikuti mockup (bukan font pixel lebar) */
.ds,.ds .dbtn,.ds .dsbig,.ds .dsbig span,.ds .dsrules,.ds .dsrules summary,.ds .dsp,.ds .dsmsg,.ds .dsgo,.ds .dsdesc{font-family:var(--mono)}
.ds .dst{font-size:clamp(15px,4.6vw,20px);font-weight:500;text-shadow:2px 2px 0 #02060f}
.ds .dsbar{font-size:clamp(10px,2.7vw,11.5px);letter-spacing:.04em;white-space:nowrap}
.ds .dslab{font-size:9.5px;letter-spacing:.02em}
.ds .dslab b{font-size:10.5px}
.ds .dslab em,.ds .dsmine em{font-size:9.5px}
.ds .dsmine{font-size:11.5px;letter-spacing:.02em}
.ds .dsmsg{font-size:12.5px;line-height:1.55}
.ds .dsgo,.ds .dsdesc{font-size:12px}
.ds .dsp{font-size:12px}
.ds .dsstat,.ds .dswait{font-size:11px;line-height:1.6}
.ds .dslog{font-size:11px}
.ds .dsrules{font-size:11.5px}
.ds .dsrules summary{font-size:11px;font-weight:500}
.ds .dbtn{font-size:11px;font-weight:500;padding:9px 12px;letter-spacing:.02em}
.ds .dsbig b{font-size:clamp(13px,3.6vw,15px);font-weight:500}
.ds .dsbig span{font-size:11.5px}
.chs .chmenu{display:grid;gap:10px;max-width:520px}
.chs .chbig{text-align:left;font:inherit;display:flex;flex-direction:column;gap:4px;padding:14px;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:8px;cursor:pointer}
.chs .chbig:hover{border-color:var(--accent)}
.chs .chbig b{font-size:16px}.chs .chbig span{color:var(--muted);font-size:13.5px}
.chs .chb{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));width:min(100%,480px);aspect-ratio:1;margin:8px auto;border:3px solid var(--ch-edge,var(--line));border-radius:6px;overflow:hidden;container-type:inline-size;touch-action:manipulation;user-select:none}
.chs .chsq{position:relative;border:0;padding:0;margin:0;display:flex;align-items:center;justify-content:center;font-size:9vw;font-size:9cqw;line-height:1;cursor:pointer;color:inherit;border-radius:0}
.chs .chsq.lt{background:var(--ch-lt,#ecd9b0)}.chs .chsq.dk{background:var(--ch-dk,#b58863)}
.chs .chsq.last{box-shadow:inset 0 0 0 100px rgba(255,220,70,.42)}
.chs .chsq.sel{box-shadow:inset 0 0 0 100px rgba(255,220,70,.6)}
.chs .chsq.chk{background:radial-gradient(circle,#ff4a3a 0,#d63a2c 45%,transparent 75%),var(--ch-dk,#b58863)}
.chs .chsq.mv::after{content:"";position:absolute;width:30%;height:30%;border-radius:50%;background:var(--ch-dot,rgba(20,20,20,.35))}
.chs .chsq.cap::after{content:"";position:absolute;inset:4%;border-radius:50%;border:.7cqw solid var(--ch-dot,rgba(20,20,20,.4))}
.chs .pc{pointer-events:none;position:relative;z-index:1}
.chs .pc.w{color:var(--ch-pw,#fff);text-shadow:var(--ch-pws,0 0 1px #000,0 0 2px #000,0 1px 2px rgba(0,0,0,.8))}
.chs .pc.b{color:var(--ch-pb,#17171a);text-shadow:var(--ch-pbs,0 0 1px rgba(255,255,255,.5))}
.chs .chsq .rk,.chs .chsq .fl{position:absolute;font-style:normal;font-size:2.3cqw;font-size:max(9px,2.3cqw);font-weight:700;pointer-events:none;opacity:.7;color:var(--ch-lab,#5a4630)}
.chs .chsq .rk{top:3%;left:4%}.chs .chsq .fl{bottom:2%;right:5%}
.chs .chlab{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;max-width:480px;margin:0 auto}
.chs .chlab .dot{width:9px;height:9px;border-radius:50%;background:var(--line)}
.chs .chlab.act .dot{background:var(--accent);box-shadow:0 0 0 3px rgba(224,173,76,.3)}
.chs .chlab .chm{color:var(--muted);font-weight:500}
.chs .chst{max-width:520px;margin:6px auto;text-align:center;font-weight:600}
.chs .chmenu .chst{text-align:left;margin:0;font-weight:500;color:var(--muted)}
.chs .chmv{max-width:480px;margin:6px auto;font-family:var(--mono);font-size:12.5px;color:var(--muted);max-height:4.7em;overflow:auto;line-height:1.55}
.chs .chact{max-width:480px;margin:8px auto;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
.chs .chpb{padding:2px 14px;font-size:32px;line-height:1.1;background:var(--ch-dk,#b58863)}
.chs .chcodebig{font-family:var(--mono);font-size:clamp(26px,9vw,38px);font-weight:700;letter-spacing:.12em;text-align:center;padding:18px 8px;border:2px dashed var(--accent);border-radius:10px;background:var(--panel);user-select:all}
.chs .chin{font-family:var(--mono);font-size:24px;letter-spacing:.12em;text-align:center;text-transform:uppercase;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--fg);width:100%}
.ds .dslogd{border-top:2px solid #22252d;padding-top:8px}
.ds .dslogd summary{font-size:11px;color:#9aa3b2;cursor:pointer;padding:4px 0}
.ds .dslogd .dslog{border-top:0;padding-top:4px;min-height:0}
.ds .dsfoot{margin-top:2px}
.ds .dslab.solo{left:3%!important;transform:none;align-items:flex-start;top:3%}
@media (max-width:560px){
  .dsw{padding:8px;gap:16px;border-width:2px;box-shadow:0 0 0 2px #3a2a1a}
  .ds .dsbar{font-size:10px}
  .ds .dsmsg{min-height:72px;font-size:13px;line-height:1.65}

}
.ds .dscl{font-size:11px;color:#c9a96a;margin:10px 0 4px;letter-spacing:.04em}
.ds .dsopts{display:flex;flex-wrap:wrap;gap:6px}
.ds .dsopt{background:#14161b;border:2px solid #2a2d36;border-radius:5px;color:#c9ced8;font:inherit;font-size:10.5px;padding:5px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;min-width:74px}

/* tambahan: skin catur + lobi online Buckshot */
.chs .chskin{max-width:480px;margin:8px auto;border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--panel)}
.chs .chskin summary{cursor:pointer;font-weight:600;font-size:14px}
.chs .chskl{margin:10px 0 4px;font-size:12px;color:var(--muted);font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em}
.chs .chsko{display:flex;flex-wrap:wrap;gap:6px}
.chs .chskb{display:flex;align-items:center;gap:6px;font:inherit;font-size:13px;padding:5px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);cursor:pointer}
.chs .chskb.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.chs .chsw{display:inline-block;width:20px;height:20px;border-radius:4px;border:1px solid rgba(0,0,0,.35)}
.chs .chpq{font-weight:600}
.dsin{font-family:var(--body);font-size:16px;padding:10px 12px;border:3px solid #02060f;background:#16120d;color:#e9e4d6;border-radius:0;width:100%}
.dsin.code{font-family:var(--mono);font-size:24px;letter-spacing:.12em;text-align:center;text-transform:uppercase}
.dsseat{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border:3px solid #02060f;background:#1a1510;color:#e9e4d6;font-size:14px}
.dsseat.empty{color:#7a7566;border-style:dashed}
.dsseat b{color:#ffd23f}
.dscode{font-family:var(--mono);font-size:clamp(24px,8vw,36px);font-weight:700;letter-spacing:.12em;text-align:center;padding:16px 8px;border:2px dashed #ffd23f;background:#16120d;color:#ffd23f;user-select:all}
.dsst{font-family:var(--body);font-size:13.5px;color:#a9a493;margin:0}
.dsrow2{display:flex;gap:8px;flex-wrap:wrap}
.langbtn{margin-left:auto;background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:4px 10px;font:inherit;font-size:13px;cursor:pointer}.langbtn b{color:inherit;font-weight:700;text-decoration:underline}
.chs .chsvg{width:1.02em;height:1.02em;display:block;overflow:visible}
.chs .pc.w .chsvg{filter:drop-shadow(0 0 .5px #000) drop-shadow(0 0 .5px #000) drop-shadow(0 1px 1px rgba(0,0,0,.45))}
.chs .pc.b .chsvg{filter:drop-shadow(0 0 .6px rgba(255,255,255,.75)) drop-shadow(0 0 .6px rgba(255,255,255,.55))}

.chs .chsvg.orn{width:1.1em;height:1.1em}
.chs .chsvg.orn .dt{fill:none;stroke-width:.8;stroke-linecap:round;stroke-linejoin:round}
.chs .pc.w .chsvg.orn .dt{stroke:#000;stroke-opacity:.6}
.chs .pc.b .chsvg.orn .dt{stroke:#fff;stroke-opacity:.5}
.chs .chsvg.orn .gd{fill:#e6bb4a;stroke:#e6bb4a;stroke-linecap:round}
.chs .chsvg.orn.mono .gd{fill:currentColor;stroke:currentColor}
.chs .chsvg.orn.ln .dt{stroke:currentColor;stroke-opacity:.75}
.chs .chsvg.orn.ln .gd{fill:currentColor;fill-opacity:.35;stroke:currentColor}
.chs .chsw.mdl .chsvg.orn{width:24px;height:24px}
.chs .pc .chsvg.ln{filter:drop-shadow(0 0 3px currentColor)}
.chs .pc.w .chsvg.neon,.chs .pc.b .chsvg.neon{filter:drop-shadow(0 0 2px currentColor) drop-shadow(0 0 6px currentColor)}
.chs .chsw.mdl{background:var(--bg);display:inline-flex;align-items:center;justify-content:center;color:var(--fg);width:24px;height:24px}
.chs .chsw.mdl svg{width:20px;height:20px}
.chs .chpb .chsvg{width:1em;height:1em}

const rl=r=>({11:'J',12:'Q',13:'K',14:'A'}[r]||String(r));
const rnd=n=>Math.floor(Math.random()*n);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function newDeck(){const d=[];for(let s=0;s<4;s++)for(let r=2;r<=14;r++)d.push({r,s});return d}

   Semua bot di semua meja memakai 4 nama tetap ini: Rooney, Yakub, Steven, Jordan.
   Jangan membuat nama bot sendiri (Bagas, Bot 1, Player 2, dst).
   Cara pakai: const bn=botNames(3);  // n nama acak tanpa duplikat, n maksimal 4
   Panggil SEKALI saat game dibuka atau dimulai, simpan hasilnya, lalu pakai bn[i] untuk bot ke-i.
   Jangan panggil botNames() di dalam fungsi render atau per giliran, nanti namanya berubah terus.
   Buckshot 1v1 sengaja selalu Rooney karena wajah Dealer-nya mengikuti art asli Buckshot Roulette. */
const BOT_POOL=['Rooney','Yakub','Steven','Jordan'];
function botNames(n){return shuffle(BOT_POOL.slice()).slice(0,Math.max(0,Math.min(n,BOT_POOL.length)))}

const HAND_NAMES=['High Card','Pair','Two Pair','Three of a Kind','Straight','Flush','Full House','Four of a Kind','Straight Flush'];
function evalHand(cs){
  const n=cs.length,cnt=new Array(15).fill(0),rs=[];
  for(let i=0;i<n;i++){cnt[cs[i].r]++;rs.push(cs[i].r)}
  rs.sort((a,b)=>b-a);
  const groups=[];
  for(let r=14;r>=2;r--)if(cnt[r])groups.push([r,cnt[r]]);
  groups.sort((a,b)=>b[1]-a[1]);
  let flush=n===5;
  if(flush)for(let i=1;i<5;i++)if(cs[i].s!==cs[0].s){flush=false;break}
  let sh=0;
  if(n===5&&groups.length===5){
    if(rs[0]-rs[4]===4)sh=rs[0];
    else if(rs[0]===14&&rs[1]===5&&rs[4]===2)sh=5;
  }
  const kick=groups.map(g=>g[0]);
  if(sh&&flush)return[8,sh];
  if(groups[0][1]===4)return[7,...kick];
  if(groups[0][1]===3&&groups[1]&&groups[1][1]===2)return[6,...kick];
  if(flush)return[5,...rs];
  if(sh)return[4,sh];
  if(groups[0][1]===3)return[3,...kick];
  if(groups[0][1]===2&&groups[1]&&groups[1][1]===2)return[2,...kick];
  if(groups[0][1]===2)return[1,...kick];
  return[0,...rs];
}

/* ---------- SUDOKU ---------- */
function solveGrid(g0,limit,randomize){
  const g=g0.slice(),rows=new Array(9).fill(0),cols=new Array(9).fill(0),boxes=new Array(9).fill(0);
  for(let i=0;i<81;i++)if(g[i]){const b=1<<g[i],r=(i/9)|0,c=i%9;rows[r]|=b;cols[c]|=b;boxes[((r/3)|0)*3+((c/3)|0)]|=b}
  let count=0,first=null;
  const pc=x=>{let n=0;while(x){x&=x-1;n++}return n};
  function rec(){
    let best=-1,bm=0,bn=10;
    for(let i=0;i<81;i++){
      if(g[i])continue;
      const r=(i/9)|0,c=i%9,b=((r/3)|0)*3+((c/3)|0);
      const m=~(rows[r]|cols[c]|boxes[b])&0x3FE,n=pc(m);
      if(n<bn){bn=n;best=i;bm=m;if(n<=1)break}
    }
    if(best<0){count++;if(!first)first=g.slice();return count>=limit}
    if(bn===0)return false;
    const vals=[];for(let v=1;v<=9;v++)if(bm&(1<<v))vals.push(v);
    if(randomize)shuffle(vals);
    const r=(best/9)|0,c=best%9,b=((r/3)|0)*3+((c/3)|0);
    for(const v of vals){
      const bit=1<<v;g[best]=v;rows[r]|=bit;cols[c]|=bit;boxes[b]|=bit;
      if(rec())return true;
      g[best]=0;rows[r]&=~bit;cols[c]&=~bit;boxes[b]&=~bit;
    }
    return false;
  }
  rec();
  return{count,sol:first};
}
function genSudoku(givens){
  const sol=solveGrid(new Array(81).fill(0),1,true).sol;
  const puz=sol.slice(),idx=shuffle([...Array(81).keys()]);
  let filled=81;
  for(const i of idx){
    if(filled<=givens)break;
    const v=puz[i];puz[i]=0;
    if(solveGrid(puz,2,false).count!==1)puz[i]=v;else filled--;
  }
  return{puz,sol};
}
function Sudoku(box){
  const T=timers();
  const root=el('div','sdk');box.appendChild(root);
  const GIV={Mudah:40,Sedang:34,Sulit:29,Ahli:25};
  let diff=store.get('sdk-diff','Sedang');if(!GIV[diff])diff='Sedang';
  let puz,sol,cur,notes,selI=-1,noteMode=false,hist=[],mist=0,secs=0,won=false,busy=false,hints=0,timeEl;
  const peers=i=>{const r=(i/9)|0,c=i%9,b=((r/3)|0)*3+((c/3)|0);return j=>{const r2=(j/9)|0,c2=j%9;return j!==i&&(r2===r||c2===c||((r2/3)|0)*3+((c2/3)|0)===b)}};
  function newGame(){Stats.arm('sudoku');
    busy=true;render();
    T.after(()=>{
      const g=genSudoku(GIV[diff]);
      puz=g.puz;sol=g.sol;cur=puz.slice();notes=new Array(81).fill(0);
      selI=-1;hist=[];mist=0;secs=0;won=false;hints=0;busy=false;render();
    },40);
  }
  const snap=()=>{hist.push([cur.slice(),notes.slice(),mist]);if(hist.length>200)hist.shift()};
  function undo(){if(!hist.length||won)return;[cur,notes,mist]=hist.pop();render()}
  function checkWin(){if(cur.every((v,i)=>v===sol[i])){won=true}}
  function place(v){
    if(busy||won||selI<0||puz[selI])return;
    snap();
    if(noteMode){
      if(cur[selI]){hist.pop();return}
      notes[selI]^=1<<v;
    }else if(cur[selI]===v){cur[selI]=0}
    else{
      cur[selI]=v;notes[selI]=0;
      if(v!==sol[selI])mist++;
      const pe=peers(selI);
      for(let j=0;j<81;j++)if(pe(j))notes[j]&=~(1<<v);
    }
    checkWin();render();
  }
  function erase(){
    if(busy||won||selI<0||puz[selI])return;
    snap();cur[selI]=0;notes[selI]=0;render();
  }
  function hint(){
    if(busy||won)return;
    let i=selI;
    if(i<0||puz[i]||cur[i]===sol[i]){
      const open=[];for(let j=0;j<81;j++)if(cur[j]!==sol[j])open.push(j);
      if(!open.length)return;i=open[rnd(open.length)];
    }
    snap();selI=i;cur[i]=sol[i];notes[i]=0;hints++;
    const pe=peers(i);for(let j=0;j<81;j++)if(pe(j))notes[j]&=~(1<<sol[i]);
    checkWin();render();
  }
  const onKey=e=>{
    if(e.ctrlKey||e.metaKey||e.altKey){if((e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault();undo()}return}
    if(/^[1-9]$/.test(e.key)){place(+e.key);return}
    if(e.key==='Backspace'||e.key==='Delete'||e.key==='0'){erase();return}
    if(e.key==='n'||e.key==='N'){noteMode=!noteMode;render();return}
    const mv={ArrowUp:-9,ArrowDown:9,ArrowLeft:-1,ArrowRight:1}[e.key];
    if(mv&&!busy){
      e.preventDefault();
      if(selI<0)selI=40;
      else{
        const r=(selI/9)|0,c=selI%9;
        if(e.key==='ArrowUp'&&r>0||e.key==='ArrowDown'&&r<8||e.key==='ArrowLeft'&&c>0||e.key==='ArrowRight'&&c<8)selI+=mv;
      }
      render();
    }
  };
  document.addEventListener('keydown',onKey);

  function render(){
    root.innerHTML='';
    const bar=el('div','bar');
    Object.keys(GIV).forEach(k=>{
      bar.append(btn(k,k===diff?'on':'',()=>{diff=k;store.set('sdk-diff',k);newGame()}));
    });
    root.append(bar);
    const info=el('div','bar');
    timeEl=el('span','stat');
    info.append(timeEl,el('span','sp'),el('span','stat','Salah: '+(busy?0:mist)+' · Petunjuk: '+hints));
    root.append(info);updTime();
    if(busy){root.append(el('div','busy','Menyusun teka-teki…'));return}
    const g=el('div','grid9');g.setAttribute('role','grid');
    const pe=selI>=0?peers(selI):null,sv=selI>=0?cur[selI]:0;
    for(let i=0;i<81;i++){
      const b=el('button','cell');b.type='button';
      const given=!!puz[i];
      if(given)b.classList.add('given');
      if(i===selI)b.classList.add('sel');
      else if(pe&&pe(i))b.classList.add('peer');
      if(sv&&cur[i]===sv&&i!==selI)b.classList.add('same');
      if(!given&&cur[i]&&cur[i]!==sol[i])b.classList.add('err');
      if(cur[i])b.textContent=cur[i];
      else if(notes[i]){
        const n=el('div','notes');
        for(let v=1;v<=9;v++)n.append(el('span','',notes[i]&(1<<v)?v:''));
        b.append(n);
      }
      b.setAttribute('aria-label','Baris '+((i/9|0)+1)+' kolom '+(i%9+1)+(cur[i]?', isi '+cur[i]:', kosong'));
      b.onclick=()=>{selI=i;render()};
      g.append(b);
    }
    root.append(g);
    const tools=el('div','bar tools');
    tools.append(
      btn('Catatan '+(noteMode?'aktif':'mati'),noteMode?'on':'',()=>{noteMode=!noteMode;render()}),
      btn('Hapus','',erase),btn('Undo','',undo),btn('Petunjuk','',hint),btn('Baru','primary',newGame)
    );
    root.append(tools);
    const pad=el('div','pad');
    for(let v=1;v<=9;v++){
      let n=0;for(let i=0;i<81;i++)if(cur[i]===v)n++;
      const b=btn(v+'<small>'+Math.max(0,9-n)+'</small>','',()=>place(v));
      b.disabled=n>=9;pad.append(b);
    }
    root.append(pad);
    if(won){
      Stats.rec('sudoku','w',{min:{t:secs}});
      const n=el('div','note','<div><b>Selesai!</b> <span class="stat">'+fmtTime(secs)+' · salah '+mist+'x · petunjuk '+hints+'</span></div>');
      n.append(btn('Teka-teki baru','primary',newGame));root.append(n);
    }
  }
  function updTime(){if(timeEl)timeEl.textContent=fmtTime(secs)+' · '+diff}
  T.every(()=>{if(!won&&!busy&&puz){secs++;updTime()}},1000);
  newGame();
  return{destroy(){T.clear();document.removeEventListener('keydown',onKey)}};
}

const PIPS=[[],[4],[0,8],[0,4,8],[0,2,6,8],[0,2,4,6,8],[0,2,3,5,6,8]];
function tileEl(a,b,cls){
  const d=el('div','dom '+cls);
  for(const n of[a,b]){
    const h=el('div','half');
    for(let k=0;k<9;k++)h.appendChild(el(PIPS[n].includes(k)?'i':'u'));
    d.appendChild(h);
  }
  return d;
}
function Domino(box){
  const T=timers();
  const root=el('div','dmn');box.appendChild(root);
  const NAMES=['Kamu',...botNames(3)];
  let scores=[0,0,0,0],hands,chain,turn,passes,over,pick,info,result,round=0,gen=0;
  const later=(fn,ms)=>{const g=gen;T.after(()=>{if(g===gen)fn()},ms)};
  const sum=h=>h.reduce((s,t)=>s+t[0]+t[1],0);

  function deal(){Stats.arm('domino');
    const all=[];for(let a=0;a<=6;a++)for(let b=a;b<=6;b++)all.push([a,b]);
    shuffle(all);
    hands=[0,1,2,3].map(i=>all.slice(i*7,i*7+7).sort((x,y)=>x[0]+x[1]-y[0]-y[1]));
    gen++;chain=[];passes=0;over=false;pick=null;result=null;round++;
    turn=hands.findIndex(h=>h.some(t=>t[0]===6&&t[1]===6));
    info=NAMES[turn]+' pegang 6-6 dan jalan duluan.';
    render();later(step,900);
  }
  function legal(p){
    const out=[],h=hands[p];
    if(!chain.length){h.forEach((t,i)=>{if(t[0]===6&&t[1]===6)out.push({t:i,side:'R'})});return out}
    const L=chain[0][0],R=chain[chain.length-1][1];
    h.forEach((t,i)=>{
      if(t[0]===L||t[1]===L)out.push({t:i,side:'L'});
      if(t[0]===R||t[1]===R)out.push({t:i,side:'R'});
    });
    return out;
  }
  function play(p,ti,side){
    const t=hands[p].splice(ti,1)[0];
    if(!chain.length)chain.push([6,6]);
    else if(side==='L'){const L=chain[0][0];chain.unshift(t[1]===L?[t[0],t[1]]:[t[1],t[0]])}
    else{const R=chain[chain.length-1][1];chain.push(t[0]===R?[t[0],t[1]]:[t[1],t[0]])}
    info=NAMES[p]+' main '+t[0]+'-'+t[1]+'.';
    passes=0;pick=null;
  }
  function botPick(p,mv){
    const h=hands[p];let best=mv[0],bs=-1e9;
    for(const m of mv){
      const t=h[m.t],rest=h.filter((_,i)=>i!==m.t);
      let end;
      if(!chain.length)end=6;
      else if(m.side==='L')end=t[0]===chain[0][0]?t[1]:t[0];
      else end=t[0]===chain[chain.length-1][1]?t[1]:t[0];
      let s=t[0]+t[1]+(t[0]===t[1]?3:0)+rest.filter(x=>x[0]===end||x[1]===end).length*2.5+Math.random();
      if(s>bs){bs=s;best=m}
    }
    return best;
  }
  function step(){
    if(over)return;
    const p=turn,mv=legal(p);
    if(!mv.length){
      passes++;info=NAMES[p]+(p===0?' tidak punya kartu yang cocok. Pass.':' pass.');
      if(passes>=4){finish(-1);return}
      turn=(p+1)%4;render();later(step,p===0?1100:800);return;
    }
    if(p===0){render();return}
    render();
    later(()=>{const m=botPick(p,mv);play(p,m.t,m.side);after(p)},850);
  }
  function after(p){
    if(!hands[p].length){finish(p);return}
    turn=(p+1)%4;render();later(step,380);
  }
  function finish(w){
    over=true;
    if(w<0){
      const s=hands.map(sum),mn=Math.min(...s),ws=s.map((x,i)=>x===mn?i:-1).filter(i=>i>=0);
      if(ws.length===1){w=ws[0];info='Semua buntu. '+NAMES[w]+' menang dengan sisa angka paling kecil ('+mn+').'}
      else{info='Semua buntu dan angka terkecil seri. Ronde ini seri.';w=-2}
    }else info=NAMES[w]+' menghabiskan semua kartunya.';
    if(w>=0)scores[w]++;
    Stats.rec('domino',w===0?'w':w===-2?'d':'l');
    result={w};render();
  }
  function clickTile(ti){
    if(over||turn!==0)return;
    const sides=legal(0).filter(m=>m.t===ti).map(m=>m.side);
    if(!sides.length)return;
    if(sides.length===1||(chain.length&&chain[0][0]===chain[chain.length-1][1])){play(0,ti,sides[sides.length-1]);after(0);return}
    pick=ti;render();
  }
  function render(){
    root.innerHTML='';
    const bar=el('div','bar');
    bar.append(el('span','stat','Ronde '+round+' · skor: '+NAMES.map((n,i)=>n+' '+scores[i]).join(' · ')),el('span','sp'),btn('Reset skor','',()=>{scores=[0,0,0,0];round=0;deal()}));
    root.append(bar);
    const f=el('div','felt');
    const seats=el('div','seats');
    for(let i=1;i<4;i++){
      const s=el('div','seat'+(turn===i&&!over?' turn':''));
      s.append(el('div','nm','<b>'+NAMES[i]+'</b><span>'+hands[i].length+' kartu</span>'));
      const bk=el('div','bk');
      if(over&&result){
        const wrap=el('div','');wrap.style.cssText='display:flex;gap:3px;flex-wrap:wrap;margin-top:6px';
        hands[i].forEach(t=>{const d=tileEl(t[0],t[1],'v');d.style.setProperty('--ds','13px');wrap.append(d)});
        s.append(wrap);
      }else{hands[i].forEach(()=>bk.append(el('i')));s.append(bk)}
      seats.append(s);
    }
    f.append(seats);
    const ch=el('div','chain');
    if(!chain.length)ch.append(el('span','empty','Meja kosong. 6-6 dibuka lebih dulu.'));
    chain.forEach((t,i)=>{
      const d=tileEl(t[0],t[1],t[0]===t[1]?'v':'h');
      if(i===0)d.classList.add('endL');
      if(i===chain.length-1)d.classList.add('endR');
      ch.append(d);
    });
    f.append(ch);
    if(chain.length)f.append(el('div','endinfo','<span>Ujung kiri: '+chain[0][0]+'</span><span>Ujung kanan: '+chain[chain.length-1][1]+'</span>'));
    f.append(el('div','say',info||''));
    const mine=turn===0&&!over?legal(0):[];
    const ok=new Set(mine.map(m=>m.t));
    const hd=el('div','hand');
    hands[0].forEach((t,i)=>{
      const d=tileEl(t[0],t[1],'v');
      if(ok.has(i)){
        d.classList.add('pl');if(pick===i)d.classList.add('pick');
        d.tabIndex=0;d.setAttribute('role','button');
        d.onclick=()=>clickTile(i);
        d.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();clickTile(i)}};
      }else if(!over&&turn===0)d.classList.add('dull');
      hd.append(d);
    });
    f.append(hd);
    if(pick!=null){
      const sd=el('div','sides');
      sd.append(btn('Taruh di kiri ('+chain[0][0]+')','primary',()=>{const t=pick;play(0,t,'L');after(0)}),
                btn('Taruh di kanan ('+chain[chain.length-1][1]+')','primary',()=>{const t=pick;play(0,t,'R');after(0)}));
      f.append(sd);
    }
    root.append(f);
    if(over){
      const n=el('div','note','<div><b>'+(result.w===0?'Kamu menang ronde ini!':result.w>0?NAMES[result.w]+' menang ronde ini':'Ronde seri')+'</b></div>');
      n.append(btn('Bagi kartu lagi','primary',()=>deal()));root.append(n);
    }
  }
  const inst={destroy(){T.clear()}};
  deal();
  return inst;
}

/* ---------- CAPSA SUSUN (13 kartu, 3 baris, lawan 3 bot) ---------- */
function royalty(f,m,b){
  let r=0;
  if(f[0]===3)r+=3;
  if(m[0]===6)r+=2;else if(m[0]===7)r+=8;else if(m[0]===8)r+=m[1]===14?20:10;
  if(b[0]===7)r+=4;else if(b[0]===8)r+=b[1]===14?10:5;
  return r;
}
function arrScore(a){
  const fv=evalHand(a.slice(0,3)),mv=evalHand(a.slice(3,8)),bv=evalHand(a.slice(8));
  const nf=num(fv),nm=num(mv),nb=num(bv);
  const st=x=>x/759375;
  const s=royalty(fv,mv,bv)*3+st(nb)+1.3*st(nm)+1.7*st(nf);
  return(nm<nf||nb<nm)?s-1000:s;
}
function bestArr(cards){
  let best=null,bs=-1e9;
  for(let r=0;r<30;r++){
    const a=r===0?cards.slice().sort((x,y)=>x.r-y.r):shuffle(cards.slice());
    let s=arrScore(a);
    for(let it=0;it<240;it++){
      const i=rnd(13),j=rnd(13);if(i===j)continue;
      [a[i],a[j]]=[a[j],a[i]];
      const s2=arrScore(a);
      if(s2>=s)s=s2;else[a[i],a[j]]=[a[j],a[i]];
    }
    if(s>bs){bs=s;best=a.slice()}
  }
  return[best.slice(0,3),best.slice(3,8),best.slice(8)];
}
function summarize(arr){
  const v=arr.map(evalHand),n=v.map(num);
  const foul=n[1]<n[0]||n[2]<n[1];
  return{arr,v,n,foul,roy:foul?0:royalty(v[0],v[1],v[2])};
}
function pairPts(A,B){
  if(A.foul&&B.foul)return 0;
  if(A.foul)return-(6+B.roy);
  if(B.foul)return 6+A.roy;
  let w=0;for(let k=0;k<3;k++)w+=Math.sign(A.n[k]-B.n[k]);
  let s=w;if(w===3)s+=3;if(w===-3)s-=3;
  return s+A.roy-B.roy;
}
function Capsa(box){
  const T=timers();
  const root=el('div','cps');box.appendChild(root);
  const NAMES=['Kamu',...botNames(3)],ROWN=['Depan','Tengah','Belakang'];
  let total=[0,0,0,0],round=0,hands4,pool,rows,sel,phase,res,busy=false;
  const byRank=(a,b)=>b.r-a.r||a.s-b.s;

  function deal(){Stats.arm('capsa');
    const d=shuffle(newDeck());
    hands4=[0,1,2,3].map(i=>d.slice(i*13,i*13+13));
    pool=hands4[0].slice().sort(byRank);
    rows=[Array(3).fill(null),Array(5).fill(null),Array(5).fill(null)];
    sel=null;phase='arrange';res=null;busy=false;round++;render();
  }
  function applyArr(arr){
    rows=arr.map(r=>r.slice());
    const used=new Set(arr.flat().map(c=>c.r*4+c.s));
    pool=hands4[0].filter(c=>!used.has(c.r*4+c.s)).sort(byRank);
    sel=null;render();
  }
  function auto(){
    busy=true;render();
    T.after(()=>{busy=false;applyArr(bestArr(hands4[0]))},30);
  }
  function reset(){
    pool=hands4[0].slice().sort(byRank);
    rows=[Array(3).fill(null),Array(5).fill(null),Array(5).fill(null)];sel=null;render();
  }
  function clickSlot(r,i){
    const cur=rows[r][i];
    if(cur){
      if(sel){rows[r][i]=sel;pool=pool.filter(c=>c!==sel);pool.push(cur);pool.sort(byRank);sel=null}
      else{rows[r][i]=null;pool.push(cur);pool.sort(byRank)}
    }else if(sel){rows[r][i]=sel;pool=pool.filter(c=>c!==sel);sel=null}
    render();
  }
  function lock(){
    busy=true;render();
    T.after(()=>{
      const arrs=[rows.map(r=>r.slice()),...[1,2,3].map(i=>bestArr(hands4[i]))];
      const S=arrs.map(summarize);
      const pts=[0,0,0,0],vs=[[],[],[],[]];
      for(let a=0;a<4;a++)for(let b=a+1;b<4;b++){
        const p=pairPts(S[a],S[b]);pts[a]+=p;pts[b]-=p;vs[a].push([b,p]);vs[b].push([a,-p]);
      }
      pts.forEach((p,i)=>total[i]+=p);
      res={S,pts,vs};phase='result';busy=false;render();
    },30);
  }
  function miniRow(cards){
    const d=el('div','mr mini');
    cards.forEach(c=>d.append(cardEl(c)));return d;
  }
  function render(){
    root.innerHTML='';
    const bar=el('div','bar');
    bar.append(el('span','stat','Ronde '+round+' · total: '+NAMES.map((n,i)=>n+' '+(total[i]>0?'+':'')+total[i]).join(' · ')),el('span','sp'),
      btn('Reset skor','',()=>{total=[0,0,0,0];round=0;deal()}));
    root.append(bar);
    const f=el('div','felt');
    if(phase==='arrange'){
      const placed=rows.flat().filter(Boolean).length;
      rows.forEach((r,ri)=>{
        const line=el('div','rowline');
        const full=r.every(Boolean);
        line.append(el('div','lab',ROWN[ri]+'<b>'+(full?handName(evalHand(r)):'')+'</b>'));
        const sl=el('div','slots');
        r.forEach((c,i)=>{
          const s=el('div','slot2');s.onclick=()=>clickSlot(ri,i);
          if(c)s.append(cardEl(c,'clk'));
          sl.append(s);
        });
        line.append(sl);f.append(line);
      });
      if(placed===13){
        const E=rows.map(r=>num(evalHand(r)));
        if(E[1]<E[0]||E[2]<E[1])f.append(el('p','foulmsg','Susunan mati: Belakang harus lebih kuat dari Tengah, dan Tengah dari Depan.'));
      }
      const pl=el('div','pool');
      if(busy)pl.append(el('span','muted','Bot sedang berpikir…'));
      pool.forEach(c=>{
        const e=cardEl(c,'clk'+(sel===c?' sel':''));
        e.onclick=()=>{sel=sel===c?null:c;render()};pl.append(e);
      });
      if(!pool.length&&!busy)pl.append(el('span','muted','Semua kartu sudah ditaruh.'));
      f.append(pl);
      root.append(f);
      const act=el('div','bar');act.style.marginTop='12px';
      const a=btn('Susun otomatis','',auto);a.disabled=busy;
      const r=btn('Kosongkan','',reset);r.disabled=busy;
      const l=btn('Adu dengan bot','primary',lock);l.disabled=busy||placed!==13;
      act.append(a,r,el('span','sp'),l);root.append(act);
    }else{
      const grid=el('div','res');
      res.S.forEach((s,i)=>{
        const b=el('div','pl-res'+(i===0?' me':''));
        b.append(el('h4','','<span>'+NAMES[i]+'</span><span class="pts '+(res.pts[i]>0?'pos':res.pts[i]<0?'neg':'')+'">'+(res.pts[i]>0?'+':'')+res.pts[i]+'</span>'));
        if(s.foul)b.append(el('div','foulmsg','Susunan mati'));
        s.arr.forEach((r,k)=>{
          b.append(el('div','hn',ROWN[k]+' · '+handName(s.v[k])));
          b.append(miniRow(r));
        });
        if(s.roy)b.append(el('div','hn','Bonus kombinasi: +'+s.roy));
        grid.append(b);
      });
      f.append(grid);
      const mine=res.vs[0].map(([j,p])=>NAMES[j]+' '+(p>0?'+':'')+p).join(' · ');
      f.append(el('div','vs','Kamu lawan bot: '+mine));
      root.append(f);
      Stats.rec('capsa',res.pts[0]>0?'w':res.pts[0]<0?'l':'d',{add:{pts:res.pts[0]}});
      const n=el('div','note','<div><b>'+(res.pts[0]>0?'Kamu untung '+res.pts[0]+' poin':res.pts[0]<0?'Kamu rugi '+(-res.pts[0])+' poin':'Impas')+'</b></div>');
      n.append(btn('Ronde berikutnya','primary',deal));root.append(n);
    }
    root.append(el('details','help','<summary>Aturan dan poin</summary><p>Susun 13 kartu jadi tiga baris: Depan (3), Tengah (5), Belakang (5). Kekuatan harus naik dari depan ke belakang, kalau tidak susunanmu mati dan kalah di semua baris.</p><p>Tiap baris yang menang +1, menang ketiganya +3 tambahan. Bonus kombinasi, dihitung selisihnya dengan lawan: Depan tiga sama +3. Tengah full house +2, four of a kind +8, straight flush +10 (royal +20). Belakang four of a kind +4, straight flush +5 (royal +10).</p><p>Ketuk kartu di bawah, lalu ketuk slot. Ketuk kartu di slot untuk mengembalikannya.</p>'));
  }
  deal();
  return{destroy(){T.clear()}};
}

function dl(a,b){
  const m=a.length,n=b.length,d=[];
  for(let i=0;i<=m;i++){d[i]=new Array(n+1).fill(0);d[i][0]=i}
  for(let j=0;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++){
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));

function lookupAnswer(input,index,loose){
  const k=dnorm(input).replace(/^(the|a|an) /,'');
  if(!k)return null;
  if(index.has(k))return Object.assign({corrected:false},index.get(k));
  let best=null,bl=0;
  const padded=' '+k+' ';
  for(const [key,v] of index){
    if(key.length>=3&&padded.includes(' '+key+' ')&&key.length>bl){best=v;bl=key.length}
  }
  if(best)return Object.assign({corrected:false},best);
  if(loose&&k.length>=4){
    let pk=null;
    for(const [key,v] of index){
      if(key.startsWith(k)&&(!pk||key.length<pk[0].length||(key.length===pk[0].length&&v.tier<pk[1].tier)))pk=[key,v];
    }
    if(pk)return Object.assign({corrected:true},pk[1]);
  }
  /* autocorrect: salah ketik, huruf tertukar, huruf kurang atau lebih */
  const cands=[[k,0]];
  if(k.includes(' '))k.split(' ').forEach(w=>{if(w.length>=4)cands.push([w,.4])});
  let bd=99,pick=null;
  for(const [word,pen] of cands){
    for(const [key,v] of index){
      if(Math.abs(key.length-word.length)>3)continue;
      const single=!key.includes(' ');
      if(pen&&!single)continue;
      const nn=Math.min(key.length,word.length);
      const lim=loose?(nn<=3?0:nn<=5?1:nn<=8?2:nn<=12?3:4):maxEdits(nn);
      if(!lim)continue;
      if(key.length<=(loose?5:4)&&key[0]!==word[0])continue;
      const d=dl(word,key);
      if(d>lim)continue;
      const sc=d+pen;
      if(sc<bd||(sc===bd&&pick&&v.tier<pick.tier)){bd=sc;pick=v}
    }
  }
  return pick?Object.assign({corrected:true},pick):null;
}

  /* ---------- bot ---------- */
  function botStep(){
    if(!S||S.over)return;
    const pi=S.turn,p=S.players[pi];
    if(!p||!p.alive||p.human)return;
    const L=S.pL,B=S.pB;
    const pl=L/((L+B)||1);
    const has=id=>p.items.indexOf(id);
    const opps=bySeat().filter(i=>i!==pi&&S.players[i].alive);
    let i;
    if(p.hp<p.max&&(i=has('bandage'))>=0)return useItem(pi,i);
    if(p.hp<=p.max-2&&p.hp>=2&&(i=has('pill'))>=0)return useItem(pi,i);
    if(p.k==null&&L>0&&B>0&&(i=has('lens'))>=0)return useItem(pi,i);
    let known=p.k;
    if(known==null&&!S.flipU){if(L===0)known='B';else if(B===0)known='L'}
    if(known==='B'&&opps.length&&(i=has('flip'))>=0){p.k='B';return useItem(pi,i)}
    if(known==='L'&&!S.sawed&&(i=has('saw'))>=0)return useItem(pi,i);
    if(known==null&&L>0&&B>0&&rf()<.45&&(i=has('soda'))>=0)return useItem(pi,i);
    const nx=nextAlive(pi);
    if(nx>=0&&nx!==pi&&!S.players[nx].cuffed&&(i=has('cuffs'))>=0&&rf()<.8)return useItem(pi,i,nx);
    const pick=()=>{
      let best=opps[0],bh=99;
      opps.forEach(j=>{const h=S.players[j].hp-(rf()*.4);if(h<bh){bh=h;best=j}});
      return best;
    };
    if(known==='L')return shoot(pi,pick());
    if(known==='B')return shoot(pi,pi);
    if(pl>.5)return shoot(pi,pick());
    if(pl<.5)return shoot(pi,(p.hp>1||pl<.34)?pi:pick());
    return shoot(pi,rf()<.5&&p.hp>1?pi:pick());
  }

  const cleanName=v=>(String(v==null?'':v).replace(/[^\p{L}\p{N} _.\-]/gu,'').trim().slice(0,12))||'Pemain';

    n.es=e;
    e.onopen=()=>{n.esTry=0;onEv('open')};
    e.onmessage=ev=>{
      let d;try{d=JSON.parse(ev.data)}catch(x){return}
      if(!d||d.event!=='message')return;
      if(d.id){if(n.seen.has(d.id))return;n.seen.add(d.id);if(n.seen.size>400)n.seen=new Set([...n.seen].slice(-200))}
      if(d.time)n.lastT=Math.max(n.lastT,d.time);
      let m;try{m=JSON.parse(d.message)}catch(x){return}
      if(!m||typeof m!=='object'||m.u===n.uid||typeof m.u!=='string')return;
      if(m.t==='need'){if(m.g===n.uid&&n.sent&&n.sent[m.q])nPost(n.sent[m.q],2);return}
      if(m.q!=null){
        /* langkah harus diproses berurutan; kalau ada yang bolong, tahan dulu dan minta kirim ulang */
        const last=n.lastQ[m.u]||0;
        if(m.q<=last)return;
        n.pend=n.pend||{};const pu=(n.pend[m.u]=n.pend[m.u]||{});pu[m.q]=m;
        let nx;
        while(NET===n&&(nx=pu[(n.lastQ[m.u]||0)+1])){delete pu[nx.q];n.lastQ[m.u]=nx.q;onMsg(nx)}
        if(NET===n&&Object.keys(pu).length){

        }

      }

/* ---------- BLACKJACK ---------- */
function Blackjack(box){
  const T=timers();
  const root=el('div','bj');box.appendChild(root);
  let bank=store.get('bj-bank',1000),shoe=[],bet=25,phase='bet',dealer=[],hands=[],ai=0,hole=true,msg='';
  if(!(bank>=5))bank=1000;if(bet>bank)bet=bank;
  const initShoe=()=>{shoe=[];for(let i=0;i<6;i++)shoe.push(...newDeck());shuffle(shoe)};
  const drawC=()=>{if(!shoe.length)initShoe();return shoe.pop()};
  const tv=c=>c.r===14?11:c.r>=10?10:c.r;
  function val(cs){let t=0,a=0;cs.forEach(c=>{t+=tv(c);if(c.r===14)a++});while(t>21&&a>0){t-=10;a--}return{t,soft:a>0&&t<=21}}
  const save=()=>store.set('bj-bank',bank);
  function deal(){Stats.arm('blackjack');
    if(bet<5||bet>bank)return;
    if(shoe.length<80)initShoe();
    bank-=bet;save();
    hands=[{c:[],bet,done:false,split:false,res:null}];dealer=[];
    hands[0].c.push(drawC());dealer.push(drawC());hands[0].c.push(drawC());dealer.push(drawC());
    hole=true;phase='player';ai=0;msg='';
    if(val(hands[0].c).t===21||val(dealer).t===21){hole=false;settle();return}
    render();
  }
  function nextHand(){
    const i=hands.findIndex(h=>!h.done);
    if(i<0){dealerTurn();return}
    ai=i;render();
  }
  function hit(){const h=hands[ai];h.c.push(drawC());if(val(h.c).t>=21)h.done=true;h.done?nextHand():render()}
  function stand(){hands[ai].done=true;nextHand()}
  function dbl(){
    const h=hands[ai];if(h.c.length!==2||bank<h.bet)return;
    bank-=h.bet;h.bet*=2;save();h.c.push(drawC());h.done=true;nextHand();
  }
  function split(){
    const h=hands[ai];
    if(hands.length!==1||h.c.length!==2||tv(h.c[0])!==tv(h.c[1])||bank<h.bet)return;
    bank-=h.bet;save();
    const h2={c:[h.c.pop()],bet:h.bet,done:false,split:true,res:null};
    h.split=true;h.c.push(drawC());h2.c.push(drawC());hands.push(h2);
    if(h.c[0].r===14){h.done=true;h2.done=true}
    else{if(val(h.c).t===21)h.done=true;if(val(h2.c).t===21)h2.done=true}
    nextHand();
  }
  function dealerTurn(){
    phase='dealer';hole=false;
    if(hands.every(h=>val(h.c).t>21)){settle();return}
    render();T.after(dstep,700);
  }
  function dstep(){
    if(val(dealer).t<17){dealer.push(drawC());render();T.after(dstep,700)}else settle();
  }
  function settle(){
    phase='over';hole=false;
    const dv=val(dealer).t,dbj=dealer.length===2&&dv===21;
    let net=0;
    hands.forEach(h=>{
      const pv=val(h.c).t,pbj=hands.length===1&&!h.split&&h.c.length===2&&pv===21;
      let pay=0,res;
      if(pv>21)res='Bust';
      else if(pbj&&!dbj){res='Blackjack';pay=h.bet*2.5}
      else if(dbj&&!pbj)res='Kalah';
      else if(pbj&&dbj){res='Seri';pay=h.bet}
      else if(dv>21||pv>dv){res='Menang';pay=h.bet*2}
      else if(pv===dv){res='Seri';pay=h.bet}
      else res='Kalah';
      h.res=res;bank+=pay;net+=pay-h.bet;
    });
    save();

/* ---------- TEXAS HOLD'EM (kamu + 3 bot) ---------- */
function equity(hole,board,opps,sims){
  const known=new Set(hole.concat(board).map(c=>c.r*4+c.s));
  const rest=newDeck().filter(c=>!known.has(c.r*4+c.s));
  const need=5-board.length+opps*2;
  let win=0;
  for(let s=0;s<sims;s++){
    const a=rest.slice();
    for(let i=0;i<need;i++){const j=i+rnd(a.length-i);[a[i],a[j]]=[a[j],a[i]]}
    const full=board.concat(a.slice(0,5-board.length));
    const mine=best7(hole.concat(full)).n;
    let top=-1,ties=0;
    for(let o=0;o<opps;o++){
      const k=5-board.length+o*2;
      const n=best7([a[k],a[k+1]].concat(full)).n;
      if(n>top){top=n;ties=1}else if(n===top)ties++;
    }
    if(mine>top)win+=1;else if(mine===top)win+=1/(ties+1);
  }
  return win/sims;
}
function Holdem(box){

  function resultText(o){

  function doMove(m,remote){
    const n=hist.length;

  function tap(i){

const Stats=(()=>{
  const K='maroe-stats';let d={};
  try{d=JSON.parse(localStorage.getItem(K))||{}}catch(e){}
  d.g=d.g||{};d.name=d.name||'';d.av=d.av|0;d.since=d.since||Date.now();
  let hook=null;
  const save=q=>{try{localStorage.setItem(K,JSON.stringify(d))}catch(e){}if(!q&&hook)hook()};
  const done={};
  return{get:()=>d,save,setHook:f=>{hook=f},arm:id=>{done[id]=0},
    reset:()=>{d.g={};d.since=Date.now();save()},
    rec(id,res,x){
      if(done[id])return;done[id]=1;x=x||{};
      const g=d.g[id]=d.g[id]||{p:0,w:0,l:0,d:0};g.a=g.a||{};g.mn=g.mn||{};g.mx=g.mx||{};

      for(const k in x.min||{})g.mn[k]=g.mn[k]==null?x.min[k]:Math.min(g.mn[k],x.min[k]);
      for(const k in x.max||{})g.mx[k]=g.mx[k]==null?x.max[k]:Math.max(g.mx[k],x.max[k]);

})();

      if(!d.name&&c.name){d.name=c.name;if(c.av!=null)d.av=c.av}
      if(c.since)d.since=Math.min(d.since,c.since);
      const cg=c.g||{};
      Object.keys(cg).forEach(id=>{if(!d.g[id]||(cg[id].p||0)>d.g[id].p)d.g[id]=cg[id]});
      Stats.save(true);
    }
    await push(x);
  }
  async function push(x){
    x=x||await api.init();if(!user)return;
    const d=Stats.get();
    await x.F.setDoc(x.F.doc(x.db,'users',user.uid),{name:d.name||'',av:d.av|0,since:d.since,g:d.g,updated:Date.now()});
  }
  api.signIn=async()=>{
    err='';const x=await api.init();
    try{await x.Au.signInWithPopup(x.auth,new x.Au.GoogleAuthProvider())}
    catch(e){err=e&&e.code==='auth/popup-closed-by-user'?'':e&&e.code==='auth/unauthorized-domain'?'Domain situs ini belum didaftarkan di Firebase.':'Login gagal ('+((e&&e.code)||'error')+').'}
    if(api.onChange)api.onChange();
  };
  api.signOut=async()=>{const x=await api.init();await x.Au.signOut(x.auth)};
  Stats.setHook(()=>{if(!user)return;clearTimeout(tmr);tmr=setTimeout(()=>push().catch(()=>{}),1500)});
  api.onChange=()=>{if(location.hash==='#profil')profilePage_redraw()};
  try{if(localStorage.getItem('maroe-auth'))setTimeout(()=>api.init().catch(()=>{}),800)}catch(e){}
  return api;
})();
const mmss=t=>{t=Math.round(t);return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')};
function avatar(i,sz){const a=el('span','pav');a.textContent=AVS[i%8];a.style.cssText='width:'+sz+'px;height:'+sz+'px;font-size:'+Math.round(sz*.55)+'px;background:'+AVC[i%8]+'22;color:'+AVC[i%8]+';border-color:'+AVC[i%8]+'66';return a}
function profilePage(){
  document.title='Profil · Board Game Maroe';subEl.textContent='Statistikmu';
  const d=Stats.get();
  const back=el('a','pback','← Semua meja');back.href='#';app.append(back);
  const head=el('div','phead'),av=avatar(d.av,64);
  const inp=el('input');inp.type='text';inp.maxLength=16;inp.placeholder='Nama panggilan';inp.value=d.name;inp.setAttribute('aria-label','Nama panggilan');
  inp.onchange=()=>{d.name=inp.value.trim();Stats.save()};
  head.append(av,inp);app.append(head);
  const pick=el('div','ppick');
  AVS.forEach((g,i)=>{const b=el('button','','');b.type='button';b.setAttribute('aria-label','Avatar '+(i+1));b.append(avatar(i,44));if(i===d.av)b.classList.add('on');
    b.onclick=()=>{d.av=i;Stats.save();profilePage_redraw()};pick.append(b)});
  app.append(pick);
  const acct=el('div','pacct');app.append(acct);
  {const u=Cloud.user();
    if(u){
      acct.append(el('div','pat','<b>Tersinkron ke akun Google</b><span>Statistik ikut ke HP lain yang kamu masuki.</span>'));
      const o=el('button','lchip','Keluar');o.type='button';o.onclick=()=>Cloud.signOut();acct.append(o);
    }else{
      acct.append(el('div','pat','<b>Simpan ke akun (opsional)</b><span>Masuk dengan Google supaya statistik ikut ke HP lain. Hanya nama, avatar, dan statistik yang disimpan; emailmu tidak ditampilkan.</span>'));
      const i=el('button','lchip on','Masuk dengan Google');i.type='button';i.onclick=()=>{i.disabled=true;Cloud.signIn().finally(()=>{i.disabled=false})};acct.append(i);
      Cloud.init().catch(()=>{});
    }
    if(Cloud.error())acct.append(el('div','pnote',Cloud.error()));
  }
  const rows=GAMES.filter(x=>d.g[x.id]);
  let P=0,W=0;rows.forEach(x=>{P+=d.g[x.id].p;W+=d.g[x.id].w});
  const sum=el('div','psum');
  [[P,'Total main'],[W,'Total menang'],[rows.length+'/'+GAMES.length,'Game dicoba']].forEach(([v,l])=>sum.append(el('div','pbox','<b>'+v+'</b><span>'+l+'</span>')));
  app.append(sum);
  app.append(el('div','lsec','<b>Per game</b>'));
  if(!rows.length)app.append(el('div','pempty','Belum ada permainan tercatat. Main satu ronde dan statistiknya muncul di sini.'));
  rows.forEach(x=>{
    const g=d.g[x.id],solo=x.id==='solitaire'||x.id==='sudoku'||x.id==='deepdive';
    const lab={w:'Menang',l:'Kalah',d:'Seri'};if(x.id==='holdem'){lab.w='Juara meja';lab.l='Bangkrut'}
    const c=el('div','pcard');c.append(el('div','pname',x.name));
    const bits=[];
    if(solo&&x.id!=='deepdive')bits.push('<b>'+g.p+'</b> selesai');
    else if(x.id==='deepdive')bits.push('<b>'+g.p+'</b> selam');
    else{bits.push('<b>'+g.w+'</b> '+lab.w);bits.push('<b>'+g.l+'</b> '+lab.l);if(g.d)bits.push('<b>'+g.d+'</b> '+lab.d)}
    c.append(el('div','pbits',bits.map(t=>'<span>'+t+'</span>').join('')));
    if(!solo&&g.p){const r=Math.round(g.w/g.p*100);c.append(el('div','pbar','<i style="width:'+r+'%"></i>'));c.append(el('div','pnote',r+'% menang'))}
    const ex=[];
    if(g.mn&&g.mn.t!=null)ex.push('Waktu terbaik '+mmss(g.mn.t));
    if(x.id==='blackjack'&&g.mx)ex.push('Chip terbanyak '+(g.mx.bank||0)+' · selisih total '+((g.a&&g.a.net)||0));
    if(x.id==='capsa')ex.push('Total poin '+((g.a&&g.a.pts)||0));
    if(x.id==='deepdive')ex.push('Skor terbaik '+((g.mx&&g.mx.best)||0)+' · total '+((g.a&&g.a.pts)||0));
    if(ex.length)c.append(el('div','pnote',ex.join(' · ')));
    app.append(c);
  });
  const foot=el('div','pfoot','Data tersimpan di browser ini saja, tanpa akun dan tanpa info pribadi.');
  const rs=el('button','lchip','Hapus statistik');rs.type='button';rs.onclick=()=>{if(confirm('Hapus semua statistik?')){Stats.reset();profilePage_redraw()}};
  app.append(foot,rs);
}
function profilePage_redraw(){app.innerHTML='';profilePage()}
const app=document.getElementById('app'),subEl=document.getElementById('sub');
let live=null;

  if(live){try{live.destroy()}catch(e){}live=null}

  const hp=location.hash.slice(1).split('/'),id=hp[0],arg=hp[1]||'',g=GAMES.find(x=>x.id===id);

      capsa:{g:'Lawan bot',m:'Vs 3 bot · 13 kartu',bg:fl('#3a2c14','#241a0b'),art:'<svg width="90" height="54" viewBox="0 0 90 54" aria-hidden="true"><g fill="#e4eee9"><rect x="8" y="4" width="14" height="18" rx="2"/><rect x="26" y="4" width="14" height="18" rx="2"/><rect x="44" y="4" width="14" height="18" rx="2"/><rect x="8" y="30" width="14" height="18" rx="2" opacity=".8"/><rect x="26" y="30" width="14" height="18" rx="2" opacity=".8"/><rect x="44" y="30" width="14" height="18" rx="2" opacity=".8"/><rect x="62" y="30" width="14" height="18" rx="2" opacity=".8"/></g></svg>'},
      blackjack:{g:'Lawan bot',m:'Vs bandar · hit, stand, split',bg:fl('#17382d','#0f2a21'),badge:'3:2',art:'<b class="lbn">21</b>'},
      holdem:{g:'Lawan bot',m:'Blind 10/20 · all-in',bg:fl('#3a1f23','#25131a'),art:'<svg width="90" height="50" viewBox="0 0 90 50" aria-hidden="true"><g stroke="#25131a" stroke-width="3"><circle cx="30" cy="28" r="16" fill="#cf3f3f"/><circle cx="52" cy="22" r="16" fill="#e0ad4c"/><circle cx="64" cy="32" r="12" fill="#e4eee9"/></g></svg>'},
      deadshell:{g:'Online',m:'1v1 atau free for all',bg:fl('#3b1a1a','#1f0e0e'),badge:'Online',art:'<svg width="80" height="40" viewBox="0 0 80 40" aria-hidden="true"><rect x="6" y="10" width="46" height="20" rx="3" fill="#cf3f3f"/><rect x="48" y="10" width="12" height="20" fill="#e0ad4c"/><path d="M60 10h6a4 4 0 014 4v12a4 4 0 01-4 4h-6z" fill="#e0ad4c"/></svg>'},
      chess:{g:'Online',m:'Lawan teman atau bot Lv 1–5',bg:fl('#2a2f3a','#161a22'),badge:'Online',art:K},
      solitaire:{g:'Sendirian',m:'Klondike · buka 1 atau 3',bg:fl('#17382d','#0f2a21'),art:'<svg width="80" height="54" viewBox="0 0 80 54" aria-hidden="true"><rect x="14" y="4" width="34" height="46" rx="5" fill="#e4eee9" transform="rotate(-8 31 27)"/><rect x="32" y="4" width="34" height="46" rx="5" fill="#fff"/><text x="40" y="28" font-family="Bricolage Grotesque,sans-serif" font-weight="800" font-size="22" fill="#1a2c25">A♠︎</text></svg>'},

      deepdive:{g:'Trivia',m:'',bg:'linear-gradient(#1b6a8e,#0a1a26)',wide:1,art:'<svg width="92" height="100%" viewBox="0 0 92 110" preserveAspectRatio="none" aria-hidden="true" style="position:absolute;inset:0"><g stroke="#8fd3f0" stroke-opacity=".5"><path d="M0 28h92M0 56h92M0 84h92"/></g><circle cx="46" cy="40" r="7" fill="#e0ad4c"/><path d="M46 47v40" stroke="#e0ad4c" stroke-width="1.5" stroke-dasharray="3 3"/></svg>'}
    };
    const GORD=['Lawan bot','Online','Sendirian','Trivia'];
    let last='',flt='Semua';try{last=localStorage.getItem('maroe-last')||''}catch(e){}
    const mkTile=x=>{
      const L=LB[x.id]||{g:'Sendirian',m:'',bg:fl('#17382d','#0f2a21'),art:'<b class="lbn">'+x.glyph+'</b>'};

    {const d=Stats.get();let P=0,W=0;Object.values(d.g).forEach(g=>{P+=g.p;W+=g.w});
      const a=el('a','lprof');a.href='#profil';a.append(avatar(d.av,44));
